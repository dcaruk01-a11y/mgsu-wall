<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Построй кампус · Игры МГСУ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="/theme.css">
<style>
body{min-height:100vh;display:flex;flex-direction:column;background:#0a1f3d;color:#fff;}
.top{padding:12px 0;}
.top .head{height:52px;padding:0 18px;}
.top .brand-logo{width:32px !important;height:32px !important;}
.top .brand-label{font-size:13px;}
.top nav a{padding:6px 12px;font-size:13px;}

.status-banner{
  position:fixed;top:0;left:0;right:0;z-index:99;
  background:#AC1422;color:#fff;padding:12px 20px;
  text-align:center;font-size:13px;font-weight:600;display:none;
  box-shadow:0 4px 20px rgba(172,20,34,0.4);
}
.status-banner.show{display:block;}
.status-banner small{display:block;font-size:11px;font-weight:400;opacity:0.9;margin-top:2px;}

.game{flex:1;padding:32px 16px 60px;display:flex;align-items:flex-start;justify-content:center;}
.card{width:100%;max-width:520px;}
.title{font-size:32px;font-weight:800;letter-spacing:-0.02em;margin-bottom:12px;text-align:center;}
.sub{font-size:15px;color:rgba(255,255,255,0.65);text-align:center;margin-bottom:36px;line-height:1.6;}

.option{
  width:100%;text-align:left;padding:20px 22px;border-radius:14px;
  background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.14);
  backdrop-filter:blur(12px);color:#fff;font-family:inherit;
  font-size:16px;font-weight:600;cursor:pointer;margin-bottom:12px;
  display:flex;align-items:center;gap:14px;
  transition:transform .15s, background .15s, border-color .15s;
  position:relative;overflow:hidden;
}
.option:hover{transform:translateY(-2px);background:rgba(255,255,255,0.1);border-color:rgba(255,255,255,0.3);}
.option.voted{border-color:#fff;background:rgba(255,255,255,0.15);}
.option:disabled{cursor:default;}

.option .bar{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,0.06);transition:width .4s;}
.option .content{position:relative;z-index:1;display:flex;align-items:center;gap:14px;width:100%;}
.option .emoji{font-size:26px;line-height:1;}
.option .text{flex:1;}
.option .votes{font-size:13px;color:rgba(255,255,255,0.7);font-weight:500;}

.own-form{margin-top:20px;display:flex;gap:10px;flex-wrap:wrap;}
.own-input{
  flex:1;min-width:180px;padding:14px 20px;border-radius:999px;
  border:1px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.06);
  color:#fff;font-family:inherit;font-size:15px;outline:none;
}
.own-input::placeholder{color:rgba(255,255,255,0.4);}
.btn-send{
  padding:14px 28px;border-radius:999px;border:0;
  background:#fff;color:#0F3C73;font-family:inherit;
  font-size:15px;font-weight:700;cursor:pointer;
}
.btn-send:disabled{opacity:0.5;cursor:not-allowed;}

.thanks{margin-top:24px;padding:16px 20px;border-radius:14px;background:rgba(74,222,128,0.12);border:1px solid rgba(74,222,128,0.3);font-size:14px;display:none;}
.thanks.show{display:block;}
.thanks b{color:#4ADE80;}
.reset{margin-top:24px;text-align:center;}
.reset button{background:transparent;border:0;color:rgba(255,255,255,0.4);font-family:inherit;font-size:12px;cursor:pointer;text-decoration:underline;}
</style>
</head><body>

<div class="status-banner" id="statusBanner">
  🔒 Технический перерыв
  <small id="statusBannerSub">Игры доступны только в учебное время</small>
</div>

<div class="top"><div class="wrap"><div class="head">
  <a class="brand" href="/glavnaya"><img src="/assets/Logo/logo.svg" alt="Лого" class="brand-logo"><span class="brand-label"><b>НИУ МГСУ</b> · Игры</span></a>
  <nav><a href="/glavnaya">Игры</a><a href="/privacy">О проекте</a></nav>
</div></div></div>

<div class="game"><div class="card">
  <div class="title">Построй кампус</div>
  <div class="sub">Что для тебя важнее всего починить в МГСУ? Твой голос попадёт в общую статистику.</div>
  <div id="options"></div>
  <div class="own-form">
    <input type="text" class="own-input" id="ownInput" placeholder="Свой вариант…" maxlength="60">
    <button class="btn-send" id="ownSend">Добавить</button>
  </div>
  <div class="thanks" id="thanks"><b>Спасибо!</b> Твой голос принят. Мы покажем результаты в конце недели.</div>
  <div id="campusProgress" style="display:none;margin-top:16px;padding:14px 18px;border-radius:12px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);font-size:14px;line-height:1.6;"></div>
  <div class="reset"><button id="resetBtn">Сбросить мой голос (для теста)</button></div>
</div></div>

<script>
/* ============ ПРОВЕРКА РАСПИСАНИЯ ============ */
let scheduleOpen = true;
async function checkScheduleStatus(){
  try{
    const r = await fetch('/status');
    const s = await r.json();
    scheduleOpen = !!s.open;
    const banner = document.getElementById('statusBanner');
    const sub = document.getElementById('statusBannerSub');
    if (!scheduleOpen){
      sub.textContent = 'Игры доступны только в учебное время: с ' + s.opens_at + ' до ' + s.closes_at;
      banner.classList.add('show');
    } else {
      banner.classList.remove('show');
    }
    render();
  }catch(e){}
}
checkScheduleStatus();
setInterval(checkScheduleStatus, 60000);

const LS_VOTED = 'mgsu_campus_voted';
const LS_OPTIONS = 'mgsu_campus_options';

const DEFAULT_OPTIONS = [
  {id:'vent',  emoji:'💨', text:'Починить вентиляцию', votes:0},
  {id:'maf',   emoji:'🔊', text:'Поставить мафы на Бродвей', votes:0},
  {id:'chair', emoji:'🪑', text:'Нормальные стулья в лекториях', votes:0},
];

let options = loadOptions();
let voted = localStorage.getItem(LS_VOTED);

function loadOptions(){
  try{
    const saved = JSON.parse(localStorage.getItem(LS_OPTIONS) || 'null');
    if (saved && Array.isArray(saved)) return saved;
  }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT_OPTIONS));
}
function saveOptions(){ localStorage.setItem(LS_OPTIONS, JSON.stringify(options)); }

function render(){
  const box = document.getElementById('options');
  box.innerHTML = '';
  const total = options.reduce((s,o) => s + o.votes, 0) || 1;

  options.forEach(opt => {
    const el = document.createElement('button');
    el.type = 'button';
    el.className = 'option' + (voted === opt.id ? ' voted' : '');
    const pct = Math.round(opt.votes / total * 100);
    el.innerHTML =
      '<div class="bar" style="width:' + pct + '%"></div>' +
      '<div class="content">' +
        '<span class="emoji">' + opt.emoji + '</span>' +
        '<span class="text">' + escapeHtml(opt.text) + '</span>' +
        '<span class="votes">' + opt.votes + ' · ' + pct + '%</span>' +
      '</div>';
    el.onclick = () => vote(opt.id);
    el.disabled = !!voted || !scheduleOpen;
    box.appendChild(el);
  });

  document.getElementById('thanks').classList.toggle('show', !!voted);
  document.getElementById('ownInput').disabled = !!voted || !scheduleOpen;
  document.getElementById('ownSend').disabled = !!voted || !scheduleOpen;
}

function vote(id){
  if (voted || !scheduleOpen) return;
  const opt = options.find(o => o.id === id);
  if (!opt) return;
  opt.votes++;
  voted = id;
  localStorage.setItem(LS_VOTED, voted);
  saveOptions();
  render();
  sendVote();
}

async function sendVote(){
  const token = localStorage.getItem('mgsu_token') || '';
  try{
    const headers = {'Content-Type':'application/json'};
    if (token) headers['Authorization'] = 'Bearer ' + token;
    const res = await fetch('/api/game/finish', {
      method:'POST',
      headers,
      body: JSON.stringify({game: 'campus', raw_score: 1})
    });
    const data = await res.json();
    const block = document.getElementById('campusProgress');
    if (!block) return;
    block.style.display = 'block';
    if (!data.logged_in){
      block.innerHTML = '💡 Хочешь монеты и топ? <a href="/auth" style="color:#4ADE80;text-decoration:none;font-weight:700;">Создай аккаунт</a>';
      return;
    }
    let html = '<div>🎯 Очков: <b>+' + data.points + '</b></div>';
    if (data.progress){
      html += '<div>💰 Монет: <b>' + data.progress.coins + '</b></div>';
      html += '<div>🔥 Серия: <b>' + data.progress.streak + '</b> дней';
      if (data.progress.streak_changed) html += ' <span style="color:#4ADE80;">+1</span>';
      html += '</div>';
    }
    if (data.tasks_completed && data.tasks_completed.length){
      data.tasks_completed.forEach(t => {
        html += '<div style="color:#4ADE80;">✓ ' + t.text + ' (+' + t.reward + ')</div>';
      });
    }
    block.innerHTML = html;
  }catch(e){}
}

document.getElementById('ownSend').onclick = () => {
  if (!scheduleOpen) return;
  const input = document.getElementById('ownInput');
  const text = input.value.trim();
  if (!text || voted) return;
  const id = 'own_' + Date.now();
  options.push({id, emoji:'✨', text, votes:1, own:true});
  voted = id;
  localStorage.setItem(LS_VOTED, voted);
  saveOptions();
  input.value = '';
  render();
};

document.getElementById('resetBtn').onclick = () => {
  localStorage.removeItem(LS_VOTED);
  voted = null;
  render();
};

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

render();
</script>

</body></html>
