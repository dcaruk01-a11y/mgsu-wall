
<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Грабли · Игры МГСУ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="/static/style.css">
<style>
body.grabli-page{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  user-select:none;
  -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
  padding-bottom:20px;
}
.grabli-top{padding:14px 0 0; position:relative; z-index:60;}

/* ===== HEADER PANEL ===== */
.game-panel{
  max-width:1100px;
  margin:14px auto 0;
  padding:0 16px;
  width:100%;
  box-sizing:border-box;
  display:grid;
  grid-template-columns:1fr 1fr 1fr 1fr;
  gap:10px;
}
.panel-cell{
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.14);
  border-radius:14px;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  padding:10px 14px;
  text-align:center;
}
.panel-label{
  font-size:10px;font-weight:700;letter-spacing:0.15em;
  text-transform:uppercase;color:rgba(255,255,255,0.5);
  margin-bottom:4px;
}
.panel-val{
  font-size:clamp(18px, 4.5vw, 26px);
  font-weight:900;color:#fff;letter-spacing:-0.02em;
  line-height:1;font-variant-numeric:tabular-nums;
}
.panel-val.low{color:#FF4D5E;}

/* ===== ORDER CARD ===== */
.order-card{
  max-width:1100px;
  margin:16px auto 0;
  padding:0 16px;
  width:100%;
  box-sizing:border-box;
}
.order-box{
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.14);
  border-radius:18px;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  padding:16px 20px;
}
.order-head{
  display:flex;align-items:center;justify-content:center;
  gap:10px;margin-bottom:12px;
}
.order-head-emoji{font-size:22px;}
.order-head-text{
  font-size:12px;font-weight:700;
  letter-spacing:0.15em;text-transform:uppercase;
  color:rgba(255,255,255,0.7);
}
.order-items{
  display:flex;justify-content:center;
  gap:12px;flex-wrap:wrap;
}
.order-item{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  min-width:64px;
}
.order-item-emoji{
  font-size:36px;line-height:1;
  filter:drop-shadow(0 4px 12px rgba(0,0,0,0.3));
}
.order-item-name{
  font-size:11px;font-weight:600;
  color:rgba(255,255,255,0.75);
  text-align:center;
  max-width:80px;
}

/* ===== TRAY ===== */
.tray-area{
  max-width:1100px;
  margin:16px auto 0;
  padding:0 16px;
  width:100%;
  box-sizing:border-box;
}
.tray{
  background:linear-gradient(180deg, rgba(255,255,255,0.04) 0%, rgba(255,255,255,0.08) 100%);
  border:1px solid rgba(255,255,255,0.15);
  border-radius:20px;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  padding:18px;
  display:flex;
  justify-content:center;
  gap:14px;
  flex-wrap:wrap;
  min-height:110px;
  align-items:center;
  transition:box-shadow .25s, border-color .25s;
}
.tray.good{box-shadow:0 0 0 2px #7BE37B inset; border-color:#7BE37B;}
.tray.bad{box-shadow:0 0 0 2px #FF4D5E inset; border-color:#FF4D5E;}
.tray-slot{
  width:90px;height:90px;
  border-radius:14px;
  border:2px dashed rgba(255,255,255,0.18);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:4px;
  position:relative;
  transition:transform .15s, border-color .15s, background .15s;
}
.tray-slot.filled{
  border-style:solid;
  border-color:rgba(255,255,255,0.28);
  background:rgba(255,255,255,0.05);
}
.tray-slot.wrong{
  border-color:#FF4D5E;
  background:rgba(255,77,94,0.12);
  animation:shake .3s;
}
@keyframes shake{
  0%,100%{transform:translateX(0);}
  25%{transform:translateX(-4px);}
  75%{transform:translateX(4px);}
}
.tray-slot-empty{
  font-size:11px;font-weight:600;
  color:rgba(255,255,255,0.35);
  letter-spacing:0.1em;text-transform:uppercase;
}
.tray-slot-emoji{font-size:38px;line-height:1;}
.tray-slot-name{font-size:10px;font-weight:600;color:rgba(255,255,255,0.7);text-align:center;padding:0 4px;}

.tray-actions{
  display:flex;justify-content:center;
  gap:10px;margin-top:14px;
}
.btn-serve{
  padding:14px 40px;
  border-radius:999px;border:0;
  background:#fff;color:var(--blue);
  font-family:inherit;font-size:15px;font-weight:700;
  cursor:pointer;
  box-shadow:0 12px 30px rgba(0,0,0,0.3);
  transition:transform .15s;
}
.btn-serve:hover{transform:translateY(-2px);}
.btn-serve:active{transform:scale(0.98);}
.btn-serve:disabled{opacity:0.5;cursor:not-allowed;transform:none;}

/* ===== MACHINES ===== */
.machines{
  max-width:1100px;
  margin:20px auto 0;
  padding:0 16px;
  width:100%;
  box-sizing:border-box;
  display:grid;
  grid-template-columns:repeat(4, 1fr);
  gap:12px;
}
.machine{
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:16px;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  padding:12px;
  display:flex;flex-direction:column;gap:10px;
}
.machine-head{
  display:flex;align-items:center;gap:8px;
  padding-bottom:8px;
  border-bottom:1px solid rgba(255,255,255,0.1);
}
.machine-num{
  width:22px;height:22px;border-radius:6px;
  background:rgba(255,255,255,0.1);
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:800;color:rgba(255,255,255,0.75);
  flex-shrink:0;
}
.machine-name{
  font-size:11px;font-weight:700;
  letter-spacing:0.13em;text-transform:uppercase;
  color:rgba(255,255,255,0.65);
}
.machine-opts{
  display:grid;
  grid-template-columns:repeat(2, 1fr);
  gap:8px;
}
.opt{
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:10px;
  padding:10px 6px;
  cursor:pointer;font-family:inherit;
  color:#fff;
  display:flex;flex-direction:column;align-items:center;gap:4px;
  transition:all .15s;
  -webkit-tap-highlight-color:transparent;
}
.opt:hover{
  background:rgba(255,255,255,0.1);
  border-color:rgba(255,255,255,0.25);
  transform:translateY(-2px);
}
.opt:active{transform:scale(0.96);}
.opt.active{
  background:rgba(123,227,123,0.15);
  border-color:#7BE37B;
}
.opt-emoji{font-size:28px;line-height:1;}
.opt-name{font-size:9px;font-weight:600;color:rgba(255,255,255,0.7);text-align:center;line-height:1.2;}

/* ===== OVERLAYS ===== */
.overlay{
  position:fixed;inset:0;
  background:rgba(5,14,31,0.92);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:20px;
  padding:32px 20px;
  z-index:50;text-align:center;
  overflow-y:auto;
  transition:opacity .3s;
}
.overlay.hide{opacity:0;pointer-events:none;}

.start-title{
  font-size:clamp(24px, 6vw, 34px);
  font-weight:900;color:#fff;
  letter-spacing:-0.02em;line-height:1.15;
}
.start-sub{
  font-size:15px;color:rgba(255,255,255,0.7);
  max-width:420px;line-height:1.6;
}

.canteens{
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:14px;
  max-width:820px;width:100%;
  margin-top:8px;
}
.canteen{
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.14);
  border-radius:16px;
  padding:22px 16px;
  cursor:pointer;font-family:inherit;color:#fff;
  display:flex;flex-direction:column;align-items:center;gap:10px;
  transition:all .18s;
  -webkit-tap-highlight-color:transparent;
  text-align:center;
}
.canteen:hover{
  background:rgba(255,255,255,0.1);
  border-color:rgba(255,255,255,0.3);
  transform:translateY(-3px);
}
.canteen-ic{font-size:42px;line-height:1;}
.canteen-name{font-size:15px;font-weight:800;letter-spacing:-0.01em;line-height:1.25;}
.canteen-meta{font-size:12px;color:rgba(255,255,255,0.6);font-weight:600;}
.canteen-mult{
  font-size:11px;font-weight:800;letter-spacing:0.1em;
  padding:4px 10px;border-radius:999px;
  background:rgba(255,216,77,0.15);
  color:#FFD84D;border:1px solid rgba(255,216,77,0.3);
}

.finish-emoji{font-size:80px;line-height:1;filter:drop-shadow(0 12px 40px rgba(255,255,255,0.15));}
.finish-rank{
  font-size:clamp(24px, 7vw, 32px);font-weight:900;color:#fff;letter-spacing:-0.02em;
}
.finish-score{
  font-size:clamp(52px, 14vw, 80px);font-weight:900;color:#fff;
  letter-spacing:-0.04em;line-height:1;font-variant-numeric:tabular-nums;
}
.finish-label{
  font-size:11px;font-weight:700;letter-spacing:0.18em;
  text-transform:uppercase;color:rgba(255,255,255,0.5);
}
.finish-stats{
  display:flex;gap:22px;flex-wrap:wrap;justify-content:center;
  font-size:14px;color:rgba(255,255,255,0.75);
}
.finish-stats b{color:#fff;font-size:20px;display:block;font-weight:800;margin-bottom:2px;}
.finish-actions{
  display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:12px;
}
.btn-big{
  display:inline-flex;align-items:center;justify-content:center;
  gap:10px;padding:16px 36px;border-radius:999px;
  background:#fff;color:var(--blue);
  font-family:inherit;font-size:16px;font-weight:700;
  text-decoration:none;border:0;cursor:pointer;
  transition:transform .15s,box-shadow .15s;
  box-shadow:0 12px 30px rgba(0,0,0,0.3);
  min-width:200px;
}
.btn-big:hover{transform:translateY(-2px);}
.btn-big:active{transform:scale(0.98);}
.btn-ghost{
  background:rgba(255,255,255,0.08);color:#fff;
  border:1px solid rgba(255,255,255,0.2);box-shadow:none;
}

/* ===== FLASH ===== */
.flash{
  position:fixed;top:50%;left:50%;
  transform:translate(-50%,-50%);
  font-size:44px;font-weight:900;color:#fff;
  pointer-events:none;z-index:80;
  text-shadow:0 4px 24px rgba(0,0,0,0.5);
  animation:flashUp 1s ease-out forwards;
}
.flash.plus{color:#7BE37B;}
.flash.minus{color:#FF4D5E;}
@keyframes flashUp{
  0%{opacity:0;transform:translate(-50%,-30%) scale(0.6);}
  20%{opacity:1;transform:translate(-50%,-50%) scale(1.15);}
  70%{opacity:1;}
  100%{opacity:0;transform:translate(-50%,-120%) scale(1);}
}

.toast{
  position:fixed;bottom:30px;left:50%;
  transform:translateX(-50%) translateY(60px);
  background:#fff;color:var(--blue);
  padding:12px 24px;border-radius:999px;
  font-size:14px;font-weight:600;
  box-shadow:0 12px 32px rgba(0,0,0,0.3);
  z-index:100;opacity:0;transition:all .3s;
  pointer-events:none;text-align:center;max-width:90vw;
}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;}

@media(max-width:900px){
  .machines{grid-template-columns:repeat(2, 1fr);}
}
@media(max-width:640px){
  .game-panel{grid-template-columns:repeat(4, 1fr);gap:6px;}
  .panel-cell{padding:8px 6px;border-radius:10px;}
  .panel-label{font-size:9px;}
  .order-item-emoji{font-size:30px;}
  .order-item-name{font-size:10px;max-width:60px;}
  .tray-slot{width:72px;height:72px;border-radius:12px;}
  .tray-slot-emoji{font-size:30px;}
  .tray-slot-name{font-size:9px;}
  .machines{grid-template-columns:1fr 1fr;gap:8px;padding:0 10px;}
  .machine{padding:10px;border-radius:12px;}
  .machine-name{font-size:10px;letter-spacing:0.08em;}
  .opt{padding:8px 4px;border-radius:8px;}
  .opt-emoji{font-size:24px;}
  .opt-name{font-size:8px;}
  .canteens{grid-template-columns:1fr;max-width:340px;}
  .canteen{padding:16px 14px;}
  .canteen-ic{font-size:34px;}
  .finish-actions{flex-direction:column;width:100%;max-width:280px;}
  .btn-big{width:100%;min-width:0;}
}
</style>
</head><body class="grabli-page">

<div class="grabli-top">
  <div class="wrap">
    <div class="head">
      <a class="brand" href="/games">
        <img src="/assets/Logo/logo.svg" alt="Лого" class="brand-logo">
        <span class="brand-label"><b>НИУ МГСУ</b> · Игры</span>
      </a>
      <nav>
        <a href="/games">Игры</a>
        <a href="/privacy">О проекте</a>
      </nav>
    </div>
  </div>
</div>

<!-- HEADER PANEL -->
<div class="game-panel" id="gamePanel" style="display:none;">
  <div class="panel-cell">
    <div class="panel-label">Очки</div>
    <div class="panel-val" id="scoreVal">0</div>
  </div>
  <div class="panel-cell">
    <div class="panel-label">Серия</div>
    <div class="panel-val" id="streakVal">0</div>
  </div>
  <div class="panel-cell">
    <div class="panel-label">Заказ</div>
    <div class="panel-val" id="roundVal">1</div>
  </div>
  <div class="panel-cell">
    <div class="panel-label">Время</div>
    <div class="panel-val" id="timeVal">60</div>
  </div>

<!-- ORDER -->
<div class="order-card" id="orderCard" style="display:none;">
  <div class="order-box">
    <div class="order-head">
      <span class="order-head-emoji">🎓</span>
      <span class="order-head-text">Студент заказал</span>
    </div>
    <div class="order-items" id="orderItems"></div>
  </div>
</div>

<!-- TRAY -->
<div class="tray-area" id="trayArea" style="display:none;">
  <div class="tray" id="tray"></div>

    <button class="btn-serve" id="serveBtn" disabled>Подать заказ</button>
  </div>
</div>

<!-- MACHINES -->
<div class="machines" id="machines" style="display:none;"></div>

<!-- START OVERLAY -->
<div class="overlay" id="startOv">
  <div class="start-title">Грабли МГСУ</div>
  <div class="start-sub">Студент заказывает еду — собери поднос и подай. Выбирай столовую:</div>
  <div class="canteens">
    <button class="canteen" onclick="startGame('broadway')">
      <span class="canteen-ic">🥐</span>
      <span class="canteen-name">Буфет на Бродвее</span>
      <span class="canteen-meta">Быстрые заказы · 75 сек</span>
      <span class="canteen-mult">×1</span>
    </button>
    <button class="canteen" onclick="startGame('lower')">
      <span class="canteen-ic">🍜</span>
      <span class="canteen-name">Нижние Грабли</span>
      <span class="canteen-meta">Полный обед · 60 сек</span>
      <span class="canteen-mult">×1.5</span>
    </button>
    <button class="canteen" onclick="startGame('upper')">
      <span class="canteen-ic">🥘</span>
      <span class="canteen-name">Верхние Грабли</span>
      <span class="canteen-meta">Сложный заказ · 45 сек</span>
      <span class="canteen-mult">×2</span>
    </button>
  </div>
</div>

<!-- FINISH OVERLAY -->
<div class="overlay hide" id="finishOv">
  <div class="finish-emoji" id="finishEmoji">🍽️</div>
  <div class="finish-rank" id="finishRank">Стажёр</div>
  <div class="finish-score" id="finishScore">0</div>
  <div class="finish-label">очков</div>
  <div class="finish-stats">
    <div><b id="finishServed">0</b>заказов подано</div>
    <div><b id="finishStreak">0</b>лучшая серия</div>
  </div>
  <div class="finish-actions">
    <button class="btn-big" id="againBtn" type="button">Ещё раз</button>

<div class="toast" id="toast"></div>

<script>
/* ============ ДАННЫЕ ============ */
const CATEGORIES = [
  {key:'first',  name:'Первое',  num:1, items:[
    {emoji:'🍲', name:'Борщ'},
    {emoji:'🍜', name:'Щи'},
    {emoji:'🥣', name:'Лапша'},
    {emoji:'🍵', name:'Крем-суп'}
  ]},
  {key:'main',   name:'Второе',  num:2, items:[
    {emoji:'🍗', name:'Котлета'},
    {emoji:'🍝', name:'Макароны'},
    {emoji:'🥩', name:'Стейк'},
    {emoji:'🐟', name:'Рыба'}
  ]},
  {key:'salad',  name:'Салат',   num:3, items:[
    {emoji:'🥗', name:'Оливье'},
    {emoji:'🥬', name:'Цезарь'},
    {emoji:'🍅', name:'Винегрет'},
    {emoji:'🥒', name:'Овощной'}
  ]},
  {key:'drink',  name:'Напиток', num:4, items:[
    {emoji:'☕', name:'Чай'},
    {emoji:'🥤', name:'Компот'},
    {emoji:'🍹', name:'Морс'},
    {emoji:'💧', name:'Вода'}
  ]}
];

const CANTEENS = {
  broadway: {name:'Буфет на Бродвее', time:75, mult:1,   cats:['main','salad','drink']},
  lower:    {name:'Нижние Грабли',    time:60, mult:1.5, cats:['first','main','salad','drink']},
  upper:    {name:'Верхние Грабли',   time:45, mult:2,   cats:['first','main','salad','drink']}
};

/* ============ СОСТОЯНИЕ ============ */
let state = null;

function newState(canteenKey){
  const cfg = CANTEENS[canteenKey];
  return {
    canteenKey,
    cfg,
    score: 0,
    streak: 0,
    bestStreak: 0,
    served: 0,
    round: 1,
    timeLeft: cfg.time,
    tray: {},
    order: null,
    running: true,
    timerId: null
  };
}

function pickOrder(){
  const keys = state.cfg.cats;
  const order = {};
  for (const k of keys){
    const cat = CATEGORIES.find(c => c.key === k);
    const idx = Math.floor(Math.random() * cat.items.length);
    order[k] = idx;
  }
  return order;
}

/* ============ РЕНДЕР ============ */
function renderOrder(){
  const el = document.getElementById('orderItems');
  el.innerHTML = '';
  for (const k of state.cfg.cats){
    const cat = CATEGORIES.find(c => c.key === k);
    const item = cat.items[state.order[k]];
    const div = document.createElement('div');
    div.className = 'order-item';
    div.innerHTML = `
      <span class="order-item-emoji">${item.emoji}</span>
      <span class="order-item-name">${item.name}</span>
    `;
    el.appendChild(div);
  }
}

function renderTray(){
  const tray = document.getElementById('tray');
  tray.innerHTML = '';
  const keys = state.cfg.cats;
  for (const k of keys){
    const cat = CATEGORIES.find(c => c.key === k);
    const slot = document.createElement('div');
    slot.className = 'tray-slot';
    const picked = state.tray[k];
    if (picked !== undefined){
      const item = cat.items[picked];
      slot.classList.add('filled');
      slot.innerHTML = `
        <span class="tray-slot-emoji">${item.emoji}</span>
        <span class="tray-slot-name">${item.name}</span>
      `;
    } else {
      slot.innerHTML = `<span class="tray-slot-empty">${cat.name}</span>`;
    }
    slot.dataset.cat = k;
    tray.appendChild(slot);
  }
  // включить/выключить кнопку
  const filled = keys.every(k => state.tray[k] !== undefined);
  document.getElementById('serveBtn').disabled = !filled;
}

function renderMachines(){
  const wrap = document.getElementById('machines');
  wrap.innerHTML = '';
  for (const k of state.cfg.cats){
    const cat = CATEGORIES.find(c => c.key === k);
    const m = document.createElement('div');
    m.className = 'machine';
    m.innerHTML = `
      <div class="machine-head">
        <div class="machine-num">${cat.num}</div>
        <div class="machine-name">${cat.name}</div>
      </div>
      <div class="machine-opts" data-cat="${k}"></div>
    `;
    const opts = m.querySelector('.machine-opts');
    cat.items.forEach((item, idx) => {
      const b = document.createElement('button');
      b.className = 'opt';
      b.type = 'button';
      b.dataset.cat = k;
      b.dataset.idx = idx;
      b.innerHTML = `
        <span class="opt-emoji">${item.emoji}</span>
        <span class="opt-name">${item.name}</span>
      `;
      b.addEventListener('click', () => pickItem(k, idx));
      opts.appendChild(b);
    });
    wrap.appendChild(m);
  }
}

function renderPanel(){
  document.getElementById('scoreVal').textContent = state.score;
  document.getElementById('streakVal').textContent = state.streak;
  document.getElementById('roundVal').textContent = state.round;
  const tv = document.getElementById('timeVal');
  tv.textContent = state.timeLeft;
  tv.classList.toggle('low', state.timeLeft <= 10);
}

function highlightActiveOptions(){
  document.querySelectorAll('.opt').forEach(b => {
    const k = b.dataset.cat;
    const idx = +b.dataset.idx;
    b.classList.toggle('active', state.tray[k] === idx);
  });
}

/* ============ ИГРА ============ */
function pickItem(catKey, idx){
  if (!state.running) return;
  state.tray[catKey] = idx;
  renderTray();
  highlightActiveOptions();
}

function serve(){
  if (!state.running) return;
  const keys = state.cfg.cats;

  let correctCount = 0;
  let wrongCats = [];
  for (const k of keys){
    if (state.tray[k] === state.order[k]){
      correctCount++;
    } else {
      wrongCats.push(k);
    }
  }

  const allCorrect = correctCount === keys.length;
  const tray = document.getElementById('tray');

  // Подсветка неверных
  if (!allCorrect){
    tray.classList.add('bad');
    wrongCats.forEach(k => {
      const slot = tray.querySelector(`.tray-slot[data-cat="${k}"]`);
      if (slot) slot.classList.add('wrong');
    });
  } else {
    tray.classList.add('good');
  }

  // Очки
  const base = 40;
  const points = allCorrect ? Math.round(base * keys.length * state.cfg.mult) : 0;
  const penalty = allCorrect ? 0 : Math.round(15 * wrongCats.length * state.cfg.mult);

  if (allCorrect){
    state.score += points;
    state.streak += 1;
    if (state.streak > state.bestStreak) state.bestStreak = state.streak;
    state.served += 1;
    showFlash('+' + points, 'plus');
  } else {
    state.score = Math.max(0, state.score - penalty);
    state.streak = 0;
    showFlash('−' + penalty, 'minus');
  }

  renderPanel();

  // Следующий заказ через паузу
  setTimeout(() => {
    tray.classList.remove('good', 'bad');
    state.tray = {};
    state.order = pickOrder();
    state.round += 1;
    renderOrder();
    renderTray();
    highlightActiveOptions();
    renderPanel();
  }, allCorrect ? 600 : 900);
}

/* ============ ТАЙМЕР ============ */
function tick(){
  state.timeLeft -= 1;
  renderPanel();
  if (state.timeLeft <= 0) endGame();
}

function startGame(canteenKey){
  state = newState(canteenKey);
  state.order = pickOrder();

  document.getElementById('startOv').classList.add('hide');
  document.getElementById('finishOv').classList.add('hide');
  document.getElementById('gamePanel').style.display = '';
  document.getElementById('orderCard').style.display = '';
  document.getElementById('trayArea').style.display = '';
  document.getElementById('machines').style.display = '';

  renderOrder();
  renderTray();
  renderMachines();
  renderPanel();

  state.timerId = setInterval(tick, 1000);
}

function endGame(){
  state.running = false;
  clearInterval(state.timerId);

  let rank = 'Стажёр', emoji = '🥄';
  if (state.score >= 600)      { rank = 'Шеф Грабель';    emoji = '👨‍🍳'; }
  else if (state.score >= 350) { rank = 'Повар';           emoji = '🍳'; }
  else if (state.score >= 150) { rank = 'Раздатчик';       emoji = '🥘'; }
  else if (state.score >= 50)  { rank = 'Помощник';        emoji = '🍽️'; }

  document.getElementById('finishEmoji').textContent = emoji;
  document.getElementById('finishRank').textContent = rank;
  document.getElementById('finishScore').textContent = state.score;
  document.getElementById('finishServed').textContent = state.served;
  document.getElementById('finishStreak').textContent = state.bestStreak;

  document.getElementById('gamePanel').style.display = 'none';
  document.getElementById('orderCard').style.display = 'none';
  document.getElementById('trayArea').style.display = 'none';
  document.getElementById('machines').style.display = 'none';
  document.getElementById('finishOv').classList.remove('hide');
}

/* ============ УТИЛИТЫ ============ */
function showFlash(text, cls){
  const el = document.createElement('div');
  el.className = 'flash ' + cls;
  el.textContent = text;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1100);
}

function showToast(text){
  const t = document.getElementById('toast');
  t.textContent = text;
  t.classList.add('show');
  clearTimeout(t._id);
  t._id = setTimeout(() => t.classList.remove('show'), 1800);
}

/* ============ INIT ============ */
document.getElementById('serveBtn').addEventListener('click', serve);
document.getElementById('againBtn').addEventListener('click', () => {
  document.getElementById('finishOv').classList.add('hide');
  document.getElementById('startOv').classList.remove('hide');
});
</script>

</body></html>
