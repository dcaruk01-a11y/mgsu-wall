<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Рейтинги · Игры МГСУ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/static/site-header.css">
<style>
.ratings-wrap{max-width:720px;margin:0 auto;padding:24px 16px 48px;}

.ratings-hero{padding:20px 0 24px;text-align:center;}
.ratings-title{font-size:clamp(32px,6vw,52px);font-weight:800;letter-spacing:-0.03em;line-height:1;margin-bottom:10px;color:inherit;}
.ratings-sub{font-size:15px;opacity:0.7;}

.my-card{
  padding:20px 22px;border-radius:16px;
  background:rgba(128,128,128,0.10);
  border:1px solid rgba(128,128,128,0.25);
  margin-bottom:20px;
}
.my-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:12px;flex-wrap:wrap;}
.my-name{font-size:17px;font-weight:800;color:inherit;word-break:break-word;}
.my-coins{font-size:14px;font-weight:700;color:#FFD700;}
.my-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.my-stat{padding:12px;border-radius:10px;background:rgba(128,128,128,0.10);text-align:center;}
.my-stat-label{font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;opacity:0.6;margin-bottom:6px;}
.my-stat-value{font-size:20px;font-weight:800;color:inherit;font-variant-numeric:tabular-nums;line-height:1;}

.tabs{display:flex;background:rgba(128,128,128,0.10);border-radius:999px;padding:4px;margin-bottom:20px;}
.tab{flex:1;padding:12px;border:0;background:transparent;color:inherit;font-family:inherit;font-size:13px;font-weight:700;border-radius:999px;cursor:pointer;opacity:0.6;transition:all .15s;}
.tab.active{background:rgba(128,128,128,0.25);opacity:1;}

.tab-panel{display:none;}
.tab-panel.active{display:block;}

.rating-list{display:flex;flex-direction:column;gap:8px;}
.rating-row{
  display:flex;align-items:center;gap:14px;
  padding:14px 18px;border-radius:14px;
  background:rgba(128,128,128,0.10);
  border:1px solid rgba(128,128,128,0.18);
}
.rating-row.me{background:rgba(111,168,255,0.14);border-color:rgba(111,168,255,0.5);}
.rating-row.top-1{background:linear-gradient(90deg,rgba(255,215,0,0.18),rgba(128,128,128,0.08));border-color:rgba(255,215,0,0.45);}
.rating-row.top-2{background:linear-gradient(90deg,rgba(192,192,192,0.16),rgba(128,128,128,0.08));border-color:rgba(192,192,192,0.4);}
.rating-row.top-3{background:linear-gradient(90deg,rgba(205,127,50,0.16),rgba(128,128,128,0.08));border-color:rgba(205,127,50,0.4);}

.rating-pos{
  width:36px;height:36px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:800;
  background:rgba(128,128,128,0.18);
  flex-shrink:0;
  color:inherit;
}
.top-1 .rating-pos{background:#FFD700;color:#1a1a1a;}
.top-2 .rating-pos{background:#C0C0C0;color:#1a1a1a;}
.top-3 .rating-pos{background:#CD7F32;color:#fff;}

.rating-info{flex:1;min-width:0;}
.rating-nick{font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:inherit;}
.rating-games{font-size:11px;opacity:0.6;margin-top:2px;letter-spacing:0.05em;}
.rating-score{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;flex-shrink:0;color:inherit;}

.empty{text-align:center;padding:60px 20px;opacity:0.6;font-size:14px;}
.loading{text-align:center;padding:60px 20px;opacity:0.6;font-size:14px;}

.me-hint{
  margin-bottom:20px;padding:14px 18px;border-radius:12px;
  background:rgba(128,128,128,0.10);border:1px dashed rgba(128,128,128,0.35);
  font-size:13px;line-height:1.6;opacity:0.9;
}
.me-hint a{color:#4ADE80;text-decoration:none;font-weight:700;}
.me-hint a:hover{text-decoration:underline;}

@media(max-width:520px){
  .my-stat{padding:10px 6px;}
  .my-stat-value{font-size:17px;}
  .rating-score{font-size:17px;}
}
</style>
</head><body>

<div id="siteHeader"></div>

<div class="ratings-wrap">

  <div class="ratings-hero">
    <div class="ratings-title">🏆 Рейтинги</div>
    <div class="ratings-sub" id="subText">Топ игроков МГСУ</div>
  </div>

  <div id="myCardBox"></div>

  <div class="tabs">
    <button class="tab active" data-tab="day">Сегодня</button>
    <button class="tab" data-tab="week">Неделя</button>
    <button class="tab" data-tab="alltime">Всё время</button>
  </div>

  <div class="tab-panel active" id="panelDay">
    <div class="rating-list" id="listDay"><div class="loading">Загрузка…</div></div>
  </div>
  <div class="tab-panel" id="panelWeek">
    <div class="rating-list" id="listWeek"><div class="loading">Загрузка…</div></div>
  </div>
  <div class="tab-panel" id="panelAll">
    <div class="rating-list" id="listAll"><div class="loading">Загрузка…</div></div>
  </div>

</div>

<div id="siteFooter"></div>

<script src="/static/site-header.js"></script>
<script>
renderSiteHeader('ratings');
renderSiteFooter();

const LS_TOKEN = 'mgsu_token';
const authToken = localStorage.getItem(LS_TOKEN) || '';
let myUid = '';

document.querySelectorAll('.tab').forEach(function(t){
  t.addEventListener('click', function(){
    document.querySelectorAll('.tab').forEach(function(x){ x.classList.remove('active'); });
    document.querySelectorAll('.tab-panel').forEach(function(x){ x.classList.remove('active'); });
    t.classList.add('active');
    const id = t.dataset.tab;
    const panel = document.getElementById('panel' + id.charAt(0).toUpperCase() + id.slice(1));
    if (panel) panel.classList.add('active');
  });
});

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function renderList(elId, items, emptyText){
  const box = document.getElementById(elId);
  if (!box) return;
  if (!items || !items.length){
    box.innerHTML = '<div class="empty">' + emptyText + '</div>';
    return;
  }
  box.innerHTML = '';
  items.forEach(function(it, i){
    const row = document.createElement('div');
    let cls = 'rating-row';
    if (i === 0) cls += ' top-1';
    else if (i === 1) cls += ' top-2';
    else if (i === 2) cls += ' top-3';
    if (myUid && it.uid === myUid) cls += ' me';

    row.className = cls;
    row.innerHTML =
      '<div class="rating-pos">' + (i + 1) + '</div>' +
      '<div class="rating-info">' +
        '<div class="rating-nick"></div>' +
        '<div class="rating-games">' + (it.games || 0) + ' партий</div>' +
      '</div>' +
      '<div class="rating-score">' + it.score + '</div>';
    row.querySelector('.rating-nick').textContent = it.nick || 'Аноним';
    box.appendChild(row);
  });
}

function renderMe(me){
  const box = document.getElementById('myCardBox');
  if (!authToken){
    box.innerHTML = '<div class="me-hint">💡 <a href="/auth">Создай аккаунт</a>, чтобы попасть в рейтинг и видеть свою позицию.</div>';
    return;
  }
  if (!me){
    box.innerHTML = '<div class="me-hint">📊 Сыграй партию — и увидишь свою позицию.</div>';
    return;
  }

  box.innerHTML =
    '<div class="my-card">' +
      '<div class="my-head">' +
        '<div class="my-name">👤 ' + escapeHtml(me.nick || 'Ты') + '</div>' +
        '<div class="my-coins">💰 ' + (me.coins || 0) + ' монет</div>' +
      '</div>' +
      '<div class="my-grid">' +
        '<div class="my-stat">' +
          '<div class="my-stat-label">Сегодня</div>' +
          '<div class="my-stat-value">' + (me.day ? me.day.pos : '—') + '</div>' +
        '</div>' +
        '<div class="my-stat">' +
          '<div class="my-stat-label">Неделя</div>' +
          '<div class="my-stat-value">' + (me.week ? me.week.pos : '—') + '</div>' +
        '</div>' +
        '<div class="my-stat">' +
          '<div class="my-stat-label">Всё время</div>' +
          '<div class="my-stat-value">' + (me.all ? me.all.pos : '—') + '</div>' +
        '</div>' +
      '</div>' +
    '</div>';
}

async function loadRatings(){
  try{
    const headers = {};
    if (authToken) headers['Authorization'] = 'Bearer ' + authToken;
    const r = await fetch('/api/ratings', {headers: headers});
    const data = await r.json();
    if (data.me && data.me.uid) myUid = data.me.uid;
    renderMe(data.me);
    renderList('listDay', data.day, 'Сегодня пока никто не играл. Будь первым!');
    renderList('listWeek', data.week, 'На этой неделе пока пусто.');
    renderList('listAll', data.alltime, 'Рейтинг ещё пуст. Начни первым!');
    document.getElementById('subText').textContent = 'Неделя: ' + (data.week_label || '');
  }catch(e){
    document.getElementById('listDay').innerHTML = '<div class="empty">Не удалось загрузить</div>';
  }
}

loadRatings();
</script>

</body></html>
