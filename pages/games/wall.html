<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Стена · Игры МГСУ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="/theme.css">
<style>
html,body{height:100%;}
body.wall-page{overflow:hidden;touch-action:none;display:flex;flex-direction:column;}
.wall-top{padding:14px 0 10px;flex-shrink:0;}
.wall-top .head{height:56px;padding:0 20px;}
.wall-top .brand-logo{width:34px !important;height:34px !important;}
.wall-top .brand-label{font-size:13px;}
.wall-top nav a{padding:6px 14px;font-size:13px;}

.wall-canvas-wrap{
  flex:1;position:relative;overflow:hidden;
  margin:0 16px;border-radius:12px;
  border:1px solid rgba(255,255,255,0.14);
  background:#000;min-height:0;
}
#c{display:block;width:100%;height:100%;touch-action:none;background:#000;cursor:crosshair;}

.wall-bottom{flex-shrink:0;padding:14px 16px 20px;}
.wall-panel{
  max-width:1240px;margin:0 auto;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.14);
  border-radius:999px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  padding:12px 18px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
}
.palette{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.sw{
  width:30px;height:30px;border-radius:50%;
  border:2px solid rgba(255,255,255,0.25);
  cursor:pointer;padding:0;background:transparent;
  transition:transform .12s,border-color .12s;
}
.sw:hover{transform:scale(1.1);}
.sw.active{border-color:#fff;transform:scale(1.15);box-shadow:0 0 0 3px rgba(255,255,255,0.15);}
.slider-wrap{display:flex;align-items:center;gap:10px;flex:1;min-width:140px;}
.slider-wrap input[type=range]{flex:1;accent-color:#fff;background:transparent;}
.divider{width:1px;height:28px;background:rgba(255,255,255,0.15);}
.btn-undo{
  display:inline-flex;align-items:center;gap:8px;
  padding:9px 18px;border-radius:999px;
  border:1px solid rgba(255,255,255,0.2);
  background:rgba(255,255,255,0.06);color:#fff;
  font-family:inherit;font-size:13px;font-weight:600;
  cursor:pointer;transition:background .15s,border-color .15s;
  white-space:nowrap;
}
.btn-undo:hover{background:rgba(255,255,255,0.14);border-color:rgba(255,255,255,0.35);}
.btn-undo:active{transform:scale(0.97);}
.btn-undo svg{width:16px;height:16px;}
#banner{
  position:absolute;top:16px;left:50%;transform:translateX(-50%);
  background:var(--red);color:#fff;
  padding:10px 20px;border-radius:999px;
  font-size:13px;font-weight:600;display:none;z-index:5;
  box-shadow:0 8px 24px rgba(172,20,34,0.4);
}
@media(max-width:640px){
  .wall-canvas-wrap{margin:0 10px;border-radius:10px;}
  .wall-bottom{padding:10px 10px 16px;}
  .wall-panel{border-radius:16px;padding:12px 14px;gap:10px;}
  .sw{width:26px;height:26px;}
  .slider-wrap{min-width:100%;order:3;}
  .divider{display:none;}
  .btn-undo{padding:8px 14px;font-size:12px;}
}
</style>
</head><body class="wall-page">

<div class="wall-top">
  <div class="wrap">
    <div class="head">
      <a class="brand" href="/glavnaya">
        <img src="/assets/Logo/logo.svg" alt="Лого" class="brand-logo">
        <span class="brand-label"><b>НИУ МГСУ</b> · Игры</span>
      </a>
      <nav>
        <a href="/glavnaya">Игры</a>
        <a href="/privacy">О проекте</a>
      </nav>
    </div>
  </div>
</div>

<div class="wall-canvas-wrap">
  <div id="banner"></div>
  <canvas id="c"></canvas>
</div>

<div class="wall-bottom">
  <div class="wall-panel">
    <div class="palette" id="colors"></div>
    <div class="divider"></div>
    <div class="slider-wrap"><input type="range" id="w" min="2" max="30" value="6"></div>
    <div class="divider"></div>
    <button class="btn-undo" id="undoBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 14 4 9 9 4"></polyline><path d="M20 20v-7a4 4 0 0 0-4-4H4"></path>
      </svg>
      Отменить
    </button>
  </div>
</div>

<script>
const W = 1920, H = 1080;
const c = document.getElementById('c');
const ctx = c.getContext('2d');
c.width = W; c.height = H;
const COLORS = ['#ffffff','#ff3b30','#ff9500','#ffcc00','#34c759','#00c7be','#30b0ff','#5856d6','#af52de','#ff2d55'];
let color = COLORS[0], width = 6;
const palette = document.getElementById('colors');
COLORS.forEach((col, i) => {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'sw' + (i===0?' active':'');
  b.style.background = col;
  b.onclick = () => { color = col; document.querySelectorAll('.sw').forEach(x => x.classList.remove('active')); b.classList.add('active'); };
  palette.appendChild(b);
});
document.getElementById('w').oninput = e => width = +e.target.value;

let strokes = [];
function drawLine(x0,y0,x1,y1,col,w){
  ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap='round';ctx.lineJoin='round';
  ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x1,y1);ctx.stroke();
}
function redrawAll(){ ctx.clearRect(0,0,W,H); for (const s of strokes) drawLine(s.x0,s.y0,s.x1,s.y1,s.color,s.width); }

let ws, queue = [];
function connect(){
  ws = new WebSocket((location.protocol==='https:'?'wss://':'ws://') + location.host + '/ws');
  ws.onopen = () => queue.splice(0).forEach(m => ws.send(m));
  ws.onclose = () => setTimeout(connect, 1500);
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.type === 'stroke'){ strokes.push(m); drawLine(m.x0,m.y0,m.x1,m.y1,m.color,m.width); }
    else if (m.type === 'remove'){ strokes = strokes.filter(s => s.id !== m.id); redrawAll(); }
    else if (m.type === 'reset'){ strokes = []; ctx.clearRect(0,0,W,H); }
  };
}
connect();

let drawing = false, last = null;
function pos(e){ const r = c.getBoundingClientRect(); const p = e.touches ? e.touches[0] : e; return { x:(p.clientX-r.left)*(W/r.width), y:(p.clientY-r.top)*(H/r.height) }; }
function start(e){ e.preventDefault(); drawing = true; last = pos(e); }
function move(e){
  if (!drawing) return; e.preventDefault();
  const p = pos(e);
  const s = {x0:last.x, y0:last.y, x1:p.x, y1:p.y, color, width};
  drawLine(s.x0,s.y0,s.x1,s.y1,color,width);
   const msg = JSON.stringify({type:'stroke', ...s});
  if (ws && ws.readyState === 1){ ws.send(msg); strokesSent++; } else { queue.push(msg); strokesSent++; }
  last = p;
}
function end(){ drawing = false; last = null; }
c.addEventListener('touchstart', start, {passive:false});
c.addEventListener('touchmove', move, {passive:false});
c.addEventListener('touchend', end);
c.addEventListener('mousedown', start);
c.addEventListener('mousemove', move);
c.addEventListener('mouseup', end);
c.addEventListener('mouseleave', end);

document.getElementById('undoBtn').onclick = () => {
  if (ws && ws.readyState === 1) ws.send(JSON.stringify({type:'undo'}));
};
  // === отправка результата в аккаунт каждые 60 секунд ===
let strokesSent = 0;
setInterval(async () => {
  if (strokesSent === 0) return;
  const token = localStorage.getItem('mgsu_token') || '';
  if (!token) return;
  try{
    await fetch('/api/game/finish', {
      method:'POST',
      headers:{'Content-Type':'application/json', 'Authorization': 'Bearer ' + token},
      body: JSON.stringify({game: 'wall', raw_score: strokesSent})
    });
    strokesSent = 0;
  }catch(e){}
}, 60000);

// считаем штрихи
setInterval(() => {
  // каждый активный штрих увеличивает счётчик
}, 1000);

async function checkStatus(){
  try{
    const r = await fetch('/status');
    const s = await r.json();
    const b = document.getElementById('banner');
    if (!s.open){
      b.style.display = 'block';
      b.innerHTML = '🔒 Технический перерыв<br><span style="font-size:11px;font-weight:400;opacity:0.9;">Игры доступны только в учебное время: с ' + s.opens_at + ' до ' + s.closes_at + '</span>';
      c.style.pointerEvents = 'none';
      c.style.opacity = '0.4';
    } else {
      b.style.display = 'none';
      c.style.pointerEvents = 'auto';
      c.style.opacity = '1';
    }
  }catch(e){}
}
checkStatus();
setInterval(checkStatus, 60000);
</script>
</body></html>
