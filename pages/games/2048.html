<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>2048 Здания · Игры МГСУ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/static/site-header.css">
<style>
html,body{height:100%;}
body.g2048-page{
  height:100vh;
  height:100dvh;
  max-height:100dvh;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  user-select:none;
  -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
  background:var(--bg, #f5f7fa);
  color:var(--text, #0a0f1e);
}

.status-banner{
  position:fixed;top:0;left:0;right:0;z-index:99;
  background:#AC1422;color:#fff;padding:12px 20px;
  text-align:center;font-size:13px;font-weight:600;display:none;
}
.status-banner.show{display:block;}
.status-banner small{display:block;font-size:11px;font-weight:400;opacity:0.9;margin-top:2px;}

/* ═══════════ СТЕЙДЖ ═══════════ */
.g-stage{
  flex:1 1 auto;
  display:flex;
  flex-direction:column;
  min-height:0;
  padding:10px max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
  gap:10px;
}

/* ─── Счёт ─── */
.g-score-row{
  flex:0 0 auto;
  display:flex;
  gap:8px;
  justify-content:center;
}
.g-score-box{
  flex:1;
  max-width:180px;
  padding:8px 14px;
  border-radius:12px;
  background:rgba(128,128,128,0.10);
  border:1px solid rgba(128,128,128,0.22);
  text-align:center;
}
.g-score-label{
  font-size:10px;font-weight:800;
  letter-spacing:0.14em;text-transform:uppercase;
  opacity:0.6;margin-bottom:2px;
}
.g-score-value{
  font-size:22px;font-weight:900;
  font-variant-numeric:tabular-nums;
  color:inherit;line-height:1;
}
.g-score-value.bump{animation:gScoreBump .3s ease-out;}
@keyframes gScoreBump{
  0%{transform:scale(1);}
  50%{transform:scale(1.18);color:#f59e0b;}
  100%{transform:scale(1);}
}

/* ─── Поле ─── */
.g-board-wrap{
  flex:1 1 auto;
  min-height:0;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}
.g-board{
  width:min(100%, 460px);
  aspect-ratio:1 / 1;
  position:relative;
  /* ★ Каноничное бежевое поле 2048 */
  background:#bbada0;
  border-radius:14px;
  border:1px solid rgba(128,128,128,0.25);
  box-shadow:0 8px 24px rgba(0,0,0,0.10);
  touch-action:none;
  overflow:hidden;
}

.g-board-bg{
  position:absolute;
  inset:0;
  display:grid;
  grid-template-columns:repeat(4, 1fr);
  grid-template-rows:repeat(4, 1fr);
  gap:var(--gap);
  padding:var(--gap);
  box-sizing:border-box;
}
/* ★ Пустые клетки — светло-бежевые (канон 2048) */
.g-bg-cell{
  background:rgba(238,228,218,0.35);
  border-radius:8px;
}

.g-tiles-layer{
  position:absolute;
  inset:0;
  pointer-events:none;
}

/* ═══════════ ПЛИТКА ═══════════ */
.g-tile{
  position:absolute;
  top:0; left:0;
  width:var(--cell);
  height:var(--cell);
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  font-variant-numeric:tabular-nums;
  line-height:1;
  transition:transform 110ms ease-in-out;
  will-change:transform;
  box-sizing:border-box;
  color:#f9f6f2;
  user-select:none;
  overflow:hidden;
  box-shadow:inset 0 -4px 0 rgba(0,0,0,0.10), 0 2px 4px rgba(0,0,0,0.10);
}

.g-tile::before{
  content:'';
  position:absolute;
  top:0; left:0; right:0;
  height:16%;
  background:rgba(255,255,255,0.30);
  border-bottom:1px solid rgba(0,0,0,0.08);
  pointer-events:none;
}

.g-tile::after{
  content:'';
  position:absolute;
  bottom:12%;
  left:50%;
  transform:translateX(-50%);
  width:46%;
  height:16%;
  background:rgba(255,255,255,0.22);
  border-radius:2px;
  pointer-events:none;
}

.g-tile.spawn{animation:gTileSpawn 180ms ease-out;}
@keyframes gTileSpawn{
  0%{opacity:0;transform:translate(var(--tx), var(--ty)) scale(0);}
  100%{opacity:1;transform:translate(var(--tx), var(--ty)) scale(1);}
}
.g-tile.pop{animation:gTilePop 200ms ease-out;}
@keyframes gTilePop{
  0%{transform:translate(var(--tx), var(--ty)) scale(1);}
  45%{transform:translate(var(--tx), var(--ty)) scale(1.22);}
  100%{transform:translate(var(--tx), var(--ty)) scale(1);}
}

.g-tile-emoji{
  position:absolute;
  top:calc(var(--cell) * 0.19);
  right:calc(var(--cell) * 0.06);
  font-size:calc(var(--cell) * 0.20);
  line-height:1;
  opacity:0.9;
  z-index:2;
  pointer-events:none;
}

.g-tile-num{
  font-size:calc(var(--cell) * 0.42);
  line-height:1;
  position:relative;
  z-index:3;
  text-shadow:0 1px 2px rgba(0,0,0,0.15);
}
.g-tile[data-len="3"] .g-tile-num{font-size:calc(var(--cell) * 0.30);}
.g-tile[data-len="4"] .g-tile-num{font-size:calc(var(--cell) * 0.24);}

/* Цвета плиток — канон 2048 */
.g-tile-2     { background:#eee4da; color:#776e65; }
.g-tile-4     { background:#ede0c8; color:#776e65; }
.g-tile-8     { background:#f2b179; }
.g-tile-16    { background:#f59563; }
.g-tile-32    { background:#f67c5f; }
.g-tile-64    { background:#f65e3b; }
.g-tile-128   { background:#edcf72; box-shadow:inset 0 -4px 0 rgba(0,0,0,0.10), 0 0 12px rgba(237,207,114,0.4); }
.g-tile-256   { background:#edcc61; box-shadow:inset 0 -4px 0 rgba(0,0,0,0.10), 0 0 16px rgba(237,204,97,0.5); }
.g-tile-512   { background:#edc850; box-shadow:inset 0 -4px 0 rgba(0,0,0,0.10), 0 0 20px rgba(237,200,80,0.6); }
.g-tile-1024  { background:#edc53f; box-shadow:inset 0 -4px 0 rgba(0,0,0,0.10), 0 0 26px rgba(237,197,63,0.7); }
.g-tile-2048  { background:#edc22e; box-shadow:inset 0 -4px 0 rgba(0,0,0,0.10), 0 0 32px rgba(237,194,46,0.9); }
.g-tile-4096  { background:#3c3a32; box-shadow:0 0 32px rgba(120,80,255,0.7); }
.g-tile-8192  { background:#2a2822; box-shadow:0 0 40px rgba(180,60,255,0.7); }

/* ─── Управление ─── */
.g-controls-row{
  flex:0 0 auto;
  display:flex;
  gap:8px;
  justify-content:center;
}
.g-ctrl-btn{
  padding:12px 22px;
  border-radius:12px;
  border:1px solid rgba(128,128,128,0.30);
  background:rgba(128,128,128,0.10);
  color:inherit;
  font-family:inherit;
  font-size:14px;
  font-weight:800;
  cursor:pointer;
  transition:transform .1s, background .15s;
  touch-action:manipulation;
  text-decoration:none;
  display:inline-flex;
  align-items:center;
  gap:6px;
}
.g-ctrl-btn:active{transform:scale(0.96);background:rgba(128,128,128,0.22);}
.g-ctrl-btn.primary{
  background:rgba(111,168,255,0.20);
  border-color:rgba(111,168,255,0.5);
  color:inherit;
}

/* ═══════════ ОВЕРЛЕИ — СВЕТЛЫЕ ПОД ТЕМУ ═══════════ */
.g-overlay{
  position:absolute;inset:0;
  background:rgba(255,255,255,0.94);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:14px;padding:22px;text-align:center;
  z-index:20;transition:opacity .3s;
  color:#0a0f1e;
}
.g-overlay.hide{opacity:0;pointer-events:none;}

/* Авто-подстройка под чёрную тему */
@media (prefers-color-scheme: dark){
  .g-overlay{
    background:rgba(20,20,20,0.94);
    color:#f5f7fa;
  }
}

.g-overlay-emoji{font-size:64px;margin-bottom:2px;filter:drop-shadow(0 8px 24px rgba(255,180,80,0.4));}
.g-overlay h2{font-size:22px;font-weight:800;color:inherit;letter-spacing:-0.02em;margin:0;}
.g-overlay p{font-size:13px;color:inherit;opacity:0.7;max-width:340px;line-height:1.55;margin:0;}
.g-overlay p b{color:#f59e0b;opacity:1;}

.g-btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:13px 28px;border-radius:999px;
  background:#0F3C73;color:#fff;
  font-family:inherit;font-size:14px;font-weight:700;
  border:0;cursor:pointer;
  box-shadow:0 8px 20px rgba(15,60,115,0.25);
  transition:transform .1s;
}
.g-btn:active{transform:scale(0.97);}
.g-btn-ghost{
  background:rgba(128,128,128,0.10);
  color:inherit;
  border:1px solid rgba(128,128,128,0.30);
  box-shadow:none;
}

.g-finish-score{font-size:52px;font-weight:900;letter-spacing:-0.04em;font-variant-numeric:tabular-nums;color:inherit;line-height:1;}
.g-finish-label{font-size:10px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;opacity:0.55;margin-bottom:6px;}
.g-finish-rank{font-size:20px;font-weight:800;color:inherit;}
.g-finish-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}

#progressBlock{
  display:none;width:100%;max-width:380px;
  padding:12px 16px;border-radius:12px;
  background:rgba(128,128,128,0.08);
  border:1px solid rgba(128,128,128,0.20);
  font-size:13px;text-align:left;line-height:1.5;
  color:inherit;
}
#progressBlock a{color:#16a34a;text-decoration:none;font-weight:700;}

.g-achieve-toast{
  position:fixed;top:80px;left:50%;
  transform:translateX(-50%) translateY(-30px);
  background:linear-gradient(135deg,#edc22e,#d4a017);
  color:#1a1205;
  padding:14px 28px;border-radius:14px;
  font-size:15px;font-weight:900;
  box-shadow:0 12px 32px rgba(237,194,46,0.5);
  z-index:200;opacity:0;transition:all .4s;
  pointer-events:none;
  letter-spacing:0.02em;
}
.g-achieve-toast.show{transform:translateX(-50%) translateY(0);opacity:1;}

@media(max-width:520px){
  .g-score-value{font-size:18px;}
  .g-score-box{padding:6px 10px;}
  .g-ctrl-btn{padding:10px 16px;font-size:13px;}
  .g-overlay-emoji{font-size:52px;}
  .g-overlay h2{font-size:19px;}
  .g-finish-score{font-size:42px;}
  .g-finish-rank{font-size:17px;}
}
@media(max-height:640px){
  .g-stage{padding:6px;gap:6px;}
  .g-score-value{font-size:16px;}
  .g-score-box{padding:5px 10px;}
  .g-ctrl-btn{padding:9px 14px;font-size:12px;}
}
</style>
</head><body class="g2048-page">

<div class="status-banner" id="statusBanner">
  🔒 Технический перерыв
  <small id="statusBannerSub">Игры доступны только в учебное время</small>
</div>

<div id="siteHeader"></div>

<div class="g-stage">

  <div class="g-score-row">
    <div class="g-score-box">
      <div class="g-score-label">Очки</div>
      <div class="g-score-value" id="scoreVal">0</div>
    </div>
    <div class="g-score-box">
      <div class="g-score-label">Рекорд</div>
      <div class="g-score-value" id="bestVal">0</div>
    </div>
  </div>

  <div class="g-board-wrap">
    <div class="g-board" id="board">
      <div class="g-board-bg">
        <div class="g-bg-cell"></div><div class="g-bg-cell"></div><div class="g-bg-cell"></div><div class="g-bg-cell"></div>
        <div class="g-bg-cell"></div><div class="g-bg-cell"></div><div class="g-bg-cell"></div><div class="g-bg-cell"></div>
        <div class="g-bg-cell"></div><div class="g-bg-cell"></div><div class="g-bg-cell"></div><div class="g-bg-cell"></div>
        <div class="g-bg-cell"></div><div class="g-bg-cell"></div><div class="g-bg-cell"></div><div class="g-bg-cell"></div>
      </div>
      <div class="g-tiles-layer" id="tilesLayer"></div>

      <div class="g-overlay" id="startOv">
        <div class="g-overlay-emoji">🏗️</div>
        <h2>2048 · Здания</h2>
        <p>Свайпай или используй стрелки. Одинаковые домики сливаются в один побольше. Собери <b>2048</b>!</p>
        <button class="g-btn" id="startBtn" type="button">Начать стройку →</button>
      </div>

      <div class="g-overlay hide" id="finishOv">
        <div class="g-overlay-emoji" id="finishEmoji">🏗️</div>
        <div class="g-finish-score" id="finishScore">0</div>
        <div class="g-finish-label">очков</div>
        <div class="g-finish-rank" id="finishRank">Подмастерье</div>
        <div id="progressBlock"></div>
        <div class="g-finish-actions">
          <button class="g-btn" id="shareBtn" type="button">Показать другу</button>
          <button class="g-btn g-btn-ghost" id="againBtn" type="button">Ещё раз</button>
        </div>
      </div>
    </div>
  </div>

  <div class="g-controls-row">
    <button class="g-ctrl-btn primary" id="btnNew" type="button">🔄 Заново</button>
    <a class="g-ctrl-btn" href="/glavnaya">🏠 Меню</a>
  </div>

</div>

<div class="g-achieve-toast" id="achieveToast">🎉 2048! Ты построил мегаполис</div>

<script src="/static/site-header.js"></script>
<script>
renderSiteHeader('games');

/* ═══════════════════════════════════════════════════════════
   ДАННЫЕ
   ═══════════════════════════════════════════════════════════ */
const SIZE = 4;
const NEW_TILE_4_CHANCE = 0.1;

const TILE_DATA = {
  2:    { emoji: '🛖' },
  4:    { emoji: '🏠' },
  8:    { emoji: '🏡' },
  16:   { emoji: '🏘' },
  32:   { emoji: '🏢' },
  64:   { emoji: '🏬' },
  128:  { emoji: '🏨' },
  256:  { emoji: '🏰' },
  512:  { emoji: '🌆' },
  1024: { emoji: '🏙' },
  2048: { emoji: '🌃' },
  4096: { emoji: '🌌' },
  8192: { emoji: '✨' },
};

let board = [];
let score = 0;
let best = parseInt(localStorage.getItem('mgsu_2048_best') || '0', 10);
let running = false;
let reached2048 = false;
let pendingMerges = [];
let busy = false;

let CELL = 80;
let GAP = 10;

const boardEl   = document.getElementById('board');
const tilesLayer = document.getElementById('tilesLayer');
const scoreEl   = document.getElementById('scoreVal');
const bestEl    = document.getElementById('bestVal');
const startOv   = document.getElementById('startOv');
const finishOv  = document.getElementById('finishOv');
const finishEmoji = document.getElementById('finishEmoji');
const finishScore = document.getElementById('finishScore');
const finishRank  = document.getElementById('finishRank');
const progressBlock = document.getElementById('progressBlock');
const achieveToast = document.getElementById('achieveToast');

bestEl.textContent = best;

/* ═══════════════════════════════════════════════════════════
   ЗВУК
   ═══════════════════════════════════════════════════════════ */
let audioCtx = null;
function initAudio(){
  if (audioCtx) return;
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) audioCtx = new AC();
  }catch(e){}
}
function beep(freq, duration, type, vol, slideTo){
  if (!audioCtx) return;
  try{
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'square';
    osc.frequency.setValueAtTime(freq, t);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t + duration);
    gain.gain.setValueAtTime(vol || 0.07, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + duration + 0.02);
  }catch(e){}
}
const SFX = {
  move:  () => beep(320, 0.035, 'square', 0.035),
  merge: () => { beep(600, 0.07, 'square', 0.08); setTimeout(() => beep(850, 0.09, 'square', 0.08), 60); },
  spawn: () => beep(220, 0.04, 'triangle', 0.04),
  win:   () => { [660,880,1100,1500,1800].forEach((f,i) => setTimeout(() => beep(f, 0.14, 'square', 0.10), i*90)); },
  over:  () => { [500,400,300,220,150].forEach((f,i) => setTimeout(() => beep(f, 0.2, 'triangle', 0.10), i*130)); },
};

/* ═══════════════════════════════════════════════════════════
   РАСПИСАНИЕ
   ═══════════════════════════════════════════════════════════ */
let scheduleOpen = true;
async function checkScheduleStatus(){
  try{
    const r = await fetch('/status');
    const s = await r.json();
    scheduleOpen = !!s.open;
    const banner = document.getElementById('statusBanner');
    const sub = document.getElementById('statusBannerSub');
    if (!scheduleOpen){
      sub.textContent = 'Игры доступны только в учебное время: с ' + s.opens_at + ' до ' + s.closes_at;
      banner.classList.add('show');
    } else {
      banner.classList.remove('show');
    }
  }catch(e){}
}
checkScheduleStatus();
setInterval(checkScheduleStatus, 60000);

/* ═══════════════════════════════════════════════════════════
   РАЗМЕРЫ
   ═══════════════════════════════════════════════════════════ */
function resize(){
  const rect = boardEl.getBoundingClientRect();
  const size = rect.width;
  if (!size) return;
  GAP = Math.max(6, Math.round(size * 0.026));
  CELL = (size - 5 * GAP) / 4;
  boardEl.style.setProperty('--gap', GAP + 'px');
  boardEl.style.setProperty('--cell', CELL + 'px');
  for (let r = 0; r < SIZE; r++){
    for (let c = 0; c < SIZE; c++){
      const t = board[r] && board[r][c];
      if (t) applyTilePos(t);
    }
  }
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));

function posX(col){ return GAP + col * (CELL + GAP); }
function posY(row){ return GAP + row * (CELL + GAP); }

function applyTilePos(tile){
  const x = posX(tile.col);
  const y = posY(tile.row);
  tile.el.style.setProperty('--tx', x + 'px');
  tile.el.style.setProperty('--ty', y + 'px');
  tile.el.style.transform = `translate(${x}px, ${y}px)`;
}

/* ═══════════════════════════════════════════════════════════
   СОЗДАНИЕ ПЛИТОК
   ═══════════════════════════════════════════════════════════ */
function createTileEl(value){
  const el = document.createElement('div');
  el.className = 'g-tile g-tile-' + value;
  el.setAttribute('data-len', String(String(value).length));
  const data = TILE_DATA[value] || { emoji: '✨' };
  el.innerHTML =
    '<span class="g-tile-emoji">' + data.emoji + '</span>' +
    '<span class="g-tile-num">' + value + '</span>';
  return el;
}

function createTile(row, col, value, spawnAnim){
  const el = createTileEl(value);
  tilesLayer.appendChild(el);
  const tile = { value, row, col, el, mergedThisTurn: false };
  applyTilePos(tile);
  if (spawnAnim){
    el.classList.add('spawn');
    setTimeout(() => el.classList.remove('spawn'), 200);
  }
  board[row][col] = tile;
  return tile;
}

function addRandomTile(){
  const empty = [];
  for (let r = 0; r < SIZE; r++)
    for (let c = 0; c < SIZE; c++)
      if (!board[r][c]) empty.push([r, c]);
  if (!empty.length) return null;
  const [r, c] = empty[Math.floor(Math.random() * empty.length)];
  const value = Math.random() < NEW_TILE_4_CHANCE ? 4 : 2;
  const tile = createTile(r, c, value, true);
  SFX.spawn();
  return tile;
}

/* ═══════════════════════════════════════════════════════════
   НОВАЯ ИГРА
   ═══════════════════════════════════════════════════════════ */
function newGame(){
  if (!scheduleOpen){ checkScheduleStatus(); return; }
  initAudio();
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});

  tilesLayer.innerHTML = '';
  board = [];
  for (let r = 0; r < SIZE; r++) board.push(new Array(SIZE).fill(null));
  score = 0;
  reached2048 = false;
  pendingMerges = [];
  busy = false;
  running = true;

  updateScore();
  resize();
  setTimeout(() => {
    addRandomTile();
    addRandomTile();
  }, 30);

  startOv.classList.add('hide');
  finishOv.classList.add('hide');
  progressBlock.style.display = 'none';
}

function updateScore(bump){
  scoreEl.textContent = score;
  if (bump){
    scoreEl.classList.remove('bump');
    void scoreEl.offsetWidth;
    scoreEl.classList.add('bump');
  }
  if (score > best){
    best = score;
    bestEl.textContent = best;
    localStorage.setItem('mgsu_2048_best', String(best));
  }
}

/* ═══════════════════════════════════════════════════════════
   ДВИЖЕНИЕ
   ═══════════════════════════════════════════════════════════ */
const VECTORS = {
  up:    [-1, 0],
  down:  [ 1, 0],
  left:  [ 0,-1],
  right: [ 0, 1],
};

function move(dir){
  if (!running || busy) return;
  const [dr, dc] = VECTORS[dir];
  if (!dr && !dc) return;

  let moved = false;
  let mergedAny = false;
  pendingMerges = [];

  for (let r = 0; r < SIZE; r++)
    for (let c = 0; c < SIZE; c++)
      if (board[r][c]) board[r][c].mergedThisTurn = false;

  const rows = [...Array(SIZE).keys()];
  const cols = [...Array(SIZE).keys()];
  if (dr > 0) rows.reverse();
  if (dc > 0) cols.reverse();

  for (const r of rows){
    for (const c of cols){
      const tile = board[r][c];
      if (!tile) continue;

      let nr = r, nc = c;
      let mergeTarget = null;

      while (true){
        const tr = nr + dr, tc = nc + dc;
        if (tr < 0 || tr >= SIZE || tc < 0 || tc >= SIZE) break;
        const t = board[tr][tc];
        if (!t){
          nr = tr; nc = tc;
        } else if (t.value === tile.value && !t.mergedThisTurn){
          nr = tr; nc = tc;
          mergeTarget = t;
          break;
        } else {
          break;
        }
      }

      if (nr === r && nc === c) continue;
      moved = true;

      board[r][c] = null;

      if (mergeTarget){
        mergeTarget.value *= 2;
        mergeTarget.mergedThisTurn = true;
        score += mergeTarget.value;
        mergedAny = true;

        tile.row = nr; tile.col = nc;
        applyTilePos(tile);
        pendingMerges.push({ removed: tile, target: mergeTarget });

        if (mergeTarget.value === 2048 && !reached2048){
          reached2048 = true;
          showAchieve();
        }
      } else {
        board[nr][nc] = tile;
        tile.row = nr; tile.col = nc;
        applyTilePos(tile);
      }
    }
  }

  if (!moved) return;

  SFX.move();
  busy = true;

  setTimeout(() => {
    for (const m of pendingMerges){
      if (m.removed.el && m.removed.el.parentNode) m.removed.el.remove();
      const v = m.target.value;
      const data = TILE_DATA[v] || { emoji: '✨' };
      m.target.el.className = 'g-tile g-tile-' + v;
      m.target.el.setAttribute('data-len', String(String(v).length));
      m.target.el.innerHTML =
        '<span class="g-tile-emoji">' + data.emoji + '</span>' +
        '<span class="g-tile-num">' + v + '</span>';
      applyTilePos(m.target);
      m.target.el.classList.remove('pop');
      void m.target.el.offsetWidth;
      m.target.el.classList.add('pop');
    }
    pendingMerges = [];

    if (mergedAny) SFX.merge();
    updateScore(mergedAny);

    setTimeout(() => {
      addRandomTile();
      if (!canMove()){
        setTimeout(() => gameOver(), 300);
      }
      busy = false;
    }, 60);
  }, 120);
}

function canMove(){
  for (let r = 0; r < SIZE; r++){
    for (let c = 0; c < SIZE; c++){
      const t = board[r][c];
      if (!t) return true;
      if (c < SIZE - 1){
        const right = board[r][c + 1];
        if (!right || right.value === t.value) return true;
      }
      if (r < SIZE - 1){
        const down = board[r + 1][c];
        if (!down || down.value === t.value) return true;
      }
    }
  }
  return false;
}

/* ═══════════════════════════════════════════════════════════
   КОНЕЦ ИГРЫ
   ═══════════════════════════════════════════════════════════ */
function rankFor(s){
  if (s < 400)   return { name:'Подмастерье',  emoji:'🧱' };
  if (s < 1200)  return { name:'Каменщик',     emoji:'🧱' };
  if (s < 3000)  return { name:'Прораб',       emoji:'👷' };
  if (s < 6000)  return { name:'Инженер',      emoji:'🏗️' };
  if (s < 12000) return { name:'Архитектор',   emoji:'📐' };
  if (s < 25000) return { name:'Градостроитель', emoji:'🏙️' };
  return { name:'Зодчий МГСУ', emoji:'👑' };
}

async function gameOver(){
  running = false;
  const r = rankFor(score);
  finishEmoji.textContent = r.emoji;
  finishScore.textContent = score;
  finishRank.textContent = r.name;
  finishOv.classList.remove('hide');
  SFX.over();

  const token = localStorage.getItem('mgsu_token') || '';
  progressBlock.style.display = 'block';
  progressBlock.textContent = 'Отправляю результат…';

  try{
    const headers = { 'Content-Type': 'application/json' };
    if (token) headers['Authorization'] = 'Bearer ' + token;
    const res = await fetch('/api/game/finish', {
      method: 'POST', headers,
      body: JSON.stringify({ game: '2048', raw_score: score })
    });
    const data = await res.json();
    renderProgress(data);
  }catch(e){
    progressBlock.style.display = 'none';
  }
}

function renderProgress(data){
  if (!data.logged_in){
    progressBlock.innerHTML = '💡 Хочешь монеты и топ? <a href="/auth">Создай аккаунт</a>';
    return;
  }
  let html = '<div>🎯 Очков: <b>+' + data.points + '</b></div>';
  if (data.daily_plays && data.daily_multiplier !== undefined && data.daily_multiplier < 1){
    html += '<div style="color:#f59e0b;">📉 ' + data.daily_plays + '-я партия — награда ×' + data.daily_multiplier + '</div>';
  }
  if (data.progress){
    html += '<div>💰 Монет: <b>' + data.progress.coins + '</b></div>';
    html += '<div>🔥 Серия: <b>' + data.progress.streak + '</b> дней';
    if (data.progress.streak_changed) html += ' <span style="color:#16a34a;">+1</span>';
    html += '</div>';
  }
  if (data.tasks_completed && data.tasks_completed.length){
    data.tasks_completed.forEach(t => { html += '<div style="color:#16a34a;">✓ ' + t.text + ' (+' + t.reward + ')</div>'; });
  }
  html += '<div style="margin-top:8px;"><a href="/profile">Открыть профиль →</a></div>';
  progressBlock.innerHTML = html;
}

function showAchieve(){
  achieveToast.classList.add('show');
  SFX.win();
  setTimeout(() => achieveToast.classList.remove('show'), 3500);
}

/* ═══════════════════════════════════════════════════════════
   УПРАВЛЕНИЕ
   ═══════════════════════════════════════════════════════════ */
document.addEventListener('keydown', function(e){
  if (!running) return;
  if (e.code === 'ArrowLeft'){ e.preventDefault(); move('left'); }
  else if (e.code === 'ArrowRight'){ e.preventDefault(); move('right'); }
  else if (e.code === 'ArrowUp'){ e.preventDefault(); move('up'); }
  else if (e.code === 'ArrowDown'){ e.preventDefault(); move('down'); }
});

let touchStartX = 0, touchStartY = 0, touchMoved = false;
boardEl.addEventListener('touchstart', function(e){
  if (!running) return;
  const t = e.touches[0];
  touchStartX = t.clientX;
  touchStartY = t.clientY;
  touchMoved = false;
}, {passive: true});
boardEl.addEventListener('touchmove', function(e){
  if (!running || touchMoved) return;
  const t = e.touches[0];
  const dx = t.clientX - touchStartX;
  const dy = t.clientY - touchStartY;
  const THRESH = 24;
  if (Math.abs(dx) > THRESH || Math.abs(dy) > THRESH){
    touchMoved = true;
    if (Math.abs(dx) > Math.abs(dy)){
      move(dx > 0 ? 'right' : 'left');
    } else {
      move(dy > 0 ? 'down' : 'up');
    }
  }
}, {passive: true});
boardEl.addEventListener('touchend', () => { touchMoved = false; });

let mouseDown = false, mouseStartX = 0, mouseStartY = 0;
boardEl.addEventListener('mousedown', (e) => {
  if (!running) return;
  mouseDown = true;
  mouseStartX = e.clientX;
  mouseStartY = e.clientY;
  e.preventDefault();
});
document.addEventListener('mouseup', (e) => {
  if (!mouseDown) return;
  mouseDown = false;
  const dx = e.clientX - mouseStartX;
  const dy = e.clientY - mouseStartY;
  const THRESH = 24;
  if (Math.abs(dx) > THRESH || Math.abs(dy) > THRESH){
    if (Math.abs(dx) > Math.abs(dy)){
      move(dx > 0 ? 'right' : 'left');
    } else {
      move(dy > 0 ? 'down' : 'up');
    }
  }
});

document.getElementById('startBtn').addEventListener('click', newGame);
document.getElementById('againBtn').addEventListener('click', newGame);
document.getElementById('btnNew').addEventListener('click', () => {
  if (running) { if (!confirm('Начать заново? Прогресс потеряется.')) return; }
  newGame();
});
document.getElementById('shareBtn').addEventListener('click', async () => {
  const r = rankFor(score);
  const text = `Я собрал ${score} очков в «2048 · Здания МГСУ» и стал ${r.name} ${r.emoji}. А ты?\nhttps://mgsu-wall.onrender.com/games/2048`;
  try{
    if (navigator.share) await navigator.share({ text });
    else await navigator.clipboard.writeText(text);
  }catch(e){}
});

board = [];
for (let r = 0; r < SIZE; r++) board.push(new Array(SIZE).fill(null));

window.addEventListener('load', () => setTimeout(resize, 100));
setTimeout(resize, 200);
resize();

document.addEventListener('touchstart', initAudio, { once: true, passive: true });
document.addEventListener('mousedown', initAudio, { once: true });
</script>
