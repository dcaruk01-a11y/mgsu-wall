<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Дашборд · Админка МГСУ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="/static/admin.css">
<style>
.health-banner{
  display:flex;align-items:center;gap:16px;
  padding:20px 24px;border-radius:14px;margin-bottom:28px;
  border:1px solid;background:rgba(255,255,255,0.04);
}
.health-banner.good{border-color:rgba(74,222,128,0.4);background:rgba(74,222,128,0.08);}
.health-banner.warn{border-color:rgba(255,189,46,0.4);background:rgba(255,189,46,0.08);}
.health-banner.bad{border-color:rgba(255,77,94,0.4);background:rgba(255,77,94,0.08);}
.health-dot{width:16px;height:16px;border-radius:50%;flex-shrink:0;box-shadow:0 0 12px currentColor;}
.health-banner.good .health-dot{background:#4ADE80;color:#4ADE80;}
.health-banner.warn .health-dot{background:#FFBD2E;color:#FFBD2E;}
.health-banner.bad .health-dot{background:#FF4D5E;color:#FF4D5E;}
.health-info{flex:1;}
.health-label{font-size:16px;font-weight:800;margin-bottom:4px;}
.health-text{font-size:13px;color:rgba(255,255,255,0.7);line-height:1.5;}

.metrics-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;}
.metric-card{padding:20px 22px;border-radius:14px;background:rgba(255,255,255,0.045);border:1px solid rgba(255,255,255,0.10);}
.metric-card.good{border-color:rgba(74,222,128,0.35);background:rgba(74,222,128,0.05);}
.metric-card.warn{border-color:rgba(255,189,46,0.35);background:rgba(255,189,46,0.05);}
.metric-card.bad{border-color:rgba(255,77,94,0.35);background:rgba(255,77,94,0.05);}
.metric-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.metric-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.metric-card.good .metric-dot{background:#4ADE80;box-shadow:0 0 8px #4ADE80;}
.metric-card.warn .metric-dot{background:#FFBD2E;box-shadow:0 0 8px #FFBD2E;}
.metric-card.bad .metric-dot{background:#FF4D5E;box-shadow:0 0 8px #FF4D5E;}
.metric-card.neutral .metric-dot{background:rgba(255,255,255,0.3);}
.metric-title{font-size:11px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:rgba(255,255,255,0.6);}
.metric-value{font-size:30px;font-weight:900;color:#fff;font-variant-numeric:tabular-nums;letter-spacing:-0.02em;margin-bottom:14px;line-height:1.1;}
.metric-value.small{font-size:18px;}
.metric-verdict{font-size:13px;color:rgba(255,255,255,0.85);line-height:1.55;margin-bottom:6px;}
.metric-hint{font-size:12px;color:rgba(255,255,255,0.5);line-height:1.55;font-style:italic;padding-top:6px;border-top:1px solid rgba(255,255,255,0.06);}
.metric-hint:empty{display:none;}

.export-block{padding:22px;background:rgba(255,255,255,0.045);border:1px solid rgba(255,255,255,0.10);border-radius:14px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.export-block select{padding:12px 16px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);border-radius:10px;color:#fff;font-family:inherit;font-size:14px;outline:none;cursor:pointer;min-width:180px;}
.export-block select option{background:#0F1524;color:#fff;}
.export-btn{padding:12px 22px;border-radius:10px;border:0;background:#fff;color:#0F3C73;font-family:inherit;font-size:14px;font-weight:800;cursor:pointer;transition:transform .1s;}
.export-btn:hover{transform:translateY(-1px);}
.export-btn:disabled{opacity:0.5;cursor:wait;}
.export-hint{font-size:12px;color:rgba(255,255,255,0.5);line-height:1.5;flex:1;min-width:200px;}

.page-header{margin-bottom:28px;}
.page-title{font-size:28px;font-weight:800;color:#fff;margin:0 0 6px;}
.page-sub{font-size:14px;color:rgba(255,255,255,0.55);}

.error-box{padding:16px 20px;border-radius:12px;background:rgba(255,77,94,0.1);border:1px solid rgba(255,77,94,0.4);color:#FFB8BF;font-size:13px;line-height:1.6;margin-bottom:20px;display:none;}
.error-box.show{display:block;}
</style>
</head><body class="admin-page">

<div class="admin-shell">
  <aside class="admin-sidebar" id="adminMenuContainer"></aside>

  <main class="admin-main">
    <div class="page-header">
      <h1 class="page-title">Дашборд</h1>
      <div class="page-sub" id="uptimeLabel">Загрузка…</div>
    </div>

    <div class="error-box" id="errorBox"></div>

    <div class="health-banner" id="healthBanner">
      <div class="health-dot"></div>
      <div class="health-info">
        <div class="health-label" id="healthLabel">—</div>
        <div class="health-text" id="healthText">—</div>
      </div>
    </div>

    <div class="metrics-grid" id="metricsGrid">Загрузка…</div>

    <div class="section-admin" style="margin-top:32px;">
      <h2 style="font-size:18px;font-weight:700;color:#fff;margin-bottom:16px;">Экспорт статистики</h2>
      <div class="export-block">
        <select id="exportPeriod">
          <option value="1">За сегодня</option>
          <option value="7" selected>За 7 дней</option>
          <option value="30">За 30 дней</option>
          <option value="90">За 90 дней</option>
        </select>
        <button class="export-btn" id="exportBtn">Скачать Excel</button>
        <div class="export-hint" id="storageHint">—</div>
      </div>
    </div>
  </main>
</div>

<script src="/static/admin-menu.js"></script>
<script>
const token = adminRequireToken();
renderAdminMenu('dashboard');

function showError(msg){
  const b = document.getElementById('errorBox');
  b.textContent = '⚠ ' + msg;
  b.classList.add('show');
}

function fmtUptime(sec){
  if (!sec && sec !== 0) return '—';
  const d = Math.floor(sec / 86400);
  const h = Math.floor((sec % 86400) / 3600);
  const m = Math.floor((sec % 3600) / 60);
  if (d > 0) return d + 'д ' + h + 'ч';
  if (h > 0) return h + 'ч ' + m + 'м';
  return m + 'м';
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function loadDashboard(){
  try{
    const s = await adminApi('/admin/api/stats');
    document.getElementById('uptimeLabel').textContent = 'Сервер работает: ' + fmtUptime(s.uptime_sec);
    renderHealth(s.health);
    renderMetrics(s.metrics || []);
  }catch(e){
    showError('Ошибка загрузки: ' + e.message);
  }
}

function renderHealth(h){
  const banner = document.getElementById('healthBanner');
  if (!h){
    banner.className = 'health-banner';
    document.getElementById('healthLabel').textContent = 'Нет данных';
    document.getElementById('healthText').textContent = '';
    return;
  }
  banner.className = 'health-banner ' + (h.status || 'neutral');
  document.getElementById('healthLabel').textContent = h.label || '';
  document.getElementById('healthText').textContent = h.text || '';
}

function renderMetrics(metrics){
  const grid = document.getElementById('metricsGrid');
  grid.innerHTML = '';
  if (!metrics || !metrics.length){
    grid.innerHTML = '<div style="color:rgba(255,255,255,0.5);padding:20px;">Нет метрик</div>';
    return;
  }
  metrics.forEach(m => {
    const el = document.createElement('div');
    el.className = 'metric-card ' + (m.status || 'neutral');
    const valueClass = String(m.value).length > 12 ? 'metric-value small' : 'metric-value';
    el.innerHTML =
      '<div class="metric-head">' +
        '<div class="metric-dot"></div>' +
        '<div class="metric-title">' + escapeHtml(m.title) + '</div>' +
      '</div>' +
      '<div class="' + valueClass + '">' + escapeHtml(String(m.value)) + '</div>' +
      '<div class="metric-verdict">' + escapeHtml(m.verdict || '') + '</div>' +
      '<div class="metric-hint">' + escapeHtml(m.hint || '') + '</div>';
    grid.appendChild(el);
  });
  const st = metrics.find(x => x.key === 'storage');
  const hintEl = document.getElementById('storageHint');
  if (hintEl && st){
    hintEl.textContent = 'Хранится: ' + st.value + '. ' + (st.hint || '');
  }
}

/* Экспорт Excel */
async function downloadExcel(){
  const btn = document.getElementById('exportBtn');
  const period = document.getElementById('exportPeriod').value;
  btn.disabled = true;
  btn.textContent = 'Готовлю файл…';
  try{
    const res = await fetch('/admin/api/export?period=' + period, {
      headers: {'Authorization': 'Bearer ' + token}
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'mgsu-stats-' + period + 'd.xlsx';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    btn.textContent = 'Готово ✓';
    setTimeout(() => { btn.textContent = 'Скачать Excel'; }, 1500);
  }catch(e){
    alert('Ошибка скачивания: ' + e.message);
    btn.textContent = 'Скачать Excel';
  }finally{
    btn.disabled = false;
  }
}
document.getElementById('exportBtn').addEventListener('click', downloadExcel);

loadDashboard();
setInterval(loadDashboard, 5000);
</script>

</body></html>
