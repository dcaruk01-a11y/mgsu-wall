<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Профиль · Игры МГСУ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/static/site-header.css">
<style>
.profile-wrap{max-width:640px;margin:0 auto;padding:32px 16px 64px;}
.profile-header{display:flex;align-items:center;gap:20px;margin-bottom:32px;}
.avatar{
  width:80px;height:80px;border-radius:50%;
  background:rgba(255,255,255,0.08);
  border:2px solid rgba(255,255,255,0.2);
  display:flex;align-items:center;justify-content:center;
  font-size:38px;flex-shrink:0;
}
.profile-name{font-size:26px;font-weight:800;line-height:1.1;word-break:break-word;}
.profile-uid{
  font-family:monospace;font-size:14px;opacity:0.7;margin-top:6px;
  padding:4px 10px;border-radius:999px;
  background:rgba(255,255,255,0.06);
  display:inline-block;cursor:pointer;transition:background .15s;
}
.profile-uid:hover{background:rgba(255,255,255,0.14);}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin-bottom:28px;}
.stat{padding:18px;border-radius:14px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.10);}
.stat-label{font-size:11px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;opacity:0.55;margin-bottom:8px;}
.stat-value{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;}
.section{margin-bottom:20px;}
.section h3{font-size:14px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;opacity:0.55;margin-bottom:12px;}
.row{display:flex;gap:10px;flex-wrap:wrap;}
.btn{
  padding:12px 20px;border-radius:10px;
  border:1px solid rgba(255,255,255,0.15);
  background:rgba(255,255,255,0.05);
  color:inherit;font-family:inherit;font-size:14px;font-weight:700;
  cursor:pointer;transition:all .15s;text-decoration:none;
  display:inline-flex;align-items:center;gap:8px;
}
.btn:hover{background:rgba(255,255,255,0.12);}
.btn-primary{background:#fff;color:#0F3C73;border-color:#fff;}
.btn-danger{color:#FF4D5E;border-color:rgba(255,77,94,0.4);}
.field{margin-bottom:14px;}
.field label{display:block;font-size:11px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;opacity:0.55;margin-bottom:8px;}
.field input{
  width:100%;padding:12px 16px;border-radius:10px;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.15);
  color:inherit;font-family:inherit;font-size:15px;
  outline:none;box-sizing:border-box;
}
.field input:focus{border-color:rgba(255,255,255,0.5);}
.card{padding:20px;border-radius:14px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.10);margin-bottom:20px;}
.hide{display:none;}
.err{color:#FF4D5E;font-size:13px;margin-top:8px;min-height:18px;}
.loading{padding:60px 20px;text-align:center;opacity:0.5;}
.tasks-list{display:flex;flex-direction:column;gap:10px;}
.task-item{
  padding:16px 18px;border-radius:12px;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.1);
}
.task-item.done{background:rgba(74,222,128,0.1);border-color:rgba(74,222,128,0.35);}
.task-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px;}
.task-text{font-size:14px;font-weight:600;line-height:1.4;flex:1;}
.task-reward{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,0.08);color:#4ADE80;white-space:nowrap;}
.task-item.done .task-reward{background:#4ADE80;color:#0a1f0f;}
.task-progress-bar{height:6px;border-radius:3px;background:rgba(255,255,255,0.08);overflow:hidden;margin-bottom:6px;}
.task-progress-fill{height:100%;background:#6FA8FF;transition:width .3s;}
.task-item.done .task-progress-fill{background:#4ADE80;}
.task-progress-text{font-size:12px;color:rgba(255,255,255,0.55);font-variant-numeric:tabular-nums;}
.tasks-empty{padding:20px;text-align:center;opacity:0.55;font-size:13px;}
</style>
</head><body>

<div id="siteHeader"></div>

<div class="profile-wrap">

  <div id="loading" class="loading">Загрузка…</div>

  <div id="content" class="hide">

    <div class="profile-header">
      <div class="avatar" id="pAvatar">🎓</div>
      <div>
        <div class="profile-name" id="pName">—</div>
        <div class="profile-uid" id="pUid" title="Нажми, чтобы скопировать">—</div>
      </div>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="stat-label">🔥 Серия</div>
        <div class="stat-value" id="pStreak">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">💰 Монеты</div>
        <div class="stat-value" id="pCoins">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">🏆 Очки</div>
        <div class="stat-value" id="pScore">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">🎮 Партий</div>
        <div class="stat-value" id="pGames">0</div>
      </div>
    </div>

    <div class="card">
      <h3 style="font-size:14px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;opacity:0.55;margin-bottom:14px;">🎯 Задания на сегодня</h3>
      <div class="tasks-list" id="tasksList">
        <div class="tasks-empty">Загрузка…</div>
      </div>
    </div>

    <div class="card" id="changeNameCard" style="display:none;">
      <div class="section">
        <h3>Сменить имя</h3>
        <div class="field">
          <input type="text" id="newName" placeholder="Новое имя" maxlength="20">
        </div>
        <div class="row">
          <button class="btn btn-primary" id="btnSaveName">Сохранить</button>
          <button class="btn" id="btnCancelName">Отмена</button>
        </div>
        <div class="err" id="nameErr"></div>
      </div>
    </div>

    <div class="card" id="changePinCard" style="display:none;">
      <div class="section">
        <h3>Сменить PIN</h3>
        <div class="field">
          <label>Старый PIN</label>
          <input type="tel" id="oldPin" placeholder="••••" maxlength="4" inputmode="numeric">
        </div>
        <div class="field">
          <label>Новый PIN</label>
          <input type="tel" id="newPin" placeholder="••••" maxlength="4" inputmode="numeric">
        </div>
        <div class="row">
          <button class="btn btn-primary" id="btnSavePin">Сохранить</button>
          <button class="btn" id="btnCancelPin">Отмена</button>
        </div>
        <div class="err" id="pinErr"></div>
      </div>
    </div>

    <div class="section">
      <div class="row">
        <a class="btn" href="/shop">🛍 Магазин</a>
        <a class="btn" href="/ratings">🏆 Рейтинги</a>
        <button class="btn" id="btnChangeName">✏️ Сменить имя</button>
        <button class="btn" id="btnChangePin">🔑 Сменить PIN</button>
        <button class="btn btn-danger" id="btnLogout">🚪 Выйти</button>
      </div>
    </div>

  </div>
</div>

<script src="/static/site-header.js"></script>
<script>
renderSiteHeader('profile');

const LS_TOKEN = 'mgsu_token';
const LS_UID = 'mgsu_uid';
const token = localStorage.getItem(LS_TOKEN);

if (!token){
  location.href = '/auth';
}

const CHAR_EMOJI = {
  student: '🎓', sso: '👷', prorab: '📋',
  builder: '🏗️', prof: '🧑‍🏫', dean: '🧑‍💼', legend: '👑'
};

async function api(path, opts){
  opts = opts || {};
  const headers = Object.assign({'Content-Type':'application/json'}, opts.headers || {});
  if (token) headers['Authorization'] = 'Bearer ' + token;
  const res = await fetch(path, Object.assign({}, opts, {headers: headers}));
  if (res.status === 401){
    localStorage.removeItem(LS_TOKEN);
    localStorage.removeItem(LS_UID);
    localStorage.removeItem('mgsu_nick');
    location.href = '/auth';
    throw new Error('unauthorized');
  }
  return { status: res.status, data: await res.json() };
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function setUser(u){
  document.getElementById('pName').textContent = u.display_name;
  document.getElementById('pUid').textContent = u.uid;
  document.getElementById('pStreak').textContent = u.streak || 0;
  document.getElementById('pCoins').textContent = u.coins || 0;
  document.getElementById('pScore').textContent = u.total_score || 0;
  document.getElementById('pGames').textContent = u.games_played || 0;
  const av = document.getElementById('pAvatar');
  if (av && u.active_char){
    av.textContent = CHAR_EMOJI[u.active_char] || '🎓';
  }
  // Сохраняем ник для шапки
  localStorage.setItem('mgsu_nick', u.display_name);
  // Обновляем аватар в шапке
  const headerAvatar = document.querySelector('.site-header-avatar span');
  if (headerAvatar){
    headerAvatar.textContent = u.display_name.charAt(0).toUpperCase();
  }
}

async function loadMe(){
  try{
    const res = await api('/api/auth/me');
    if (res.status !== 200){ location.href = '/auth'; return; }
    setUser(res.data.user);
    document.getElementById('loading').classList.add('hide');
    document.getElementById('content').classList.remove('hide');
  }catch(e){}
}
loadMe();

async function loadTasks(){
  try{
    const res = await api('/api/tasks');
    renderTasks(res.data);
  }catch(e){
    const box = document.getElementById('tasksList');
    if (box) box.innerHTML = '<div class="tasks-empty">Не удалось загрузить</div>';
  }
}

function renderTasks(data){
  const box = document.getElementById('tasksList');
  if (!box) return;
  if (!data.logged_in){
    box.innerHTML = '<div class="tasks-empty">Войди в аккаунт, чтобы получать задания</div>';
    return;
  }
  if (!data.tasks || !data.tasks.length){
    box.innerHTML = '<div class="tasks-empty">Задания появятся утром</div>';
    return;
  }
  box.innerHTML = '';
  data.tasks.forEach(function(t){
    const item = document.createElement('div');
    item.className = 'task-item' + (t.done ? ' done' : '');
    const pct = t.target ? Math.min(100, Math.round(t.progress / t.target * 100)) : 0;
    item.innerHTML =
      '<div class="task-head">' +
        '<div class="task-text">' + escapeHtml(t.text) + '</div>' +
        '<div class="task-reward">+' + t.reward + '</div>' +
      '</div>' +
      '<div class="task-progress-bar"><div class="task-progress-fill" style="width:' + pct + '%"></div></div>' +
      '<div class="task-progress-text">' + (t.done ? '✓ Выполнено' : t.progress + ' / ' + t.target) + '</div>';
    box.appendChild(item);
  });
}
loadTasks();

document.getElementById('pUid').addEventListener('click', async function(){
  try{
    await navigator.clipboard.writeText(document.getElementById('pUid').textContent);
    const el = document.getElementById('pUid');
    const old = el.textContent;
    el.textContent = '✓ Скопировано';
    setTimeout(function(){ el.textContent = old; }, 1200);
  }catch(e){}
});

document.getElementById('btnChangeName').onclick = function(){
  document.getElementById('newName').value = document.getElementById('pName').textContent;
  document.getElementById('changeNameCard').style.display = 'block';
  document.getElementById('changePinCard').style.display = 'none';
  document.getElementById('nameErr').textContent = '';
};
document.getElementById('btnCancelName').onclick = function(){
  document.getElementById('changeNameCard').style.display = 'none';
};
document.getElementById('btnSaveName').onclick = async function(){
  const newName = document.getElementById('newName').value.trim();
  const errEl = document.getElementById('nameErr');
  errEl.textContent = '';
  if (newName.length > 20){
    errEl.textContent = 'Имя — до 20 символов';
    return;
  }
  try{
    const res = await api('/api/auth/update-name', {
      method:'POST',
      body: JSON.stringify({display_name: newName})
    });
    if (res.status !== 200){ errEl.textContent = res.data.detail || 'Ошибка'; return; }
    document.getElementById('pName').textContent = res.data.display_name;
    localStorage.setItem('mgsu_nick', res.data.display_name);
    document.getElementById('changeNameCard').style.display = 'none';
  }catch(e){ errEl.textContent = 'Ошибка'; }
};

document.getElementById('btnChangePin').onclick = function(){
  document.getElementById('oldPin').value = '';
  document.getElementById('newPin').value = '';
  document.getElementById('changePinCard').style.display = 'block';
  document.getElementById('changeNameCard').style.display = 'none';
  document.getElementById('pinErr').textContent = '';
};
document.getElementById('btnCancelPin').onclick = function(){
  document.getElementById('changePinCard').style.display = 'none';
};
document.getElementById('btnSavePin').onclick = async function(){
  const oldPin = document.getElementById('oldPin').value.trim();
  const newPin = document.getElementById('newPin').value.trim();
  const errEl = document.getElementById('pinErr');
  errEl.textContent = '';
  if (!/^\d{4}$/.test(newPin)){ errEl.textContent = 'Новый PIN — 4 цифры'; return; }
  try{
    const res = await api('/api/auth/update-pin', {
      method:'POST',
      body: JSON.stringify({old_pin: oldPin, new_pin: newPin})
    });
    if (res.status !== 200){ errEl.textContent = res.data.detail || 'Ошибка'; return; }
    document.getElementById('changePinCard').style.display = 'none';
    alert('PIN изменён. Войди заново.');
    localStorage.removeItem(LS_TOKEN);
    localStorage.removeItem(LS_UID);
    localStorage.removeItem('mgsu_nick');
    location.href = '/auth';
  }catch(e){ errEl.textContent = 'Ошибка'; }
};

document.getElementById('btnLogout').onclick = async function(){
  try{ await api('/api/auth/logout', {method:'POST'}); }catch(e){}
  localStorage.removeItem(LS_TOKEN);
  localStorage.removeItem(LS_UID);
  localStorage.removeItem('mgsu_nick');
  location.href = '/auth';
};

['oldPin','newPin'].forEach(function(id){
  document.getElementById(id).addEventListener('input', function(e){
    e.target.value = e.target.value.replace(/\D/g,'').slice(0,4);
  });
});
</script>

</body></html>
