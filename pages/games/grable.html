<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Грабли · Игры МГСУ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="/theme.css">
<style>
body{min-height:100vh;display:flex;flex-direction:column;background:#0a1f3d;color:#fff;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;}
.top{padding:12px 0;}
.top .head{height:52px;padding:0 18px;}
.top .brand-logo{width:32px !important;height:32px !important;}
.top .brand-label{font-size:13px;}
.top nav a{padding:6px 12px;font-size:13px;}

.status-banner{
  position:fixed;top:0;left:0;right:0;z-index:99;
  background:#AC1422;color:#fff;padding:12px 20px;
  text-align:center;font-size:13px;font-weight:600;display:none;
  box-shadow:0 4px 20px rgba(172,20,34,0.4);
}
.status-banner.show{display:block;}
.status-banner small{display:block;font-size:11px;font-weight:400;opacity:0.9;margin-top:2px;}

.game{flex:1;padding:24px 16px 40px;display:flex;flex-direction:column;align-items:center;}
.hud{display:flex;gap:14px;margin-bottom:20px;flex-wrap:wrap;justify-content:center;}
.hud-box{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.14);border-radius:999px;padding:8px 18px;font-size:14px;font-weight:700;backdrop-filter:blur(10px);}
.hud-box span{color:rgba(255,255,255,0.5);font-weight:500;margin-right:6px;}

.board{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;width:100%;max-width:460px;margin-top:20px;}
.cell{
  aspect-ratio:1;border-radius:12px;background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.14);font-size:32px;line-height:1;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-family:inherit;color:#fff;
  transition:transform .1s,background .15s;
  backdrop-filter:blur(10px);
}
.cell:hover{background:rgba(255,255,255,0.12);transform:scale(1.04);}
.cell:active{transform:scale(0.96);}
.cell.safe{background:rgba(74,222,128,0.2);border-color:rgba(74,222,128,0.5);cursor:default;}
.cell.rake{background:rgba(255,77,94,0.25);border-color:rgba(255,77,94,0.6);animation:shake .4s;}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-4px);}75%{transform:translateX(4px);}}

.overlay{position:fixed;inset:0;background:rgba(5,14,31,0.88);backdrop-filter:blur(10px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center;z-index:5;transition:opacity .3s;}
.overlay.hide{opacity:0;pointer-events:none;}
.overlay h2{font-size:28px;font-weight:800;letter-spacing:-0.02em;}
.overlay p{font-size:15px;color:rgba(255,255,255,0.7);max-width:340px;line-height:1.5;}
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 32px;border-radius:999px;background:#fff;color:#0F3C73;font-family:inherit;font-size:15px;font-weight:700;border:0;cursor:pointer;box-shadow:0 12px 30px rgba(0,0,0,0.3);}
.btn:active{transform:scale(0.97);}
.btn-ghost{background:rgba(255,255,255,0.08);color:#fff;border:1px solid rgba(255,255,255,0.2);box-shadow:none;}
.finish-emoji{font-size:72px;margin-bottom:8px;}
.finish-score{font-size:56px;font-weight:900;letter-spacing:-0.04em;font-variant-numeric:tabular-nums;}
.finish-label{font-size:11px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:rgba(255,255,255,0.5);}
</style>
</head><body>

<div class="status-banner" id="statusBanner">
  🔒 Технический перерыв
  <small id="statusBannerSub">Игры доступны только в учебное время</small>
</div>

<div class="top"><div class="wrap"><div class="head">
  <a class="brand" href="/glavnaya"><img src="/assets/Logo/logo.svg" alt="Лого" class="brand-logo"><span class="brand-label"><b>НИУ МГСУ</b> · Игры</span></a>
  <nav><a href="/glavnaya">Игры</a><a href="/privacy">О проекте</a></nav>
</div></div></div>

<div class="game">
  <div class="hud">
    <div class="hud-box"><span>❤️</span><b id="lives">3</b></div>
    <div class="hud-box"><span>Открыто</span><b id="opened">0</b></div>
  </div>
  <div class="board" id="board"></div>
</div>

<div class="overlay" id="startOv">
  <div class="finish-emoji">🎯</div>
  <h2>Грабли</h2>
  <p>Открывай клетки 5×5. Под некоторыми спрятаны грабли — наступишь, потеряешь жизнь. У тебя 3 жизни.</p>
  <button class="btn" id="startBtn">Начать →</button>
</div>

<div class="overlay hide" id="finishOv">
  <div class="finish-emoji" id="finishEmoji">🏆</div>
  <h2 id="finishTitle">Победа!</h2>
  <p id="finishDesc">Ты разгадал все безопасные клетки.</p>
  <div class="finish-score" id="finishScore">0</div>
  <div class="finish-label">клеток открыто</div>
  <div id="grableProgress" style="display:none;width:100%;max-width:420px;padding:14px 18px;border-radius:12px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);font-size:14px;text-align:left;margin-top:8px;line-height:1.6;"></div>
  <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:8px;">
    <button class="btn" id="againBtn">Ещё раз</button>
  </div>
</div>

<script>
/* ============ ПРОВЕРКА РАСПИСАНИЯ ============ */
let scheduleOpen = true;
async function checkScheduleStatus(){
  try{
    const r = await fetch('/status');
    const s = await r.json();
    scheduleOpen = !!s.open;
    const banner = document.getElementById('statusBanner');
    const sub = document.getElementById('statusBannerSub');
    if (!scheduleOpen){
      sub.textContent = 'Игры доступны только в учебное время: с ' + s.opens_at + ' до ' + s.closes_at;
      banner.classList.add('show');
      running = false;
    } else {
      banner.classList.remove('show');
    }
  }catch(e){}
}
checkScheduleStatus();
setInterval(checkScheduleStatus, 60000);

const SIZE = 5;
const TOTAL = SIZE * SIZE;
const RAKES = 5;
const START_LIVES = 3;

let cells = [], lives, opened, running;
const board = document.getElementById('board');
const livesEl = document.getElementById('lives');
const openedEl = document.getElementById('opened');

function start(){
  if (!scheduleOpen){ checkScheduleStatus(); return; }
  cells = [];
  lives = START_LIVES;
  opened = 0;
  running = true;
  const rakeIdx = new Set();
  while (rakeIdx.size < RAKES) rakeIdx.add(Math.floor(Math.random() * TOTAL));
  for (let i = 0; i < TOTAL; i++) cells.push({isRake: rakeIdx.has(i), opened: false, hitRake: false});
  livesEl.textContent = lives;
  openedEl.textContent = opened;
  document.getElementById('startOv').classList.add('hide');
  document.getElementById('finishOv').classList.add('hide');
  renderBoard();
}

function renderBoard(){
  board.innerHTML = '';
  cells.forEach((cell, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'cell';
    if (cell.opened){
      if (cell.hitRake){ b.classList.add('rake'); b.textContent = '🪤'; }
      else { b.classList.add('safe'); b.textContent = '✓'; }
    }
    b.onclick = () => clickCell(i, b);
    board.appendChild(b);
  });
}

function clickCell(i, btn){
  if (!running || !scheduleOpen) return;
  const cell = cells[i];
  if (cell.opened) return;
  cell.opened = true;
  if (cell.isRake){
    cell.hitRake = true;
    lives--;
    livesEl.textContent = lives;
    btn.classList.add('rake');
    btn.textContent = '🪤';
    if (lives <= 0){ running = false; setTimeout(() => finish(false), 400); }
  } else {
    opened++;
    openedEl.textContent = opened;
    btn.classList.add('safe');
    btn.textContent = '✓';
    if (opened >= TOTAL - RAKES){ running = false; setTimeout(() => finish(true), 400); }
  }
}

async function finish(win){
  document.getElementById('finishEmoji').textContent = win ? '🏆' : '💥';
  document.getElementById('finishTitle').textContent = win ? 'Победа!' : 'Грабли настигли';
  document.getElementById('finishDesc').textContent = win
    ? 'Ты нашёл все безопасные клетки.'
    : 'Ты потерял все жизни. Попробуй снова!';
  document.getElementById('finishScore').textContent = opened;
  document.getElementById('finishOv').classList.remove('hide');

  const token = localStorage.getItem('mgsu_token') || '';
  const block = document.getElementById('grableProgress');
  if (block){
    block.style.display = 'block';
    block.textContent = 'Отправляю результат…';
  }
  try{
    const headers = {'Content-Type':'application/json'};
    if (token) headers['Authorization'] = 'Bearer ' + token;
    const res = await fetch('/api/game/finish', {
      method:'POST',
      headers,
      body: JSON.stringify({game: 'grable', raw_score: opened, extra: {win: !!win}})
    });
    const data = await res.json();
    renderGrableProgress(data);
  }catch(e){
    if (block) block.style.display = 'none';
  }
}

function renderGrableProgress(data){
  const block = document.getElementById('grableProgress');
  if (!block) return;
  if (!data.logged_in){
    block.innerHTML = '💡 Хочешь монеты и топ? <a href="/auth" style="color:#4ADE80;text-decoration:none;font-weight:700;">Создай аккаунт</a>';
    return;
  }
  let html = '';
  html += '<div>🎯 Очков: <b>+' + data.points + '</b></div>';
  if (data.progress){
    html += '<div>💰 Монет: <b>' + data.progress.coins + '</b></div>';
    html += '<div>🔥 Серия: <b>' + data.progress.streak + '</b> дней';
    if (data.progress.streak_changed) html += ' <span style="color:#4ADE80;">+1</span>';
    html += '</div>';
  }
  if (data.tasks_completed && data.tasks_completed.length){
    data.tasks_completed.forEach(t => {
      html += '<div style="color:#4ADE80;">✓ ' + t.text + ' (+' + t.reward + ')</div>';
    });
  }
  html += '<div style="margin-top:8px;"><a href="/profile" style="color:rgba(255,255,255,0.7);text-decoration:none;font-size:13px;font-weight:600;">Открыть профиль →</a></div>';
  block.innerHTML = html;
}

document.getElementById('startBtn').onclick = start;
document.getElementById('againBtn').onclick = start;

cells = [];
for (let i = 0; i < TOTAL; i++) cells.push({isRake:false, opened:false, hitRake:false});
renderBoard();
</script>

</body></html>
