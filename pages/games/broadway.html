<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Бродвей · Игры МГСУ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/static/site-header.css">
<style>
body{height:100vh;overflow:hidden;display:flex;flex-direction:column;background:#0a1f3d;color:#fff;user-select:none;-webkit-user-select:none;touch-action:none;}
.status-banner{position:fixed;top:0;left:0;right:0;z-index:99;background:#AC1422;color:#fff;padding:12px 20px;text-align:center;font-size:13px;font-weight:600;display:none;box-shadow:0 4px 20px rgba(172,20,34,0.4);}
.status-banner.show{display:block;}
.status-banner small{display:block;font-size:11px;font-weight:400;opacity:0.9;margin-top:2px;}
.game-wrap{flex:1;position:relative;overflow:hidden;background:#0a0f1e;min-height:0;}
.hud{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:3;}
.hud-left{display:flex;flex-direction:column;gap:6px;}
.hud-box{background:rgba(15,60,115,0.85);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.14);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;}
.hud-box span{color:rgba(255,255,255,0.55);font-weight:500;font-size:11px;}
.hud-box b{color:#fff;font-variant-numeric:tabular-nums;}
.time-bar{position:absolute;bottom:14px;left:14px;right:14px;height:6px;background:rgba(255,255,255,0.1);border-radius:3px;overflow:hidden;z-index:3;}
.time-bar-fill{height:100%;background:linear-gradient(90deg,#4ADE80,#6FA8FF);border-radius:3px;transition:width 0.5s linear;}
.overlay{position:absolute;inset:0;background:rgba(5,14,31,0.88);backdrop-filter:blur(10px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center;z-index:5;transition:opacity .3s;}
.overlay.hide{opacity:0;pointer-events:none;}
.overlay h2{font-size:28px;font-weight:800;letter-spacing:-0.02em;}
.overlay p{font-size:15px;color:rgba(255,255,255,0.7);max-width:360px;line-height:1.5;}
.overlay-emoji{font-size:64px;margin-bottom:4px;}
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 32px;border-radius:999px;background:#fff;color:#0F3C73;font-family:inherit;font-size:15px;font-weight:700;border:0;cursor:pointer;box-shadow:0 12px 30px rgba(0,0,0,0.3);transition:transform .1s;}
.btn:active{transform:scale(0.97);}
.btn-ghost{background:rgba(255,255,255,0.08);color:#fff;border:1px solid rgba(255,255,255,0.2);box-shadow:none;}
.finish-score{font-size:56px;font-weight:900;letter-spacing:-0.04em;font-variant-numeric:tabular-nums;line-height:1;}
.finish-label{font-size:11px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:rgba(255,255,255,0.5);margin-bottom:12px;}
.finish-rank{font-size:24px;font-weight:800;color:#fff;margin-top:8px;}
.finish-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:8px;}
@media(max-width:640px){
  .overlay h2{font-size:22px;}
  .finish-score{font-size:44px;}
  .hud-box{padding:5px 10px;font-size:12px;}
  .hud-box span{font-size:10px;}
}
</style>
</head><body>

<div class="status-banner" id="statusBanner">
  🔒 Технический перерыв
  <small id="statusBannerSub">Игры доступны только в учебное время</small>
</div>

<div id="siteHeader"></div>

<div class="game-wrap">
  <div class="hud">
    <div class="hud-left">
      <div class="hud-box"><span>Дист.</span><b id="hudDist">0</b> м</div>
      <div class="hud-box"><span>Монеты</span><b id="hudCoins">0</b></div>
    </div>
    <div class="hud-box"><span>⏱</span><b id="hudTime">30</b></div>
  </div>

  <canvas id="c"></canvas>

  <div class="time-bar"><div class="time-bar-fill" id="timeBar"></div></div>

  <div class="overlay" id="startOv">
    <div class="overlay-emoji">🏃‍♂️</div>
    <h2>Бродвей</h2>
    <p>Беги по коридору МГСУ. Тапай — прыгай через препятствия. Собирай кофе и монеты. Не врежься!</p>
    <button class="btn" id="startBtn">Начать бег →</button>
  </div>

  <div class="overlay hide" id="finishOv">
    <div class="overlay-emoji" id="finishEmoji">🏁</div>
    <div class="finish-score" id="finishScore">0</div>
    <div class="finish-label">метров пройдено</div>
    <div class="finish-rank" id="finishRank">Знаток Бродвея</div>
    <div style="display:flex;gap:20px;margin-top:8px;font-size:14px;color:rgba(255,255,255,0.7);">
      <span>💰 Монет: <b id="finishCoins" style="color:#fff;">0</b></span>
      <span>📊 Очков: <b id="finishPoints" style="color:#fff;">0</b></span>
    </div>
    <div id="broadwayProgress" style="display:none;width:100%;max-width:420px;padding:14px 18px;border-radius:12px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);font-size:14px;text-align:left;margin-top:8px;line-height:1.6;"></div>
    <div class="finish-actions">
      <button class="btn" id="shareBtn">Показать другу</button>
      <button class="btn btn-ghost" id="againBtn">Ещё раз</button>
    </div>
  </div>
</div>

<script src="/static/site-header.js"></script>
<script>
renderSiteHeader('games');

let scheduleOpen = true;
async function checkScheduleStatus(){
  try{
    const r = await fetch('/status');
    const s = await r.json();
    scheduleOpen = !!s.open;
    const banner = document.getElementById('statusBanner');
    const sub = document.getElementById('statusBannerSub');
    if (!scheduleOpen){
      sub.textContent = 'Игры доступны только в учебное время: с ' + s.opens_at + ' до ' + s.closes_at;
      banner.classList.add('show');
    } else {
      banner.classList.remove('show');
    }
  }catch(e){}
}
checkScheduleStatus();
setInterval(checkScheduleStatus, 60000);

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let CW = 0, CH = 0, DPR = 1;
function resize(){
  const rect = canvas.parentElement.getBoundingClientRect();
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  CW = rect.width; CH = rect.height;
  canvas.width = CW * DPR; canvas.height = CH * DPR;
  canvas.style.width = CW + 'px'; canvas.style.height = CH + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', resize);

const GROUND_Y_RATIO = 0.78;
let groundY = 0;

const player = { x:120, y:0, vy:0, w:34, h:48, onGround:true, runPhase:0, jumpCount:0 };
let obstacles = [], items = [], particles = [];
let speed = 320, distance = 0, coinsCollected = 0, timeLeft = 30, running = false;
let lastTime = 0, spawnTimer = 0, itemTimer = 0, timerId = null;

const GRAVITY = 1800, JUMP_VY = -680, MAX_JUMPS = 1;
const OBSTACLE_TYPES = [
  {w:40,h:50,type:'chair'},
  {w:46,h:42,type:'box'},
  {w:50,h:30,type:'flower'},
];
const ITEM_TYPES = [
  {w:26,h:32,type:'coffee'},
  {w:22,h:22,type:'coin'},
  {w:28,h:28,type:'note'},
];

function resetGame(){
  obstacles = []; items = []; particles = [];
  speed = 320; distance = 0; coinsCollected = 0; timeLeft = 30;
  spawnTimer = 0; itemTimer = 0;
  player.y = 0; player.vy = 0; player.onGround = true; player.jumpCount = 0; player.runPhase = 0;
}

function startGame(){
  if (!scheduleOpen){ checkScheduleStatus(); return; }
  resetGame();
  running = true;
  document.getElementById('startOv').classList.add('hide');
  document.getElementById('finishOv').classList.add('hide');
  document.getElementById('broadwayProgress').style.display = 'none';
  document.getElementById('hudDist').textContent = '0';
  document.getElementById('hudCoins').textContent = '0';
  document.getElementById('hudTime').textContent = '30';
  document.getElementById('timeBar').style.width = '100%';
  clearInterval(timerId);
  timerId = setInterval(tick, 1000);
  lastTime = performance.now();
}

function tick(){
  if (!running) return;
  timeLeft--;
  document.getElementById('hudTime').textContent = timeLeft;
  document.getElementById('timeBar').style.width = Math.max(0, (timeLeft/30)*100) + '%';
  if (timeLeft <= 0) stopGame();
}

async function stopGame(){
  if (!running) return;
  running = false;
  clearInterval(timerId);
  const dist = Math.floor(distance);
  const r = rankFor(dist);
  document.getElementById('finishEmoji').textContent = r.emoji;
  document.getElementById('finishScore').textContent = dist;
  document.getElementById('finishRank').textContent = r.name;
  document.getElementById('finishCoins').textContent = coinsCollected;
  document.getElementById('finishPoints').textContent = dist;
  document.getElementById('finishOv').classList.remove('hide');

  const token = localStorage.getItem('mgsu_token') || '';
  const block = document.getElementById('broadwayProgress');
  if (block){ block.style.display = 'block'; block.textContent = 'Отправляю результат…'; }
  try{
    const headers = {'Content-Type':'application/json'};
    if (token) headers['Authorization'] = 'Bearer ' + token;
    const res = await fetch('/api/game/finish', {
      method:'POST', headers,
      body: JSON.stringify({game:'broadway', raw_score: dist})
    });
    const data = await res.json();
    renderProgress(data);
  }catch(e){
    if (block) block.style.display = 'none';
  }
}

function renderProgress(data){
  const block = document.getElementById('broadwayProgress');
  if (!block) return;
  if (!data.logged_in){
    block.innerHTML = '💡 Хочешь монеты и топ? <a href="/auth" style="color:#4ADE80;text-decoration:none;font-weight:700;">Создай аккаунт</a>';
    return;
  }
  let html = '<div>🎯 Очков: <b>+' + data.points + '</b></div>';
  if (data.progress){
    html += '<div>💰 Монет: <b>' + data.progress.coins + '</b></div>';
    html += '<div>🔥 Серия: <b>' + data.progress.streak + '</b> дней';
    if (data.progress.streak_changed) html += ' <span style="color:#4ADE80;">+1</span>';
    html += '</div>';
  }
  if (data.tasks_completed && data.tasks_completed.length){
    data.tasks_completed.forEach(t => { html += '<div style="color:#4ADE80;">✓ ' + t.text + ' (+' + t.reward + ')</div>'; });
  }
  html += '<div style="margin-top:8px;"><a href="/profile" style="color:rgba(255,255,255,0.7);text-decoration:none;font-size:13px;font-weight:600;">Открыть профиль →</a></div>';
  block.innerHTML = html;
}

function rankFor(d){
  if (d < 150) return {name:'Первокурсник', emoji:'🚶'};
  if (d < 350) return {name:'Знаток Бродвея', emoji:'🚶‍♂️'};
  if (d < 600) return {name:'Ходок', emoji:'🏃'};
  if (d < 900) return {name:'Марафонец МГСУ', emoji:'🏃‍♂️'};
  return {name:'Легенда Бродвея', emoji:'👑'};
}

function jump(){
  if (!running) return;
  if (player.jumpCount < MAX_JUMPS){
    player.vy = JUMP_VY;
    player.jumpCount++;
    player.onGround = false;
    for (let i = 0; i < 5; i++){
      particles.push({x: player.x + player.w/2, y: groundY, vx:(Math.random()-0.5)*100, vy:-Math.random()*60-20, life:0.5, size:2+Math.random()*2, color:'rgba(255,255,255,0.6)'});
    }
  }
}
canvas.addEventListener('pointerdown', e => { e.preventDefault(); jump(); });
document.addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'ArrowUp'){ e.preventDefault(); jump(); } });

function spawnObstacle(){
  const t = OBSTACLE_TYPES[Math.floor(Math.random()*OBSTACLE_TYPES.length)];
  obstacles.push({x: CW + 40, y: 0, w: t.w, h: t.h, type: t.type, passed: false});
}
function spawnItem(){
  const t = ITEM_TYPES[Math.floor(Math.random()*ITEM_TYPES.length)];
  const heightOffset = t.type === 'coffee' ? 0 : 60 + Math.random()*80;
  items.push({x: CW + 40, y: heightOffset, w: t.w, h: t.h, type: t.type, collected: false});
}

function drawBackground(){
  const grad = ctx.createLinearGradient(0, 0, 0, CH);
  grad.addColorStop(0, '#0a1f3d');
  grad.addColorStop(0.7, '#0d2a52');
  grad.addColorStop(1, '#051530');
  ctx.fillStyle = grad; ctx.fillRect(0, 0, CW, CH);

  const wallOffset = (distance * 0.9) % 200;
  for (let i = -1; i < CW / 200 + 2; i++){
    const x = i * 200 - wallOffset;
    ctx.fillStyle = 'rgba(111,168,255,0.10)'; ctx.fillRect(x + 30, 120, 60, 90);
    ctx.strokeStyle = 'rgba(111,168,255,0.25)'; ctx.lineWidth = 2; ctx.strokeRect(x + 30, 120, 60, 90);
    ctx.beginPath();
    ctx.moveTo(x + 60, 120); ctx.lineTo(x + 60, 210);
    ctx.moveTo(x + 30, 165); ctx.lineTo(x + 90, 165);
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.04)'; ctx.fillRect(x + 120, 160, 50, 100);
    ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.strokeRect(x + 120, 160, 50, 100);
  }
}

function drawGround(){
  ctx.fillStyle = '#1a2f4d'; ctx.fillRect(0, groundY, CW, CH - groundY);
  const tileOffset = (distance * 6) % 80;
  for (let i = -1; i < CW / 80 + 2; i++){
    const x = i * 80 - tileOffset;
    ctx.strokeStyle = 'rgba(255,255,255,0.06)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x, groundY); ctx.lineTo(x - 30, CH); ctx.stroke();
    for (let j = 0; j < 3; j++){
      const y = groundY + (j + 1) * ((CH - groundY) / 4);
      ctx.strokeStyle = 'rgba(255,255,255,0.04)';
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(CW, y); ctx.stroke();
    }
  }
  ctx.fillStyle = '#6FA8FF'; ctx.fillRect(0, groundY - 2, CW, 2);
}

function drawPlayer(){
  const px = player.x, py = groundY - player.h - player.y, t = player.runPhase;
  ctx.save();
  ctx.translate(px + player.w/2, py + player.h);
  const legSwing = Math.sin(t) * 8, armSwing = Math.sin(t) * 10;
  ctx.fillStyle = '#1A1A1A';
  ctx.fillRect(-8 + legSwing*0.5, -14, 6, 14);
  ctx.fillRect(2 - legSwing*0.5, -14, 6, 14);
  ctx.fillStyle = '#FF4D5E';
  ctx.fillRect(-10 + legSwing*0.5, -2, 10, 4);
  ctx.fillRect(0 - legSwing*0.5, -2, 10, 4);
  ctx.fillStyle = '#0F3C73'; ctx.fillRect(-10, -38, 20, 24);
  ctx.fillStyle = '#FFD700'; ctx.fillRect(-1, -38, 2, 24);
  ctx.fillStyle = '#4A3421'; ctx.fillRect(-16, -34, 8, 16);
  ctx.fillStyle = '#6B4A2B'; ctx.fillRect(-15, -32, 6, 4);
  ctx.fillStyle = '#0F3C73';
  ctx.fillRect(-14, -34 + armSwing*0.5, 5, 12);
  ctx.fillRect(9, -34 - armSwing*0.5, 5, 12);
  ctx.fillStyle = '#F2C39B';
  ctx.fillRect(-14, -22 + armSwing*0.5, 5, 4);
  ctx.fillRect(9, -22 - armSwing*0.5, 5, 4);
  ctx.fillStyle = '#F2C39B'; ctx.fillRect(-8, -56, 16, 18);
  ctx.fillStyle = '#3D2817'; ctx.fillRect(-8, -56, 16, 6); ctx.fillRect(-9, -54, 2, 10);
  ctx.fillStyle = '#1A1A1A'; ctx.fillRect(3, -48, 3, 3);
  ctx.fillRect(2, -42, 6, 1.5);
  ctx.restore();
}

function drawObstacle(o){
  const x = o.x, y = groundY - o.h;
  if (o.type === 'chair'){
    ctx.fillStyle = '#8B5A2B';
    ctx.fillRect(x + 4, y + o.h - 30, o.w - 8, 6);
    ctx.fillRect(x + 6, y + o.h - 44, o.w - 12, 14);
    ctx.fillStyle = '#5A3F27';
    ctx.fillRect(x + 4, y + o.h - 24, 5, 24);
    ctx.fillRect(x + o.w - 9, y + o.h - 24, 5, 24);
  } else if (o.type === 'box'){
    ctx.fillStyle = '#B8763B'; ctx.fillRect(x, y, o.w, o.h);
    ctx.strokeStyle = '#5A3F27'; ctx.lineWidth = 2; ctx.strokeRect(x, y, o.w, o.h);
    ctx.fillStyle = 'rgba(255,220,150,0.6)'; ctx.fillRect(x + o.w/2 - 3, y, 6, o.h);
  } else {
    ctx.fillStyle = '#4A3421'; ctx.fillRect(x, y + 12, o.w, o.h - 12);
    ctx.fillStyle = '#6B4A2B'; ctx.fillRect(x, y + 10, o.w, 4);
    ctx.fillStyle = '#6B8C4A'; ctx.fillRect(x + o.w/2 - 1, y, 2, 12);
    ctx.fillStyle = '#FF4D5E'; ctx.beginPath(); ctx.arc(x + o.w/2, y - 2, 4, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#FFD700'; ctx.beginPath(); ctx.arc(x + o.w/2, y - 2, 2, 0, Math.PI*2); ctx.fill();
  }
}

function drawItem(it){
  const x = it.x, y = groundY - it.h - it.y;
  const t = performance.now() / 1000;
  const bob = Math.sin(t * 4 + it.x * 0.01) * 3;
  if (it.type === 'coffee'){
    ctx.fillStyle = '#AC1422'; ctx.fillRect(x + 4, y + 8 + bob, it.w - 8, it.h - 8);
    ctx.fillStyle = '#F2E3C6'; ctx.fillRect(x + 4, y + 8 + bob, it.w - 8, 4);
    ctx.strokeStyle = '#AC1422'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(x + it.w - 2, y + it.h/2 + 4 + bob, 5, -Math.PI/2, Math.PI/2); ctx.stroke();
  } else if (it.type === 'coin'){
    const scale = Math.abs(Math.cos(t * 3)) * 0.7 + 0.3;
    ctx.fillStyle = '#FFD700';
    ctx.beginPath(); ctx.ellipse(x + it.w/2, y + it.h/2 + bob, (it.w/2)*scale, it.h/2, 0, 0, Math.PI*2); ctx.fill();
  } else {
    ctx.fillStyle = '#F2E3C6'; ctx.fillRect(x, y + bob, it.w, it.h);
    ctx.strokeStyle = '#8B5A2B'; ctx.lineWidth = 1; ctx.strokeRect(x, y + bob, it.w, it.h);
  }
}

function drawParticles(){
  particles.forEach(p => {
    ctx.globalAlpha = p.life; ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha = 1;
}

function loop(now){
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;

  if (running){
    speed += dt * 8; if (speed > 620) speed = 620;
    distance += speed * dt;
    const worldDx = speed * dt;

    player.vy += GRAVITY * dt;
    player.y -= player.vy * dt;
    if (player.y <= 0){ player.y = 0; player.vy = 0; player.onGround = true; player.jumpCount = 0; }
    else player.onGround = false;
    if (player.onGround) player.runPhase += dt * 20;

    spawnTimer += dt;
    if (spawnTimer > Math.max(0.6, 1.2 - distance/4000)){ spawnTimer = 0; spawnObstacle(); }
    itemTimer += dt;
    if (itemTimer > 1.8){ itemTimer = 0; if (Math.random() < 0.8) spawnItem(); }

    obstacles = obstacles.filter(o => {
      o.x -= worldDx;
      const px = player.x, py = groundY - player.h - player.y;
      if (px + player.w*0.6 > o.x + 4 && px + player.w*0.4 < o.x + o.w - 4 &&
          py + player.h > groundY - o.h + 4 && py + player.h*0.4 < groundY){
        stopGame();
      }
      return o.x > -100;
    });

    items = items.filter(it => {
      it.x -= worldDx;
      const px = player.x, py = groundY - player.h - player.y;
      const ix = it.x, iy = groundY - it.h - it.y;
      if (px + player.w > ix && px < ix + it.w && py + player.h > iy && py < iy + it.h){
        if (it.type === 'coin'){ coinsCollected++; distance += 15; }
        else if (it.type === 'coffee'){ speed = Math.min(speed + 80, 620); distance += 8; }
        else distance += 10;
        document.getElementById('hudCoins').textContent = coinsCollected;
        for (let i = 0; i < 8; i++){
          particles.push({x: it.x + it.w/2, y: iy + it.h/2, vx:(Math.random()-0.5)*200, vy:-Math.random()*100-30, life:0.6, size:2+Math.random()*3, color: it.type === 'coin' ? '#FFD700' : (it.type === 'coffee' ? '#AC1422' : '#F2E3C6')});
        }
        return false;
      }
      return it.x > -60;
    });

    particles = particles.filter(p => {
      p.x -= worldDx * 0.3; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 400 * dt; p.life -= dt;
      return p.life > 0;
    });

    document.getElementById('hudDist').textContent = Math.floor(distance);
  }

  drawBackground();
  drawGround();
  items.forEach(drawItem);
  obstacles.forEach(drawObstacle);
  drawPlayer();
  drawParticles();
}

resize();
groundY = CH * GROUND_Y_RATIO;
lastTime = performance.now();
requestAnimationFrame(loop);

window.addEventListener('resize', () => { resize(); groundY = CH * GROUND_Y_RATIO; });
setTimeout(() => { resize(); groundY = CH * GROUND_Y_RATIO; }, 100);

document.getElementById('startBtn').onclick = startGame;
document.getElementById('againBtn').onclick = startGame;
document.getElementById('shareBtn').onclick = async () => {
  const text = `Прошёл ${Math.floor(distance)} метров по Бродвею МГСУ и собрал ${coinsCollected} монет! А ты?\nhttps://mgsu-wall.onrender.com/games/broadway`;
  try{
    if (navigator.share) await navigator.share({text});
    else await navigator.clipboard.writeText(text);
  }catch(e){}
};
</script>
