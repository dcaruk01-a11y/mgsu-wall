<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Дашборд · Админка Игр МГСУ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="/static/admin.css">
<style>
.health-banner{
  display:flex;align-items:center;gap:16px;
  padding:20px 24px;border-radius:14px;
  margin-bottom:28px;
  border:1px solid;
  background:rgba(255,255,255,0.04);
}
.health-banner.good{border-color:rgba(74,222,128,0.4);background:rgba(74,222,128,0.08);}
.health-banner.warn{border-color:rgba(255,189,46,0.4);background:rgba(255,189,46,0.08);}
.health-banner.bad{border-color:rgba(255,77,94,0.4);background:rgba(255,77,94,0.08);}
.health-dot{
  width:16px;height:16px;border-radius:50%;flex-shrink:0;
  box-shadow:0 0 12px currentColor;
}
.health-banner.good .health-dot{background:#4ADE80;color:#4ADE80;}
.health-banner.warn .health-dot{background:#FFBD2E;color:#FFBD2E;}
.health-banner.bad .health-dot{background:#FF4D5E;color:#FF4D5E;}
.health-info{flex:1;}
.health-label{font-size:16px;font-weight:800;margin-bottom:4px;}
.health-text{font-size:13px;color:rgba(255,255,255,0.7);line-height:1.5;}

.metrics-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:14px;
  margin-bottom:32px;
}
.metric-card{
  position:relative;
  padding:20px 22px;
  border-radius:14px;
  background:rgba(255,255,255,0.045);
  border:1px solid rgba(255,255,255,0.10);
  transition:background .15s;
}
.metric-card.good{border-color:rgba(74,222,128,0.35);background:rgba(74,222,128,0.05);}
.metric-card.warn{border-color:rgba(255,189,46,0.35);background:rgba(255,189,46,0.05);}
.metric-card.bad{border-color:rgba(255,77,94,0.35);background:rgba(255,77,94,0.05);}

.metric-head{
  display:flex;align-items:center;gap:10px;
  margin-bottom:10px;
}
.metric-dot{
  width:9px;height:9px;border-radius:50%;flex-shrink:0;
}
.metric-card.good .metric-dot{background:#4ADE80;box-shadow:0 0 8px #4ADE80;}
.metric-card.warn .metric-dot{background:#FFBD2E;box-shadow:0 0 8px #FFBD2E;}
.metric-card.bad .metric-dot{background:#FF4D5E;box-shadow:0 0 8px #FF4D5E;}
.metric-card.neutral .metric-dot{background:rgba(255,255,255,0.3);}
.metric-title{
  font-size:11px;font-weight:700;letter-spacing:0.12em;
  text-transform:uppercase;color:rgba(255,255,255,0.6);
}
.metric-value{
  font-size:30px;font-weight:900;
  color:#fff;font-variant-numeric:tabular-nums;
  letter-spacing:-0.02em;
  margin-bottom:14px;
  line-height:1.1;
}
.metric-value.small{font-size:18px;}
.metric-verdict{
  font-size:13px;color:rgba(255,255,255,0.85);
  line-height:1.55;
  margin-bottom:6px;
}
.metric-hint{
  font-size:12px;color:rgba(255,255,255,0.5);
  line-height:1.55;font-style:italic;
  padding-top:6px;
  border-top:1px solid rgba(255,255,255,0.06);
}
.metric-hint:empty{display:none;}
  /* Блок расписания */
.schedule-block{
  padding:24px;
  background:rgba(255,255,255,0.045);
  border:1px solid rgba(255,255,255,0.10);
  border-radius:14px;
  display:flex;
  flex-direction:column;
  gap:18px;
}
.schedule-status{
  display:flex;align-items:center;gap:12px;
  padding:14px 18px;border-radius:10px;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.08);
}
.schedule-status .dot{
  width:12px;height:12px;border-radius:50%;
  box-shadow:0 0 10px currentColor;
}
.schedule-status.open .dot{background:#4ADE80;color:#4ADE80;}
.schedule-status.closed .dot{background:#FF4D5E;color:#FF4D5E;}
.schedule-status strong{font-size:14px;font-weight:800;color:#fff;}
.schedule-status span{font-size:13px;color:rgba(255,255,255,0.6);margin-left:auto;}

.schedule-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}
.schedule-input-group label{
  display:block;font-size:11px;font-weight:700;
  letter-spacing:0.12em;text-transform:uppercase;
  color:rgba(255,255,255,0.5);
  margin-bottom:8px;
}
.schedule-input-group input{
  width:100%;padding:12px 14px;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.15);
  border-radius:10px;color:#fff;
  font-family:inherit;font-size:15px;
  outline:none;
  box-sizing:border-box;
}
.schedule-input-group input:focus{border-color:rgba(255,255,255,0.4);}

.override-row{
  display:flex;gap:10px;flex-wrap:wrap;
}
.override-btn{
  flex:1;min-width:140px;
  padding:12px 18px;
  border-radius:10px;
  border:1px solid rgba(255,255,255,0.15);
  background:rgba(255,255,255,0.04);
  color:rgba(255,255,255,0.8);
  font-family:inherit;font-size:13px;font-weight:700;
  cursor:pointer;transition:all .15s;
}
.override-btn:hover{background:rgba(255,255,255,0.10);color:#fff;}
.override-btn.active{background:#fff;color:#0F3C73;border-color:#fff;}
.override-btn.active.open-active{background:#4ADE80;color:#0a1f0f;border-color:#4ADE80;}
.override-btn.active.closed-active{background:#FF4D5E;color:#fff;border-color:#FF4D5E;}

.save-schedule-btn{
  padding:14px;
  border-radius:10px;border:0;
  background:#fff;color:#0F3C73;
  font-family:inherit;font-size:14px;font-weight:800;
  cursor:pointer;
  transition:transform .1s;
}
.save-schedule-btn:hover{transform:translateY(-1px);}
</style>
</head><body class="admin-page">

<div id="dashView" class="admin-wrap">
  <div class="admin-header">
    <div>
      <div class="admin-title">Дашборд</div>
      <div class="admin-sub" id="uptimeLabel">—</div>
    </div>
    <button class="logout-btn" id="logoutBtn">Выйти</button>
  </div>

  <div class="health-banner" id="healthBanner">
    <div class="health-dot"></div>
    <div class="health-info">
      <div class="health-label" id="healthLabel">—</div>
      <div class="health-text" id="healthText">—</div>
    </div>
  </div>

  <div class="metrics-grid" id="metricsGrid">Загрузка…</div>
<div class="section-admin">
  <h2>Расписание и доступ</h2>
  <div class="schedule-block">

    <div class="schedule-status" id="scheduleStatus">
      <div class="dot"></div>
      <strong id="scheduleStatusText">—</strong>
      <span id="scheduleCurrentTime">—</span>
    </div>

    <div class="schedule-row">
      <div class="schedule-input-group">
        <label>Открытие — час</label>
        <input type="number" id="openHour" min="0" max="23" value="8">
      </div>
      <div class="schedule-input-group">
        <label>Открытие — минуты</label>
        <input type="number" id="openMinute" min="0" max="59" value="30">
      </div>
      <div class="schedule-input-group">
        <label>Закрытие — час</label>
        <input type="number" id="closeHour" min="0" max="23" value="17">
      </div>
      <div class="schedule-input-group">
        <label>Закрытие — минуты</label>
        <input type="number" id="closeMinute" min="0" max="59" value="20">
      </div>
    </div>

    <div>
      <label style="display:block;font-size:11px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:rgba(255,255,255,0.5);margin-bottom:8px;">
        Режим принудительно
      </label>
      <div class="override-row">
        <button class="override-btn" data-override="auto">По расписанию</button>
        <button class="override-btn" data-override="open">Всегда открыто</button>
        <button class="override-btn" data-override="close">Всегда закрыто</button>
      </div>
    </div>

    <button class="save-schedule-btn" id="saveScheduleBtn">Сохранить расписание</button>
  </div>
</div>
  <div class="section-admin">
    <h2>Топ кликера сегодня</h2>
    <div class="card-block" id="clickerTopBox">Загрузка…</div>
  </div>

  <div class="section-admin">
    <h2>Игры</h2>
    <div class="card-block" id="gamesBox">Загрузка…</div>
  </div>

  <div class="section-admin">
    <h2>Тема оформления</h2>
    <div class="card-block">
      <div class="theme-row" id="themeRow">
        <button class="theme-btn" data-theme="classic">Классика</button>
        <button class="theme-btn" data-theme="retro">Retro-Tech</button>
        <button class="theme-btn" data-theme="notebook">Notebook (Y2K)</button>
        <button class="theme-btn" data-theme="cyberpunk">Cyberpunk</button>
        <button class="theme-btn" data-theme="cozy">Cozy (pixel)</button>
      </div>
    </div>
  </div>

  <div class="section-admin">
    <h2>Все ссылки</h2>
    <div class="card-block" style="padding:0;" id="linksBox"></div>
  </div>
</div>

<script>
const LS_KEY = 'mgsu_admin_token';
let token = localStorage.getItem(LS_KEY) || '';
let refreshTimer = null;

if (!token) location.href = '/admin/login';

const logoutBtn = document.getElementById('logoutBtn');

async function api(path, opts = {}){
  const headers = Object.assign({'Content-Type':'application/json'}, opts.headers || {});
  if (token) headers['Authorization'] = 'Bearer ' + token;
  const res = await fetch(path, Object.assign({}, opts, {headers}));
  if (res.status === 401){
    localStorage.removeItem(LS_KEY);
    location.href = '/admin/login';
    throw new Error('unauthorized');
  }
  return res.json();
}

logoutBtn.addEventListener('click', async () => {
  try{ await api('/admin/api/logout', {method:'POST'}); }catch(e){}
  localStorage.removeItem(LS_KEY);
  location.href = '/admin/login';
});

function fmtUptime(sec){
  if (!sec && sec !== 0) return '—';
  const d = Math.floor(sec / 86400);
  const h = Math.floor((sec % 86400) / 3600);
  const m = Math.floor((sec % 3600) / 60);
  if (d > 0) return d + 'д ' + h + 'ч';
  if (h > 0) return h + 'ч ' + m + 'м';
  return m + 'м';
}

async function refreshAll(){
  try{
    const s = await api('/admin/api/stats');
    document.getElementById('uptimeLabel').textContent = 'Сервер работает: ' + fmtUptime(s.uptime_sec);
    renderHealth(s.health);
    renderMetrics(s.metrics || []);
    renderClickerTop(s.clicker_top || []);
    const g = await api('/admin/api/games');
    renderGames(g.games);
    renderTheme(g.theme);
    renderLinks();
  }catch(e){}
}

function renderHealth(h){
  const banner = document.getElementById('healthBanner');
  banner.className = 'health-banner ' + (h.status || 'neutral');
  document.getElementById('healthLabel').textContent = h.label || '';
  document.getElementById('healthText').textContent = h.text || '';
}

function renderMetrics(metrics){
  const grid = document.getElementById('metricsGrid');
  grid.innerHTML = '';
  metrics.forEach(m => {
    const el = document.createElement('div');
    el.className = 'metric-card ' + (m.status || 'neutral');
    const valueClass = String(m.value).length > 12 ? 'metric-value small' : 'metric-value';
    el.innerHTML =
      '<div class="metric-head">' +
        '<div class="metric-dot"></div>' +
        '<div class="metric-title">' + escapeHtml(m.title) + '</div>' +
      '</div>' +
      '<div class="' + valueClass + '">' + escapeHtml(String(m.value)) + '</div>' +
      '<div class="metric-verdict">' + escapeHtml(m.verdict || '') + '</div>' +
      '<div class="metric-hint">' + escapeHtml(m.hint || '') + '</div>';
    grid.appendChild(el);
  });
}

function renderClickerTop(top){
  const box = document.getElementById('clickerTopBox');
  if (!top.length){ box.innerHTML = '<div style="color:rgba(255,255,255,0.4);font-size:14px;">Пока никого</div>'; return; }
  box.innerHTML = '';
  top.forEach((e, i) => {
    const row = document.createElement('div');
    row.className = 'link-row';
    row.innerHTML = '<span>#' + (i+1) + ' <b>' + escapeHtml(e.nick) + '</b></span><span>' + e.score + ' — ' + escapeHtml(e.rank) + '</span>';
    box.appendChild(row);
  });
}

function renderGames(games){
  const box = document.getElementById('gamesBox');
  box.innerHTML = '';
  games.forEach(g => {
    const row = document.createElement('div');
    row.className = 'game-row';
    row.innerHTML = '<span class="name">' + escapeHtml(g.title) + ' <span style="color:rgba(255,255,255,0.4);font-size:12px;">(' + g.key + ')</span></span>';
    const sw = document.createElement('div');
    sw.className = 'switch' + (g.enabled ? ' on' : '');
    sw.onclick = async () => {
      const newVal = !sw.classList.contains('on');
      sw.classList.toggle('on', newVal);
      try{ await api('/admin/api/games', {method:'POST', body: JSON.stringify({key: g.key, enabled: newVal})}); }catch(e){}
    };
    row.appendChild(sw);
    box.appendChild(row);
  });
}

function renderTheme(theme){
  document.querySelectorAll('.theme-btn').forEach(b => {
    if (b.dataset.theme === theme) b.classList.add('active');
    else b.classList.remove('active');
  });
}

document.querySelectorAll('.theme-btn').forEach(b => {
  b.addEventListener('click', async () => {
    if (b.classList.contains('disabled')) return;
    const theme = b.dataset.theme;
    try{ await api('/admin/api/theme', {method:'POST', body: JSON.stringify({theme})}); renderTheme(theme); }catch(e){}
  });
});

function renderLinks(){
  const host = location.origin;
  const links = [
    {label:'Главная', url: host + '/glavnaya'},
    {label:'Стена', url: host + '/games/wall'},
    {label:'Кликер', url: host + '/games/clicker'},
    {label:'Бродвей', url: host + '/games/broadway'},
    {label:'Кампус', url: host + '/games/campus'},
    {label:'Грабли', url: host + '/games/grable'},
    {label:'Экран (киоск)', url: host + '/games/ekran'},
    {label:'О проекте', url: host + '/privacy'},
    {label:'GitHub', url: 'https://github.com/dcaruk01-a11y/mgsu-wall'},
    {label:'Render', url: 'https://dashboard.render.com/web/srv-dani0ajtqb8s73c05vug'},
    {label:'Telegram-канал', url: 'https://t.me/mgsu_wall_archive'},
    {label:'Feedback-бот', url: 'https://t.me/mgsu_feedback_bot'},
  ];
  const box = document.getElementById('linksBox');
  box.innerHTML = '';
  links.forEach(l => {
    const row = document.createElement('div');
    row.className = 'link-row';
    row.innerHTML = '<span>' + l.label + '</span><a href="' + l.url + '" target="_blank" rel="noopener">открыть →</a>';
    box.appendChild(row);
  });
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
/* ============ РАСПИСАНИЕ ============ */
let currentOverride = null;

async function loadSchedule(){
  try{
    const res = await api('/admin/api/schedule');
    const s = res.schedule;
    document.getElementById('openHour').value = s.open_hour;
    document.getElementById('openMinute').value = s.open_minute;
    document.getElementById('closeHour').value = s.close_hour;
    document.getElementById('closeMinute').value = s.close_minute;
    currentOverride = s.force_override;
    renderOverrideButtons();
    renderScheduleStatus(res);
  }catch(e){}
}

function renderScheduleStatus(res){
  const el = document.getElementById('scheduleStatus');
  const txt = document.getElementById('scheduleStatusText');
  const cur = document.getElementById('scheduleCurrentTime');
  const s = res.schedule;

  if (res.is_open_now){
    el.classList.add('open');
    el.classList.remove('closed');
    txt.textContent = 'Игры доступны';
  } else {
    el.classList.add('closed');
    el.classList.remove('open');
    txt.textContent = 'Технический перерыв';
  }

  let mode = '';
  if (s.force_override === true) mode = ' · принудительно открыто';
  else if (s.force_override === false) mode = ' · принудительно закрыто';
  else mode = ' · по расписанию';

  cur.textContent = 'Сейчас: ' + new Date().toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'}) + mode;
}

function renderOverrideButtons(){
  document.querySelectorAll('.override-btn').forEach(b => {
    b.classList.remove('active', 'open-active', 'closed-active');
    const v = b.dataset.override;
    if (v === 'auto' && currentOverride === null){
      b.classList.add('active');
    } else if (v === 'open' && currentOverride === true){
      b.classList.add('active', 'open-active');
    } else if (v === 'close' && currentOverride === false){
      b.classList.add('active', 'closed-active');
    }
  });
}

document.querySelectorAll('.override-btn').forEach(b => {
  b.addEventListener('click', async () => {
    const v = b.dataset.override;
    const val = v === 'auto' ? null : (v === 'open');
    try{
      const res = await api('/admin/api/schedule', {
        method:'POST',
        body: JSON.stringify({force_override: val})
      });
      currentOverride = res.schedule.force_override;
      renderOverrideButtons();
      renderScheduleStatus(res);
    }catch(e){}
  });
});

document.getElementById('saveScheduleBtn').addEventListener('click', async () => {
  const body = {
    open_hour: parseInt(document.getElementById('openHour').value) || 0,
    open_minute: parseInt(document.getElementById('openMinute').value) || 0,
    close_hour: parseInt(document.getElementById('closeHour').value) || 0,
    close_minute: parseInt(document.getElementById('closeMinute').value) || 0,
  };
  try{
    const res = await api('/admin/api/schedule', {
      method:'POST',
      body: JSON.stringify(body)
    });
    renderScheduleStatus(res);
    alert('Расписание сохранено');
  }catch(e){}
});

loadSchedule();

refreshAll();
refreshTimer = setInterval(refreshAll, 5000);
</script>

</body></html>
