<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Кликер · Игры МГСУ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="/static/style.css">
<style>
body.clicker-page{
  height:100vh;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  touch-action:manipulation;
  user-select:none;
  -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
}
.clicker-top{
  flex-shrink:0;
  padding:14px 0;
}
.clicker-stage{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  position:relative;
  overflow:hidden;
  padding:20px;
}
.rank-badge{
  font-size:13px;
  font-weight:700;
  letter-spacing:0.16em;
  text-transform:uppercase;
  color:rgba(255,255,255,0.7);
  padding:8px 20px;
  border:1px solid rgba(255,255,255,0.18);
  border-radius:999px;
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(10px);
  margin-bottom:24px;
  transition:all .2s;
}
.rank-badge.up{
  background:rgba(255,255,255,0.15);
  border-color:rgba(255,255,255,0.5);
  transform:scale(1.08);
  color:#fff;
}
.click-btn{
  width:220px;
  height:220px;
  border-radius:50%;
  border:3px solid rgba(255,255,255,0.25);
  background:
    radial-gradient(circle at 35% 30%, rgba(255,255,255,0.25) 0%, transparent 60%),
    radial-gradient(circle at 50% 50%, #1a4d8f 0%, #0F3C73 60%, #0a1f3d 100%);
  box-shadow:
    0 20px 60px rgba(15,60,115,0.5),
    inset 0 -8px 24px rgba(0,0,0,0.35);
  font-size:96px;
  line-height:1;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:transform .08s ease-out, box-shadow .15s;
  padding:0;
  color:#fff;
  position:relative;
}
.click-btn:active{
  transform:scale(0.94);
  box-shadow:
    0 8px 30px rgba(15,60,115,0.6),
    inset 0 -4px 16px rgba(0,0,0,0.4);
}
.click-btn.pop{
  animation:pop .18s ease-out;
}
@keyframes pop{
  0%{transform:scale(0.94);}
  50%{transform:scale(1.04);}
  100%{transform:scale(1);}
}
.click-btn::after{
  content:'';
  position:absolute;
  inset:-14px;
  border-radius:50%;
  border:1px dashed rgba(255,255,255,0.12);
  animation:spin 12s linear infinite;
  pointer-events:none;
}
@keyframes spin{
  to{transform:rotate(360deg);}
}

.timer-wrap{
  margin-top:36px;
  display:flex;
  align-items:center;
  gap:14px;
  font-size:15px;
  color:rgba(255,255,255,0.7);
}
.timer-num{
  font-size:28px;
  font-weight:800;
  color:#fff;
  letter-spacing:-0.02em;
  min-width:52px;
  text-align:center;
  font-variant-numeric:tabular-nums;
}
.timer-num.low{
  color:#FF4D5E;
  animation:pulse .5s ease-in-out infinite alternate;
}
@keyframes pulse{
  from{opacity:1;}
  to{opacity:0.5;}
}

/* стартовый оверлей */
.start-overlay{
  position:absolute;
  inset:0;
  background:rgba(5,14,31,0.85);
  backdrop-filter:blur(8px);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:24px;
  padding:32px;
  text-align:center;
  z-index:10;
  transition:opacity .3s;
}
.start-overlay.hide{
  opacity:0;
  pointer-events:none;
}
.start-title{
  font-size:32px;
  font-weight:800;
  color:#fff;
  letter-spacing:-0.02em;
  line-height:1.15;
}
.start-sub{
  font-size:15px;
  color:rgba(255,255,255,0.7);
  max-width:340px;
  line-height:1.6;
}
.btn-big{
  display:inline-flex;
  align-items:center;
  gap:12px;
  padding:18px 40px;
  border-radius:999px;
  background:#fff;
  color:var(--blue);
  font-family:inherit;
  font-size:17px;
  font-weight:700;
  text-decoration:none;
  border:0;
  cursor:pointer;
  transition:transform .15s,box-shadow .15s;
  box-shadow:0 12px 30px rgba(0,0,0,0.3);
}
.btn-big:hover{
  transform:translateY(-2px);
  box-shadow:0 16px 36px rgba(0,0,0,0.35);
}
.btn-big:active{transform:translateY(0) scale(0.98);}
.btn-ghost{
  background:rgba(255,255,255,0.08);
  color:#fff;
  border:1px solid rgba(255,255,255,0.2);
  box-shadow:none;
}
.btn-ghost:hover{
  background:rgba(255,255,255,0.14);
  box-shadow:none;
}

/* финальный экран */
.finish-emoji{
  font-size:120px;
  line-height:1;
  margin-bottom:8px;
  filter:drop-shadow(0 12px 40px rgba(255,255,255,0.15));
}
.finish-rank{
  font-size:38px;
  font-weight:800;
  color:#fff;
  letter-spacing:-0.02em;
  margin-bottom:8px;
}
.finish-desc{
  font-size:15px;
  color:rgba(255,255,255,0.65);
  margin-bottom:28px;
  max-width:340px;
  line-height:1.6;
}
.finish-score{
  font-size:64px;
  font-weight:900;
  color:#fff;
  letter-spacing:-0.04em;
  margin-bottom:6px;
  font-variant-numeric:tabular-nums;
}
.finish-label{
  font-size:12px;
  font-weight:700;
  letter-spacing:0.18em;
  text-transform:uppercase;
  color:rgba(255,255,255,0.5);
  margin-bottom:36px;
}
.finish-actions{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  justify-content:center;
}

.toast{
  position:fixed;
  bottom:30px;
  left:50%;
  transform:translateX(-50%) translateY(60px);
  background:#fff;
  color:var(--blue);
  padding:12px 24px;
  border-radius:999px;
  font-size:14px;
  font-weight:600;
  box-shadow:0 12px 32px rgba(0,0,0,0.3);
  z-index:100;
  opacity:0;
  transition:all .3s;
  pointer-events:none;
}
.toast.show{
  transform:translateX(-50%) translateY(0);
  opacity:1;
}

@media(max-width:640px){
  .click-btn{width:170px;height:170px;font-size:76px;}
  .start-title{font-size:26px;}
  .finish-emoji{font-size:90px;}
  .finish-rank{font-size:30px;}
  .finish-score{font-size:52px;}
  .timer-num{font-size:24px;}
}
</style>
</head><body class="clicker-page">

<div class="clicker-top">
  <div class="wrap">
    <div class="head">
      <a class="brand" href="/games">
        <img src="/assets/Logo/logo.svg" alt="Лого" class="brand-logo">
        <span class="brand-label"><b>НИУ МГСУ</b> · Игры</span>
      </a>
      <nav>
        <a href="/games">Игры</a>
        <a href="/privacy">О проекте</a>
      </nav>
    </div>
  </div>
</div>

<div class="clicker-stage">

  <div class="rank-badge" id="rankBadge">Студент</div>

  <button class="click-btn" id="clickBtn" type="button">🎓</button>

  <div class="timer-wrap">
    <span>Осталось:</span>
    <span class="timer-num" id="timer">30</span>
    <span>сек</span>
  </div>

  <!-- стартовый оверлей -->
  <div class="start-overlay" id="startOverlay">
    <div class="start-title">Кликер МГСУ</div>
    <div class="start-sub">
      За 30 секунд накликай как можно больше.<br>
      Стартуешь студентом — закончишь легендой.
    </div>
    <button class="btn-big" id="startBtn" type="button">Начать →</button>
  </div>

  <!-- финальный оверлей -->
  <div class="start-overlay hide" id="finishOverlay">
    <div class="finish-emoji" id="finishEmoji">🎓</div>
    <div class="finish-rank" id="finishRank">Студент</div>
    <div class="finish-desc" id="finishDesc">Ты только начал путь. Попробуй ещё!</div>
    <div class="finish-score" id="finishScore">0</div>
    <div class="finish-label">кликов за 30 секунд</div>
    <div class="finish-actions">
      <button class="btn-big" id="shareBtn" type="button">Показать другу</button>
      <button class="btn-big btn-ghost" id="againBtn" type="button">Ещё раз</button>
    </div>
  </div>

</div>

<div class="toast" id="toast">Скопировано в буфер</div>

<script>
/* ============ РАНГИ ============ */
const RANKS = [
  {max:30,   name:'Студент',      emoji:'🎓', desc:'Ты только начал путь. Попробуй ещё!'},
  {max:70,   name:'ССОшник',      emoji:'👷', desc:'Уже в отряде. Ещё немного — и станешь прорабом.'},
  {max:130,  name:'Прораб',       emoji:'📋', desc:'На объекте тебя знают. Растёшь на глазах.'},
  {max:200,  name:'Строитель',    emoji:'🏗️', desc:'Руки в деле. Дом сам себя не построит.'},
  {max:300,  name:'Генподрядчик', emoji:'🏢', desc:'Уже целой стройкой управляешь. Уважение.'},
  {max:450,  name:'Застройщик',   emoji:'🏙️', desc:'Целый район под тобой. Следующая цель — легенда.'},
  {max:Infinity, name:'Легенда МГСУ', emoji:'👑', desc:'Всё, ты в истории университета. Сохрани скриншот!'}
];

function rankFor(score){
  for (const r of RANKS) if (score <= r.max) return r;
  return RANKS[RANKS.length - 1];
}

/* ============ ЭЛЕМЕНТЫ ============ */
const badge      = document.getElementById('rankBadge');
const btn        = document.getElementById('clickBtn');
const timerEl    = document.getElementById('timer');
const startOv    = document.getElementById('startOverlay');
const finishOv   = document.getElementById('finishOverlay');
const startBtn   = document.getElementById('startBtn');
const againBtn   = document.getElementById('againBtn');
const shareBtn   = document.getElementById('shareBtn');
const finishEmoji= document.getElementById('finishEmoji');
const finishRank = document.getElementById('finishRank');
const finishDesc = document.getElementById('finishDesc');
const finishScore= document.getElementById('finishScore');
const toast      = document.getElementById('toast');

/* ============ СОСТОЯНИЕ ============ */
const DURATION = 30;
let score = 0;
let timeLeft = DURATION;
let running = false;
let timerId = null;

function updateRank(){
  const r = rankFor(score);
  if (badge.textContent !== r.name){
    badge.textContent = r.name;
    badge.classList.add('up');
    setTimeout(() => badge.classList.remove('up'), 250);
  }
  btn.textContent = r.emoji;
}

function tick(){
  timeLeft -= 1;
  timerEl.textContent = timeLeft;
  if (timeLeft <= 5) timerEl.classList.add('low');
  if (timeLeft <= 0) stopGame();
}

function startGame(){
  score = 0;
  timeLeft = DURATION;
  running = true;
  timerEl.textContent = timeLeft;
  timerEl.classList.remove('low');
  badge.textContent = 'Студент';
  btn.textContent = '🎓';
  startOv.classList.add('hide');
  finishOv.classList.add('hide');
  timerId = setInterval(tick, 1000);
}

function stopGame(){
  running = false;
  clearInterval(timerId);
  const r = rankFor(score);
  finishEmoji.textContent = r.emoji;
  finishRank.textContent = r.name;
  finishDesc.textContent = r.desc;
  finishScore.textContent = score;
  finishOv.classList.remove('hide');
  saveScore(r.name, score);
}

function showToast(text){
  toast.textContent = text;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 1800);
}

/* ============ ВВОД ============ */
function handleClick(e){
  e.preventDefault();
  if (!running) return;
  score += 1;
  updateRank();
  btn.classList.add('pop');
  setTimeout(() => btn.classList.remove('pop'), 180);
}

btn.addEventListener('pointerdown', handleClick);
startBtn.addEventListener('click', startGame);
againBtn.addEventListener('click', startGame);

shareBtn.addEventListener('click', async () => {
  const r = rankFor(score);
  const text = `Я ${r.name} ${r.emoji} — ${score} кликов за 30 секунд в «Кликере МГСУ». А ты?`;
  try{
    if (navigator.share){
      await navigator.share({text});
    } else {
      await navigator.clipboard.writeText(text);
      showToast('Скопировано! Отправь другу');
    }
  }catch(err){
    try{
      await navigator.clipboard.writeText(text);
      showToast('Скопировано! Отправь другу');
    }catch(e2){
      showToast(text);
    }
  }
});

/* ============ ОТПРАВКА РЕЗУЛЬТАТА (опционально) ============ */
function saveScore(rank, sc){
  try{
    fetch('/clicker/score', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({rank, score: sc})
    }).catch(() => {});
  }catch(e){}
}

/* не даём странице скроллиться при кликах */
document.addEventListener('touchmove', e => {
  if (running) e.preventDefault();
}, {passive:false});
</script>

</body></html>
