<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Дизайн · Админка МГСУ</title>
<link rel="stylesheet" href="/static/admin.css">
<style>
.page-header{margin-bottom:28px;}
.page-title{font-size:28px;font-weight:800;color:#fff;margin:0 0 6px;}
.page-sub{font-size:14px;color:rgba(255,255,255,0.55);}

.theme-group-title{
  font-size:12px;font-weight:800;letter-spacing:0.14em;
  text-transform:uppercase;color:rgba(255,255,255,0.5);
  margin:24px 0 14px;
}
.theme-group-title:first-child{margin-top:0;}

.theme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;}
.theme-card{
  padding:20px;border-radius:14px;
  background:rgba(255,255,255,0.045);border:1px solid rgba(255,255,255,0.10);
  cursor:pointer;transition:all .15s;position:relative;
}
.theme-card:hover{background:rgba(255,255,255,0.08);}
.theme-card.active{border-color:#fff;background:rgba(255,255,255,0.12);box-shadow:0 0 0 1px rgba(255,255,255,0.3);}
.theme-card-name{font-size:15px;font-weight:800;color:#fff;margin-bottom:8px;}
.theme-card-desc{font-size:12px;color:rgba(255,255,255,0.55);line-height:1.5;}
.theme-preview{
  width:100%;height:60px;border-radius:10px;margin-bottom:12px;
  border:1px solid rgba(255,255,255,0.1);overflow:hidden;
  display:flex;
}
.theme-preview span{flex:1;height:100%;}

.theme-card.active::after{
  content:'✓ Активна';
  position:absolute;top:12px;right:12px;
  font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;
  background:#4ADE80;color:#0a1f0f;padding:4px 10px;border-radius:999px;
}

.theme-badge{
  display:inline-block;
  font-size:9px;font-weight:900;letter-spacing:0.1em;text-transform:uppercase;
  padding:3px 8px;border-radius:999px;
  margin-left:6px;
}
.theme-badge.base{background:rgba(111,168,255,0.2);color:#6FA8FF;border:1px solid rgba(111,168,255,0.4);}
.theme-badge.new{background:rgba(74,222,128,0.2);color:#4ADE80;border:1px solid rgba(74,222,128,0.4);}
</style>
</head><body class="admin-page">

<div class="admin-shell">
  <aside class="admin-sidebar" id="adminMenuContainer"></aside>
  <main class="admin-main">

    <div class="page-header">
      <h1 class="page-title">Дизайн</h1>
      <div class="page-sub">Тема оформления сайта — применится ко всем страницам</div>
    </div>

    <div class="theme-group-title">🏠 Базовые темы</div>
    <div class="theme-grid" id="themeGridBase">Загрузка…</div>

    <div class="theme-group-title">🎨 Стилизованные темы</div>
    <div class="theme-grid" id="themeGridStyled">Загрузка…</div>

  </main>
</div>

<script src="/static/admin-menu.js"></script>
<script>
const token = adminRequireToken();
renderAdminMenu('design');

const THEMES_BASE = [
  {
    key:'white',
    name:'⚪ Белая',
    desc:'Светлая база для тестирования. Чистая, минималистичная.',
    colors:['#f5f7fa','#ffffff','#0a0f1e','#ff7a2b'],
    badge:'base',
  },
  {
    key:'black',
    name:'⚫ Чёрная',
    desc:'Тёмная база. Хорошо для вечера и больших экранов.',
    colors:['#0a0a0a','#141414','#f5f7fa','#ff7a2b'],
    badge:'base',
  },
];

const THEMES_STYLED = [
  {
    key:'classic',
    name:'Классика',
    desc:'Синий + белый · основной стиль МГСУ',
    colors:['#0F3C73','#0a1f3d','#ffffff','#AC1422'],
  },
  {
    key:'retro',
    name:'Retro-Tech',
    desc:'Песочный + оранжевый · техничный',
    colors:['#EDE6D6','#FF6B2B','#1A1A1A','#B8AE96'],
  },
  {
    key:'notebook',
    name:'Notebook (Y2K)',
    desc:'Крем + фиолетовый · тетрадь',
    colors:['#F2ECD8','#B794F6','#FF8C42','#A8E6A1'],
  },
  {
    key:'cyberpunk',
    name:'Cyberpunk',
    desc:'Неон + тёмный · игровой интерфейс',
    colors:['#05070F','#B537F2','#00E5FF','#FFE600'],
  },
  {
    key:'cozy',
    name:'Cozy (pixel)',
    desc:'Тёплый коричневый · уютный вечер',
    colors:['#2A1B10','#D8763B','#F2E3C6','#6B8C4A'],
  },
];

let currentTheme = 'white';

async function loadTheme(){
  try{
    const g = await adminApi('/admin/api/games');
    currentTheme = g.theme || 'white';
    renderAll();
  }catch(e){
    document.getElementById('themeGridBase').innerHTML =
      '<div style="color:#FF4D5E;padding:20px;">Ошибка: ' + e.message + '</div>';
  }
}

function renderAll(){
  renderGrid('themeGridBase', THEMES_BASE);
  renderGrid('themeGridStyled', THEMES_STYLED);
}

function renderGrid(containerId, themes){
  const box = document.getElementById(containerId);
  box.innerHTML = '';
  themes.forEach(t => {
    const el = document.createElement('div');
    el.className = 'theme-card' + (t.key === currentTheme ? ' active' : '');
    let badgeHtml = '';
    if (t.badge === 'base') badgeHtml = '<span class="theme-badge base">Базовая</span>';
    if (t.badge === 'new') badgeHtml = '<span class="theme-badge new">Новая</span>';
    el.innerHTML =
      '<div class="theme-preview">' +
        t.colors.map(c => '<span style="background:' + c + '"></span>').join('') +
      '</div>' +
      '<div class="theme-card-name">' + t.name + badgeHtml + '</div>' +
      '<div class="theme-card-desc">' + t.desc + '</div>';
    el.onclick = () => setTheme(t.key);
    box.appendChild(el);
  });
}

async function setTheme(theme){
  try{
    await adminApi('/admin/api/theme', {method:'POST', body: JSON.stringify({theme})});
    currentTheme = theme;
    renderAll();
  }catch(e){
    alert('Ошибка: ' + e.message);
  }
}

loadTheme();
</script>

</body></html>
