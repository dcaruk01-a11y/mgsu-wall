<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Кликер · Игры МГСУ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="/static/style.css">
<style>
body.clicker-page{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  touch-action:manipulation;
  user-select:none;
  -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
}

.clicker-stage{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  position:relative;
  padding:20px 16px 60px;
  width:100%;
  box-sizing:border-box;
  min-height:0;
}

/* ===== ВЕРХНЯЯ ПАНЕЛЬ СО СЧЁТОМ ===== */
.score-bar{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:24px;
  margin-bottom:24px;
  flex-wrap:wrap;
}
.score-cell{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:2px;
  min-width:100px;
}
.score-label{
  font-size:10px;
  font-weight:700;
  letter-spacing:0.18em;
  text-transform:uppercase;
  color:rgba(255,255,255,0.45);
}
.score-val{
  font-size:42px;
  font-weight:900;
  color:#fff;
  letter-spacing:-0.03em;
  font-variant-numeric:tabular-nums;
  line-height:1;
}
.score-val.low{color:#FF4D5E;}

/* ===== РАНГ ===== */
.rank-badge{
  font-size:12px;
  font-weight:700;
  letter-spacing:0.16em;
  text-transform:uppercase;
  color:rgba(255,255,255,0.75);
  padding:8px 20px;
  border:1px solid rgba(255,255,255,0.18);
  border-radius:999px;
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  margin-bottom:22px;
  transition:all .25s;
}
.rank-badge.up{
  background:rgba(255,255,255,0.15);
  border-color:rgba(255,255,255,0.5);
  transform:scale(1.08);
  color:#fff;
}

/* ===== КНОПКА КЛИКА ===== */
.btn-wrap{
  position:relative;
  display:inline-flex;
  align-items:center;
  justify-content:center;
}
.click-btn{
  width:clamp(160px, 32vw, 230px);
  height:clamp(160px, 32vw, 230px);
  border-radius:50%;
  border:3px solid rgba(255,255,255,0.25);
  background:
    radial-gradient(circle at 35% 30%, rgba(255,255,255,0.25) 0%, transparent 60%),
    radial-gradient(circle at 50% 50%, #1a4d8f 0%, #0F3C73 60%, #0a1f3d 100%);
  box-shadow:
    0 20px 60px rgba(15,60,115,0.5),
    inset 0 -8px 24px rgba(0,0,0,0.35);
  font-size:clamp(64px, 13vw, 100px);
  line-height:1;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:transform .06s ease-out;
  padding:0;
  color:#fff;
  position:relative;
  touch-action:manipulation;
  will-change:transform;
}
.click-btn:active{
  transform:scale(0.93);
}
.click-btn.pop{
  animation:pop .16s ease-out;
}
@keyframes pop{
  0%{transform:scale(0.93);}
  45%{transform:scale(1.06);}
  100%{transform:scale(1);}
}
.click-btn::after{
  content:'';
  position:absolute;
  inset:-14px;
  border-radius:50%;
  border:1px dashed rgba(255,255,255,0.12);
  animation:spin 14s linear infinite;
  pointer-events:none;
}
@keyframes spin{ to{transform:rotate(360deg);} }

/* ===== ВСПЛЫВАЮЩИЕ ЧИСЛА (+1, +10, +50...) ===== */
.float-num{
  position:absolute;
  left:50%;
  top:0;
  transform:translate(-50%, -50%);
  font-size:32px;
  font-weight:900;
  color:#fff;
  pointer-events:none;
  text-shadow:0 2px 12px rgba(0,0,0,0.6);
  animation:floatUp 1s ease-out forwards;
  font-variant-numeric:tabular-nums;
  z-index:5;
}
.float-num.big{
  font-size:46px;
  color:#FFD84D;
  text-shadow:0 2px 20px rgba(255,216,77,0.5);
}
.float-num.mega{
  font-size:56px;
  color:#FF4D5E;
  text-shadow:0 2px 24px rgba(255,77,94,0.6);
}
@keyframes floatUp{
  0%{opacity:0; transform:translate(-50%, -30%) scale(0.6);}
  15%{opacity:1; transform:translate(-50%, -70%) scale(1.1);}
  100%{opacity:0; transform:translate(-50%, -180%) scale(1);}
}

/* ===== БОНУСЫ, ПАДАЮЩИЕ СВЕРХУ ===== */
.falling{
  position:fixed;
  top:-100px;
  font-size:64px;
  pointer-events:none;
  animation:fall 1.6s ease-in forwards;
  z-index:20;
  filter:drop-shadow(0 8px 24px rgba(0,0,0,0.4));
}
@keyframes fall{
  0%{top:-100px; opacity:0; transform:rotate(0deg) scale(0.6);}
  15%{opacity:1;}
  85%{opacity:1; transform:rotate(360deg) scale(1);}
  100%{top:100%; opacity:0; transform:rotate(540deg) scale(1);}
}

/* ===== СТАРТОВЫЙ ОВЕРЛЕЙ ===== */
.start-overlay{
  position:absolute;
  inset:0;
  background:rgba(5,14,31,0.88);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:20px;
  padding:32px 24px;
  text-align:center;
  z-index:10;
  transition:opacity .3s;
  overflow-y:auto;
}
.start-overlay.hide{
  opacity:0;
  pointer-events:none;
}
.start-title{
  font-size:clamp(24px, 6vw, 36px);
  font-weight:800;
  color:#fff;
  letter-spacing:-0.02em;
  line-height:1.15;
}
.start-sub{
  font-size:15px;
  color:rgba(255,255,255,0.7);
  max-width:360px;
  line-height:1.6;
}
.btn-big{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  padding:16px 36px;
  border-radius:999px;
  background:#fff;
  color:var(--blue);
  font-family:inherit;
  font-size:16px;
  font-weight:700;
  text-decoration:none;
  border:0;
  cursor:pointer;
  transition:transform .15s,box-shadow .15s;
  box-shadow:0 12px 30px rgba(0,0,0,0.3);
  min-width:220px;
}
.btn-big:hover{
  transform:translateY(-2px);
  box-shadow:0 16px 36px rgba(0,0,0,0.35);
}
.btn-big:active{transform:scale(0.98);}
.btn-ghost{
  background:rgba(255,255,255,0.08);
  color:#fff;
  border:1px solid rgba(255,255,255,0.2);
  box-shadow:none;
}
.btn-ghost:hover{
  background:rgba(255,255,255,0.14);
  box-shadow:none;
}

/* ===== ФИНАЛЬНЫЙ ЭКРАН ===== */
.finish-emoji{
  font-size:clamp(72px, 18vw, 110px);
  line-height:1;
  margin-bottom:8px;
  filter:drop-shadow(0 12px 40px rgba(255,255,255,0.15));
}
.finish-rank{
  font-size:clamp(26px, 7vw, 38px);
  font-weight:800;
  color:#fff;
  letter-spacing:-0.02em;
  margin-bottom:8px;
}
.finish-desc{
  font-size:15px;
  color:rgba(255,255,255,0.65);
  margin-bottom:24px;
  max-width:360px;
  line-height:1.6;
}
.finish-score{
  font-size:clamp(48px, 14vw, 76px);
  font-weight:900;
  color:#fff;
  letter-spacing:-0.04em;
  margin-bottom:4px;
  font-variant-numeric:tabular-nums;
  line-height:1;
}
.finish-label{
  font-size:11px;
  font-weight:700;
  letter-spacing:0.18em;
  text-transform:uppercase;
  color:rgba(255,255,255,0.5);
  margin-bottom:32px;
}
.finish-actions{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  justify-content:center;
  padding-bottom:20px;
}

/* ===== ТОСТ ===== */
.toast{
  position:fixed;
  bottom:30px;
  left:50%;
  transform:translateX(-50%) translateY(60px);
  background:#fff;
  color:var(--blue);
  padding:12px 24px;
  border-radius:999px;
  font-size:14px;
  font-weight:600;
  box-shadow:0 12px 32px rgba(0,0,0,0.3);
  z-index:100;
  opacity:0;
  transition:all .3s;
  pointer-events:none;
}
.toast.show{
  transform:translateX(-50%) translateY(0);
  opacity:1;
}

/* ===== МОБИЛЬНАЯ ВЕРСИЯ ===== */
@media(max-width:640px){
  .clicker-stage{padding:16px 12px 40px;}
  .score-bar{gap:16px;margin-bottom:18px;}
  .score-val{font-size:34px;}
  .score-cell{min-width:80px;}
  .rank-badge{margin-bottom:16px;font-size:11px;padding:7px 16px;}
  .finish-actions{flex-direction:column;width:100%;max-width:280px;}
  .btn-big{width:100%;}
}
</style>
</head><body class="clicker-page">

<div class="clicker-top">
  <div class="wrap">
    <div class="head">
      <a class="brand" href="/games">
        <img src="/assets/Logo/logo.svg" alt="Лого" class="brand-logo">
        <span class="brand-label"><b>НИУ МГСУ</b> · Игры</span>
      </a>
      <nav>
        <a href="/games">Игры</a>
        <a href="/privacy">О проекте</a>
      </nav>
    </div>
  </div>
</div>

<div class="clicker-stage">

  <div class="score-bar">
    <div class="score-cell">
      <span class="score-label">Клики</span>
      <span class="score-val" id="scoreVal">0</span>
    </div>
    <div class="score-cell">
      <span class="score-label">Время</span>
      <span class="score-val" id="timerVal">30</span>
    </div>
  </div>

  <div class="rank-badge" id="rankBadge">Студент</div>

  <div class="btn-wrap">
    <button class="click-btn" id="clickBtn" type="button">🎓</button>
    <div id="floatLayer"></div>
  </div>

  <!-- стартовый оверлей -->
  <div class="start-overlay" id="startOverlay">
    <div class="start-title">Кликер МГСУ</div>
    <div class="start-sub">
      За 30 секунд накликай как можно больше.<br>
      Каждые 10 кликов — бонус +10.<br>
      Лови падающие подарки: зачётку, кофе, стипендию, диплом.
    </div>
    <button class="btn-big" id="startBtn" type="button">Начать →</button>
  </div>

  <!-- финальный оверлей -->
  <div class="start-overlay hide" id="finishOverlay">
    <div class="finish-emoji" id="finishEmoji">🎓</div>
    <div class="finish-rank" id="finishRank">Студент</div>
    <div class="finish-desc" id="finishDesc">Ты только начал путь. Попробуй ещё!</div>
    <div class="finish-score" id="finishScore">0</div>
    <div class="finish-label">кликов за 30 секунд</div>
    <div class="finish-actions">
      <button class="btn-big" id="shareBtn" type="button">Показать другу</button>
      <button class="btn-big btn-ghost" id="againBtn" type="button">Ещё раз</button>
    </div>
  </div>

</div>

<div class="toast" id="toast">Скопировано!</div>

<script>
/* ============ РАНГИ ============ */
const RANKS = [
  {max:30,   name:'Студент',         emoji:'🎓', desc:'Ты только начал путь. Попробуй ещё!'},
  {max:70,   name:'ССОшник',         emoji:'👷', desc:'Уже в отряде. Ещё чуть-чуть — и станешь прорабом.'},
  {max:130,  name:'Прораб',          emoji:'📋', desc:'На объекте тебя знают. Растёшь на глазах.'},
  {max:200,  name:'Строитель',       emoji:'🏗️', desc:'Руки в деле. Дом сам себя не построит.'},
  {max:300,  name:'Генподрядчик',    emoji:'🏢', desc:'Уже целой стройкой управляешь. Уважение.'},
  {max:450,  name:'Застройщик',      emoji:'🏙️', desc:'Целый район под тобой. Следующая цель — легенда.'},
  {max:Infinity, name:'Легенда МГСУ', emoji:'👑', desc:'Всё, ты в истории университета. Сохрани скриншот!'}
];

/* ============ БОНУСЫ ============ */
const BONUSES = [
  {emoji:'📖', name:'Зачётка',  points:50,  weight:4},
  {emoji:'☕', name:'Кофе',      points:30,  weight:4},
  {emoji:'💰', name:'Стипендия', points:100, weight:2},
  {emoji:'📜', name:'Диплом',    points:250, weight:1}
];

function rankFor(score){
  for (const r of RANKS) if (score <= r.max) return r;
  return RANKS[RANKS.length - 1];
}

function pickBonus(){
  // взвешенный рандом
  const total = BONUSES.reduce((s, b) => s + b.weight, 0);
  let r = Math.random() * total;
  for (const b of BONUSES){
    r -= b.weight;
    if (r <= 0) return b;
  }
  return BONUSES[0];
}

/* ============ ЭЛЕМЕНТЫ ============ */
const badge       = document.getElementById('rankBadge');
const btn         = document.getElementById('clickBtn');
const scoreVal    = document.getElementById('scoreVal');
const timerVal    = document.getElementById('timerVal');
const startOv     = document.getElementById('startOverlay');
const finishOv    = document.getElementById('finishOverlay');
const startBtn    = document.getElementById('startBtn');
const againBtn    = document.getElementById('againBtn');
const shareBtn    = document.getElementById('shareBtn');
const finishEmoji = document.getElementById('finishEmoji');
const finishRank  = document.getElementById('finishRank');
const finishDesc  = document.getElementById('finishDesc');
const finishScore = document.getElementById('finishScore');
const toast       = document.getElementById('toast');
const floatLayer  = document.getElementById('floatLayer');

/* ============ СОСТОЯНИЕ ============ */
const DURATION = 30;
let score = 0;       // общий счёт (клики + бонусы)
let clicks = 0;      // только клики (для ранга)
let timeLeft = DURATION;
let running = false;
let timerId = null;
let scorePopTimer = null;

function updateRank(){
  const r = rankFor(clicks);
  if (badge.textContent !== r.name){
    badge.textContent = r.name;
    badge.classList.add('up');
    setTimeout(() => badge.classList.remove('up'), 280);
  }
  btn.textContent = r.emoji;
}

function bumpScore(){
  scoreVal.textContent = score;
  scoreVal.style.transform = 'scale(1.15)';
  clearTimeout(scorePopTimer);
  scorePopTimer = setTimeout(() => scoreVal.style.transform = 'scale(1)', 100);
}

function tick(){
  timeLeft -= 1;
  timerVal.textContent = timeLeft;
  if (timeLeft <= 5) timerVal.classList.add('low');
  if (timeLeft <= 0) stopGame();
}

function startGame(){
  score = 0;
  clicks = 0;
  timeLeft = DURATION;
  running = true;
  scoreVal.textContent = '0';
  timerVal.textContent = timeLeft;
  timerVal.classList.remove('low');
  badge.textContent = 'Студент';
  btn.textContent = '🎓';
  startOv.classList.add('hide');
  finishOv.classList.add('hide');
  timerId = setInterval(tick, 1000);
}

function stopGame(){
  running = false;
  clearInterval(timerId);
  const r = rankFor(clicks);
  finishEmoji.textContent = r.emoji;
  finishRank.textContent = r.name;
  finishDesc.textContent = r.desc;
  finishScore.textContent = score;
  finishOv.classList.remove('hide');
  saveScore(r.name, score);
}

function showToast(text){
  toast.textContent = text;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 1800);
}

/* ============ АНИМАЦИИ ============ */
function showFloatNum(text, cls){
  const el = document.createElement('div');
  el.className = 'float-num' + (cls ? ' ' + cls : '');
  el.textContent = text;
  // случайный сдвиг по X, чтобы числа не накладывались
  const offset = (Math.random() - 0.5) * 80;
  el.style.marginLeft = offset + 'px';
  floatLayer.appendChild(el);
  setTimeout(() => el.remove(), 1100);
}

function showFallingBonus(bonus){
  // выбираем случайную X-координату в пределах видимой части
  const x = Math.random() * (window.innerWidth - 100) + 20;
  const el = document.createElement('div');
  el.className = 'falling';
  el.textContent = bonus.emoji;
  el.style.left = x + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1700);
}

/* ============ ОБРАБОТКА КЛИКА ============ */
function handleClick(e){
  e.preventDefault();
  if (!running) return;

  clicks += 1;
  score += 1;

  // pop-эффект на кнопке
  btn.classList.remove('pop');
  void btn.offsetWidth;
  btn.classList.add('pop');

  // каждые 10 кликов — +10 бонус
  if (clicks % 10 === 0){
    score += 10;
    showFloatNum('+10', 'big');
  } else {
    showFloatNum('+1');
  }

  // каждые 100 кликов — гарантированный бонус
  if (clicks > 0 && clicks % 100 === 0){
    const bonus = pickBonus();
    score += bonus.points;
    showFallingBonus(bonus);
    setTimeout(() => {
      showFloatNum(bonus.emoji + ' +' + bonus.points, 'mega');
      bumpScore();
    }, 800);
  }
  // плюс случайный бонус с шансом ~4% каждый клик
  else if (Math.random() < 0.04){
    const bonus = pickBonus();
    score += bonus.points;
    showFallingBonus(bonus);
    setTimeout(() => {
      showFloatNum(bonus.emoji + ' +' + bonus.points, 'big');
    }, 700);
  }

  updateRank();
  bumpScore();
}

btn.addEventListener('pointerdown', handleClick);
startBtn.addEventListener('click', startGame);
againBtn.addEventListener('click', startGame);

shareBtn.addEventListener('click', async () => {
  const r = rankFor(clicks);
  const text = `Я ${r.name} ${r.emoji} — ${score} очков за 30 секунд в «Кликере МГСУ». А ты?`;
  try{
    if (navigator.share){
      await navigator.share({text});
    } else {
      await navigator.clipboard.writeText(text);
      showToast('Скопировано! Отправь другу');
    }
  }catch(err){
    try{
      await navigator.clipboard.writeText(text);
      showToast('Скопировано! Отправь другу');
    }catch(e2){
      showToast(text);
    }
  }
});

function saveScore(rank, sc){
  try{
    fetch('/clicker/score', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({rank, score: sc})
    }).catch(() => {});
  }catch(e){}
}
</script>

</body></html>
