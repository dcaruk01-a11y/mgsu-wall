<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Команда · Админка МГСУ</title>
<link rel="stylesheet" href="/static/admin.css">
<style>
.page-header{margin-bottom:28px;}
.page-title{font-size:28px;font-weight:800;color:#fff;margin:0 0 6px;}
.page-sub{font-size:14px;color:rgba(255,255,255,0.55);}

.dc-block{padding:22px;border-radius:14px;background:rgba(255,255,255,0.045);border:1px solid rgba(255,255,255,0.10);}
.dc-row{margin-bottom:14px;}
.dc-row label{display:block;font-size:11px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:rgba(255,255,255,0.5);margin-bottom:6px;}
.dc-input, .dc-textarea{
  width:100%;padding:10px 14px;border-radius:10px;
  background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);
  color:#fff;font-family:inherit;font-size:14px;outline:none;box-sizing:border-box;
}
.dc-textarea{min-height:60px;resize:vertical;}
.dc-input:focus,.dc-textarea:focus{border-color:rgba(255,255,255,0.5);}
.dc-card-item{
  padding:14px;border-radius:10px;background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.08);margin-bottom:10px;
  display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;align-items:center;
}
.dc-card-remove{
  width:32px;height:32px;border-radius:8px;
  background:rgba(255,77,94,0.15);border:1px solid rgba(255,77,94,0.4);
  color:#FF4D5E;font-weight:700;cursor:pointer;font-size:16px;
}
.dc-card-remove:hover{background:rgba(255,77,94,0.3);}
.dc-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;}
.dc-btn{padding:10px 18px;border-radius:10px;border:0;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;transition:transform .1s;}
.dc-btn:hover{transform:translateY(-1px);}
.dc-btn-primary{background:#fff;color:#0F3C73;}
.dc-btn-ghost{background:rgba(255,255,255,0.08);color:#fff;border:1px solid rgba(255,255,255,0.2);}
.dc-toggle{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
.dc-toggle .switch{flex-shrink:0;}
.dc-toggle span{font-size:14px;font-weight:600;}
.switch{position:relative;width:52px;height:30px;background:rgba(255,255,255,0.15);border-radius:999px;cursor:pointer;transition:background .15s;}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;}
.switch.on{background:#4ADE80;}
.switch.on::after{transform:translateX(22px);}
@media(max-width:720px){.dc-card-item{grid-template-columns:1fr;}}
</style>
</head><body class="admin-page">

<div class="admin-shell">
  <aside class="admin-sidebar" id="adminMenuContainer"></aside>
  <main class="admin-main">

    <div class="page-header">
      <h1 class="page-title">Команда</h1>
      <div class="page-sub">Блок «Актив разработчиков» на главной странице</div>
    </div>

    <div class="dc-block">
      <div class="dc-toggle">
        <div class="switch" id="dcEnabled"></div>
        <span>Показывать блок на главной странице</span>
      </div>

      <div class="dc-row">
        <label>Заголовок</label>
        <input type="text" class="dc-input" id="dcTitle" placeholder="Актив разработчиков">
      </div>

      <div class="dc-row">
        <label>Подзаголовок</label>
        <input type="text" class="dc-input" id="dcSubtitle" placeholder="Проект делает команда студентов">
      </div>

      <div class="dc-row">
        <label>Карточки (роль / имя / примечание)</label>
        <div id="dcCardsBox"></div>
        <button class="dc-btn dc-btn-ghost" id="dcAddCard" type="button" style="margin-top:6px;">+ Добавить карточку</button>
      </div>

      <div class="dc-row">
        <label>Подпись внизу</label>
        <textarea class="dc-textarea" id="dcFooter" placeholder="Хочешь в команду? Напиши нам."></textarea>
      </div>

      <div class="dc-actions">
        <button class="dc-btn dc-btn-primary" id="dcSave">Сохранить</button>
      </div>
    </div>

  </main>
</div>

<script src="/static/admin-menu.js"></script>
<script>
const token = adminRequireToken();
renderAdminMenu('team');

let dcEnabledState = true;

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function loadDevCredits(){
  try{
    const cfg = await adminApi('/admin/api/dev-credits');
    dcEnabledState = !!cfg.enabled;
    renderDevCredits(cfg);
  }catch(e){}
}

function renderDevCredits(cfg){
  document.getElementById('dcEnabled').className = 'switch' + (cfg.enabled ? ' on' : '');
  document.getElementById('dcTitle').value = cfg.title || '';
  document.getElementById('dcSubtitle').value = cfg.subtitle || '';
  document.getElementById('dcFooter').value = cfg.footer || '';
  renderDcCards(cfg.cards || []);
}

function renderDcCards(cards){
  const box = document.getElementById('dcCardsBox');
  box.innerHTML = '';
  cards.forEach(c => {
    const el = document.createElement('div');
    el.className = 'dc-card-item';
    el.innerHTML =
      '<input type="text" class="dc-input" placeholder="Роль" value="' + escapeHtml(c.role || '') + '">' +
      '<input type="text" class="dc-input" placeholder="Имя" value="' + escapeHtml(c.name || '') + '">' +
      '<input type="text" class="dc-input" placeholder="Примечание" value="' + escapeHtml(c.note || '') + '">' +
      '<button class="dc-card-remove" type="button" title="Удалить">✕</button>';
    el.querySelector('.dc-card-remove').onclick = () => el.remove();
    box.appendChild(el);
  });
}

document.getElementById('dcEnabled').onclick = () => {
  dcEnabledState = !dcEnabledState;
  document.getElementById('dcEnabled').className = 'switch' + (dcEnabledState ? ' on' : '');
};

document.getElementById('dcAddCard').onclick = () => {
  const box = document.getElementById('dcCardsBox');
  const el = document.createElement('div');
  el.className = 'dc-card-item';
  el.innerHTML =
    '<input type="text" class="dc-input" placeholder="Роль">' +
    '<input type="text" class="dc-input" placeholder="Имя">' +
    '<input type="text" class="dc-input" placeholder="Примечание">' +
    '<button class="dc-card-remove" type="button" title="Удалить">✕</button>';
  el.querySelector('.dc-card-remove').onclick = () => el.remove();
  box.appendChild(el);
};

document.getElementById('dcSave').onclick = async () => {
  const cards = [];
  document.querySelectorAll('#dcCardsBox .dc-card-item').forEach(el => {
    const inputs = el.querySelectorAll('input');
    const role = inputs[0].value.trim();
    const name = inputs[1].value.trim();
    const note = inputs[2].value.trim();
    if (name || role || note) cards.push({role, name, note});
  });
  const body = {
    enabled: dcEnabledState,
    title: document.getElementById('dcTitle').value.trim(),
    subtitle: document.getElementById('dcSubtitle').value.trim(),
    footer: document.getElementById('dcFooter').value.trim(),
    cards: cards,
  };
  try{
    await adminApi('/admin/api/dev-credits', {method:'POST', body: JSON.stringify(body)});
    alert('Сохранено');
  }catch(e){
    alert('Ошибка: ' + e.message);
  }
};

loadDevCredits();
</script>

</body></html>
