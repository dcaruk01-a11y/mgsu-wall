<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Пользователи · Админка МГСУ</title>
<link rel="stylesheet" href="/static/admin.css">
<style>
.page-header{margin-bottom:24px;display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:16px;}
.page-title{font-size:28px;font-weight:800;color:#fff;margin:0 0 6px;}
.page-sub{font-size:14px;color:rgba(255,255,255,0.55);}

.stats-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:24px;}
.stat-card{padding:16px 18px;border-radius:12px;background:rgba(255,255,255,0.045);border:1px solid rgba(255,255,255,0.10);}
.stat-label{font-size:11px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:rgba(255,255,255,0.5);margin-bottom:6px;}
.stat-value{font-size:24px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums;}

.search-bar{
  display:flex;gap:10px;margin-bottom:18px;
}
.search-bar input{
  flex:1;padding:12px 16px;border-radius:10px;
  background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);
  color:#fff;font-family:inherit;font-size:14px;outline:none;
}
.search-bar input:focus{border-color:rgba(255,255,255,0.5);}

.users-table{width:100%;border-collapse:collapse;font-size:13px;}
.users-table th{
  text-align:left;padding:12px;font-size:11px;font-weight:700;
  letter-spacing:0.1em;text-transform:uppercase;color:rgba(255,255,255,0.5);
  border-bottom:1px solid rgba(255,255,255,0.1);
}
.users-table td{padding:12px;border-bottom:1px solid rgba(255,255,255,0.05);vertical-align:middle;}
.users-table tr:last-child td{border-bottom:none;}
.users-table tr:hover td{background:rgba(255,255,255,0.03);}
.u-name{font-weight:700;color:#fff;}
.u-uid{font-family:monospace;font-size:11px;color:rgba(255,255,255,0.5);}
.u-num{font-variant-numeric:tabular-nums;font-weight:700;}
.u-char{font-size:18px;}
.u-date{font-size:12px;color:rgba(255,255,255,0.6);}

.u-actions{
  display:flex;
  gap:6px;
  justify-content:flex-end;
}
.u-btn{
  padding:6px 10px;
  border-radius:6px;
  border:0;
  font-family:inherit;
  font-size:11px;
  font-weight:800;
  cursor:pointer;
  transition:transform .1s, background .15s;
  white-space:nowrap;
  text-decoration:none;
  display:inline-flex;
  align-items:center;
}
.u-btn:hover{transform:translateY(-1px);}
.u-btn.manage{
  background:rgba(111,168,255,0.15);
  color:#6FA8FF;
  border:1px solid rgba(111,168,255,0.4);
}
.u-btn.manage:hover{background:rgba(111,168,255,0.25);}
.u-btn.feedback{
  background:rgba(255,180,80,0.15);
  color:#FFB347;
  border:1px solid rgba(255,180,80,0.4);
}
.u-btn.feedback:hover{background:rgba(255,180,80,0.25);}
.u-btn.feedback.pending{
  background:rgba(74,222,128,0.15);
  color:#4ADE80;
  border-color:rgba(74,222,128,0.4);
}
.u-btn.feedback.pending:hover{background:rgba(74,222,128,0.25);}
</style>
</head><body class="admin-page">

<div class="admin-shell">
  <aside class="admin-sidebar" id="adminMenuContainer"></aside>
  <main class="admin-main">

    <div class="page-header">
      <div>
        <h1 class="page-title">Пользователи</h1>
        <div class="page-sub">Кто зарегистрирован и когда заходил</div>
      </div>
    </div>

    <div class="stats-row" id="statsRow">Загрузка…</div>

    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Поиск по имени или UID…">
    </div>

    <div style="overflow-x:auto;">
      <table class="users-table">
        <thead>
          <tr>
            <th>Игрок</th>
            <th>Персонаж</th>
            <th>💰 Монеты</th>
            <th>🏆 Очки</th>
            <th>🔥 Серия</th>
            <th>🎮 Партий</th>
            <th>Был(а)</th>
            <th style="text-align:right;">Действия</th>
          </tr>
        </thead>
        <tbody id="usersBody"></tbody>
      </table>
    </div>

  </main>
</div>

<script src="/static/admin-menu.js"></script>
<script>
const token = adminRequireToken();
renderAdminMenu('users');

const CHAR_EMOJI = {
  student:'🎓', sso:'👷', prorab:'📋',
  builder:'🏗️', prof:'🧑‍🏫', dean:'🧑‍💼', legend:'👑',
};

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function fmtTime(ts){
  if (!ts) return '—';
  const sec = Math.floor(Date.now()/1000 - ts);
  if (sec < 60) return 'только что';
  if (sec < 3600) return Math.floor(sec/60) + ' мин назад';
  if (sec < 86400) return Math.floor(sec/3600) + ' ч назад';
  if (sec < 7*86400) return Math.floor(sec/86400) + ' дн назад';
  const d = new Date(ts*1000);
  return d.toLocaleDateString('ru-RU');
}

async function loadUsers(search){
  try{
    const url = '/admin/api/users' + (search ? ('?search=' + encodeURIComponent(search)) : '');
    const data = await adminApi(url);
    renderStats(data);
    renderUsers(data.users || []);
  }catch(e){
    document.getElementById('usersBody').innerHTML =
      '<tr><td colspan="8" style="text-align:center;padding:20px;color:#FF4D5E;">Ошибка: ' + escapeHtml(e.message) + '</td></tr>';
  }
}

function renderStats(d){
  const box = document.getElementById('statsRow');
  const cards = [
    {label:'Всего', value: d.total},
    {label:'Активны 24ч', value: d.active_24h},
    {label:'Активны 7д', value: d.active_7d},
  ];
  box.innerHTML = '';
  cards.forEach(c => {
    const el = document.createElement('div');
    el.className = 'stat-card';
    el.innerHTML = '<div class="stat-label">' + c.label + '</div><div class="stat-value">' + c.value + '</div>';
    box.appendChild(el);
  });
}

function renderUsers(users){
  const body = document.getElementById('usersBody');
  if (!users.length){
    body.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:20px;opacity:0.5;">Пока никого</td></tr>';
    return;
  }
  body.innerHTML = '';
  users.forEach(u => {
    const tr = document.createElement('tr');
    tr.innerHTML =
      '<td>' +
        '<div class="u-name">' + escapeHtml(u.display_name) + '</div>' +
        '<div class="u-uid">' + escapeHtml(u.uid) + '</div>' +
      '</td>' +
      '<td class="u-char">' + (CHAR_EMOJI[u.active_char] || '🎓') + '</td>' +
      '<td class="u-num">' + u.coins + '</td>' +
      '<td class="u-num">' + u.total_score + '</td>' +
      '<td class="u-num">' + u.streak + '</td>' +
      '<td class="u-num">' + u.games_played + '</td>' +
      '<td class="u-date">' + fmtTime(u.last_seen) + '</td>' +
      '<td><div class="u-actions">' +
        '<button class="u-btn feedback' + (u.feedback_pending ? ' pending' : '') + '" data-feedback-uid="' + escapeHtml(u.uid) + '">' +
          (u.feedback_pending ? '✓ Отзыв' : '💌 Отзыв') +
        '</button>' +
        '<a class="u-btn manage" href="/admin/player/' + encodeURIComponent(u.uid) + '">Управлять</a>' +
      '</div></td>';
    body.appendChild(tr);
  });
}

/* ═══════════════════════════════════════════════════════════
   Кнопка "Запросить отзыв" в списке
   ═══════════════════════════════════════════════════════════ */
document.addEventListener('click', async function(e){
  const btn = e.target.closest('[data-feedback-uid]');
  if (!btn) return;
  e.preventDefault();

  const uid = btn.dataset.feedbackUid;
  const isPending = btn.classList.contains('pending');

  if (isPending){
    if (!confirm('Отменить запрос отзыва для ' + uid + '?')) return;
    try{
      await adminApi('/admin/api/user/cancel-feedback', {
        method:'POST',
        body: JSON.stringify({uid})
      });
      loadUsers(document.getElementById('searchInput').value.trim());
    }catch(err){ alert('Ошибка: ' + err.message); }
  } else {
    if (!confirm('Запросить отзыв у ' + uid + '? Игрок увидит попап при следующем заходе.')) return;
    try{
      await adminApi('/admin/api/user/request-feedback', {
        method:'POST',
        body: JSON.stringify({uid})
      });
      loadUsers(document.getElementById('searchInput').value.trim());
    }catch(err){ alert('Ошибка: ' + err.message); }
  }
});

/* ═══════════════════════════════════════════════════════════
   Поиск + автообновление
   ═══════════════════════════════════════════════════════════ */
let searchTimer = null;
document.getElementById('searchInput').addEventListener('input', e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => loadUsers(e.target.value.trim()), 400);
});

loadUsers('');
setInterval(() => loadUsers(document.getElementById('searchInput').value.trim()), 30000);
</script>

</body></html>
