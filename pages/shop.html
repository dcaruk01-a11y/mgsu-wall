<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Магазин · Игры МГСУ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/static/site-header.css">
<style>
.shop-wrap{max-width:720px;margin:0 auto;padding:24px 16px 48px;}
.shop-head{text-align:center;padding:20px 0 20px;}
.shop-title{font-size:clamp(32px,6vw,52px);font-weight:800;letter-spacing:-0.03em;line-height:1;margin-bottom:12px;color:inherit;}
.shop-coins{
  display:inline-flex;align-items:center;gap:10px;
  padding:12px 22px;border-radius:999px;
  background:rgba(128,128,128,0.10);
  border:1px solid rgba(128,128,128,0.25);
  font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;
  color:inherit;
}
.shop-coins small{font-size:12px;font-weight:600;opacity:0.6;letter-spacing:0.1em;text-transform:uppercase;}

/* ═══ ТАБЫ ═══ */
.tabs-shop{
  display:flex;background:rgba(128,128,128,0.10);
  border-radius:999px;padding:4px;margin:8px 0 16px;
}
.shop-tab{
  flex:1;padding:10px;border:0;background:transparent;
  color:inherit;font-family:inherit;font-size:13px;font-weight:700;
  border-radius:999px;cursor:pointer;opacity:0.6;transition:all .15s;
}
.shop-tab.active{background:rgba(128,128,128,0.28);opacity:1;}

/* ═══ ПЕРСОНАЖИ ═══ */
.items{display:flex;flex-direction:column;gap:12px;}
.item{
  display:flex;align-items:center;gap:16px;
  padding:18px 20px;border-radius:16px;
  background:rgba(128,128,128,0.10);
  border:1px solid rgba(128,128,128,0.18);
  transition:background .2s, border-color .2s;
}
.item.owned{border-color:rgba(74,222,128,0.4);background:rgba(74,222,128,0.08);}
.item.active{border-color:rgba(128,128,128,0.6);background:rgba(128,128,128,0.22);}
.item.locked{opacity:0.75;}
.item-emoji{
  font-size:44px;line-height:1;flex-shrink:0;
  width:60px;height:60px;
  display:flex;align-items:center;justify-content:center;
  background:rgba(128,128,128,0.15);border-radius:14px;
}
.item-info{flex:1;min-width:0;}
.item-name{font-size:17px;font-weight:800;margin-bottom:4px;color:inherit;}
.item-desc{font-size:13px;opacity:0.7;line-height:1.4;}
.item-price{font-size:12px;font-weight:700;margin-top:6px;color:#FFD700;font-variant-numeric:tabular-nums;}
.item-price.no-money{color:#FF8B8B;}
.item-price.owned{color:#4ADE80;}
.item-actions{flex-shrink:0;}
.item-btn{
  padding:10px 18px;border-radius:10px;
  border:1px solid rgba(128,128,128,0.35);
  background:rgba(128,128,128,0.12);
  color:inherit;font-family:inherit;font-size:13px;font-weight:700;
  cursor:pointer;transition:all .15s;white-space:nowrap;
}
.item-btn:hover:not(:disabled){background:rgba(128,128,128,0.24);}
.item-btn.primary{background:rgba(128,128,128,0.25);}
.item-btn:disabled{cursor:not-allowed;opacity:0.75;filter:grayscale(0.3);}
.item-btn.equipped{background:rgba(74,222,128,0.15);color:#4ADE80;border-color:rgba(74,222,128,0.5);}
.item-btn.cant-afford{
  background:rgba(255,77,94,0.08);
  color:#FF8B8B;
  border-color:rgba(255,77,94,0.3);
  font-size:12px;
  cursor:not-allowed;
}

/* ═══ РАМКИ ═══ */
.frame-item{
  display:flex;align-items:center;gap:16px;
  padding:16px 18px;border-radius:16px;
  background:rgba(128,128,128,0.10);
  border:1px solid rgba(128,128,128,0.18);
  transition:background .15s, border-color .15s;
}
.frame-item.owned{border-color:rgba(74,222,128,0.4);background:rgba(74,222,128,0.06);}
.frame-item.active{border-color:#FFD700;background:rgba(255,215,0,0.08);}
.frame-preview{
  width:56px;height:56px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:24px;flex-shrink:0;
  background:rgba(128,128,128,0.20);
  padding:2px;
  box-sizing:border-box;
}
.frame-preview-inner{
  width:100%;height:100%;border-radius:50%;
  background:rgba(128,128,128,0.15);
  display:flex;align-items:center;justify-content:center;
}
.frame-info{flex:1;min-width:0;}
.frame-name{font-size:15px;font-weight:800;margin-bottom:4px;color:inherit;}
.frame-price{font-size:12px;font-weight:700;color:#FFD700;font-variant-numeric:tabular-nums;}
.frame-price.owned{color:#4ADE80;}
.frame-price.no-money{color:#FF8B8B;}

.remove-frame-btn{
  width:100%;margin-top:8px;
  padding:12px 18px;border-radius:12px;
  background:rgba(255,77,94,0.08);
  border:1px solid rgba(255,77,94,0.35);
  color:#FF8B8B;font-family:inherit;font-size:13px;font-weight:700;
  cursor:pointer;transition:all .15s;
}
.remove-frame-btn:hover{background:rgba(255,77,94,0.2);color:#fff;}

/* ═══ ГОСТЬ ═══ */
.guest-hint{
  padding:24px;border-radius:16px;
  background:rgba(128,128,128,0.10);
  border:1px dashed rgba(128,128,128,0.35);
  text-align:center;font-size:14px;line-height:1.6;margin-top:16px;
}
.guest-hint a{color:#4ADE80;font-weight:700;text-decoration:none;}
.guest-hint a:hover{text-decoration:underline;}

/* ═══ TOAST ═══ */
.toast{
  position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(60px);
  background:#fff;color:#0F3C73;padding:12px 24px;border-radius:999px;
  font-size:14px;font-weight:700;box-shadow:0 12px 32px rgba(0,0,0,0.3);
  z-index:100;opacity:0;transition:all .3s;pointer-events:none;
  max-width:90vw;
}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
.toast.err{background:#FF4D5E;color:#fff;}
</style>
</head><body>

<div id="siteHeader"></div>

<div class="shop-wrap">
  <div class="shop-head">
    <div class="shop-title">🛍 Магазин</div>
    <div class="shop-coins">💰 <span id="coinsValue">0</span><small>монет</small></div>
  </div>

  <div class="tabs-shop">
    <button class="shop-tab active" data-tab="chars" type="button">🎭 Персонажи</button>
    <button class="shop-tab" data-tab="frames" type="button">🖼 Рамки</button>
  </div>

  <div class="items" id="itemsBox">
    <div style="text-align:center;padding:40px;opacity:0.5;">Загрузка…</div>
  </div>

  <div class="items" id="framesBox" style="display:none;">
    <div style="text-align:center;padding:40px;opacity:0.5;">Загрузка…</div>
  </div>
</div>

<div id="siteFooter"></div>

<div class="toast" id="toast"></div>

<script src="/static/site-header.js"></script>
<script>
renderSiteHeader('shop');
renderSiteFooter();

const LS_TOKEN = 'mgsu_token';
const token = localStorage.getItem(LS_TOKEN) || '';
const toast = document.getElementById('toast');

function showToast(text, isError){
  toast.textContent = text;
  toast.className = 'toast show' + (isError ? ' err' : '');
  setTimeout(function(){ toast.className = 'toast'; }, 2200);
}

async function api(path, opts){
  opts = opts || {};
  const headers = Object.assign({'Content-Type':'application/json'}, opts.headers || {});
  if (token) headers['Authorization'] = 'Bearer ' + token;
  const res = await fetch(path, Object.assign({}, opts, {headers: headers}));
  return { status: res.status, data: await res.json() };
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

let currentCoins = 0;

/* ═══════════════════════════════════════════════════════════
   ПЕРСОНАЖИ
   ═══════════════════════════════════════════════════════════ */
async function loadShop(){
  try{
    const res = await api('/api/shop/catalog');
    const data = res.data;
    if (!data.logged_in){
      document.getElementById('itemsBox').innerHTML =
        '<div class="guest-hint">💡 Чтобы покупать персонажей, <a href="/auth">войди в аккаунт</a>.<br>Монеты копятся за игры и задания.</div>';
      document.getElementById('coinsValue').textContent = '0';
      return;
    }
    currentCoins = data.coins || 0;
    document.getElementById('coinsValue').textContent = currentCoins;
    renderItems(data.items || []);
  }catch(e){
    document.getElementById('itemsBox').innerHTML = '<div style="text-align:center;padding:40px;opacity:0.5;">Ошибка загрузки</div>';
  }
}

function renderItems(items){
  const box = document.getElementById('itemsBox');
  box.innerHTML = '';

  items.forEach(function(it){
    const el = document.createElement('div');
    let cls = 'item';
    if (it.active) cls += ' active';
    else if (it.owned) cls += ' owned';
    else if (!it.can_afford) cls += ' locked';
    el.className = cls;

    let priceHtml = '';
    if (it.key !== 'student'){
      if (it.owned){
        priceHtml = '<div class="item-price owned">✓ Уже куплен</div>';
      } else if (it.can_afford){
        priceHtml = '<div class="item-price">💰 ' + it.price + '</div>';
      } else {
        const need = it.price - currentCoins;
        priceHtml = '<div class="item-price no-money">💰 ' + it.price + ' · не хватает ' + need + '</div>';
      }
    }

    el.innerHTML =
      '<div class="item-emoji">' + it.emoji + '</div>' +
      '<div class="item-info">' +
        '<div class="item-name">' + escapeHtml(it.name) + '</div>' +
        '<div class="item-desc">' + escapeHtml(it.desc) + '</div>' +
        priceHtml +
      '</div>' +
      '<div class="item-actions"></div>';

    const actions = el.querySelector('.item-actions');
    const btn = document.createElement('button');

    if (it.active){
      btn.textContent = '✓ Активен';
      btn.className = 'item-btn equipped';
      btn.disabled = true;
    } else if (it.owned){
      btn.textContent = 'Выбрать';
      btn.className = 'item-btn primary';
      btn.onclick = function(){ equip(it.key); };
    } else if (!it.can_afford){
      btn.textContent = 'Не хватает 💰';
      btn.className = 'item-btn cant-afford';
      btn.disabled = true;
    } else {
      btn.textContent = 'Купить';
      btn.className = 'item-btn';
      btn.onclick = function(){ buy(it.key); };
    }

    actions.appendChild(btn);
    box.appendChild(el);
  });
}

async function buy(key){
  try{
    const res = await api('/api/shop/buy', {method:'POST', body: JSON.stringify({key: key})});
    if (res.status !== 200){
      showToast(res.data.detail || 'Ошибка', true);
      setTimeout(loadShop, 500);
      return;
    }
    try{ localStorage.setItem('mgsu_active_char', key); }catch(e){}
    showToast('Куплено! Персонаж активирован');
    loadShop();
  }catch(e){ showToast('Ошибка соединения', true); }
}

async function equip(key){
  try{
    const res = await api('/api/shop/equip', {method:'POST', body: JSON.stringify({key: key})});
    if (res.status !== 200){ showToast(res.data.detail || 'Ошибка', true); return; }
    try{ localStorage.setItem('mgsu_active_char', key); }catch(e){}
    showToast('Персонаж выбран');
    loadShop();
  }catch(e){ showToast('Ошибка соединения', true); }
}

/* ═══════════════════════════════════════════════════════════
   ТАБЫ
   ═══════════════════════════════════════════════════════════ */
document.querySelectorAll('.shop-tab').forEach(function(t){
  t.addEventListener('click', function(){
    document.querySelectorAll('.shop-tab').forEach(function(x){ x.classList.remove('active'); });
    t.classList.add('active');
    const isChars = t.dataset.tab === 'chars';
    document.getElementById('itemsBox').style.display = isChars ? '' : 'none';
    document.getElementById('framesBox').style.display = isChars ? 'none' : '';
    if (!isChars) loadFrames();
  });
});

/* ═══════════════════════════════════════════════════════════
   РАМКИ
   ═══════════════════════════════════════════════════════════ */
async function loadFrames(){
  const box = document.getElementById('framesBox');
  box.innerHTML = '<div style="text-align:center;padding:40px;opacity:0.5;">Загрузка…</div>';

  try{
    const r = await fetch('/api/frames/catalog', {
      headers: token ? {'Authorization': 'Bearer ' + token} : {}
    });
    const data = await r.json();

    if (!data.logged_in){
      box.innerHTML = '<div class="guest-hint">💡 Чтобы покупать рамки, <a href="/auth">войди в аккаунт</a>.</div>';
      return;
    }

    box.innerHTML = '';
    data.items.forEach(function(f){
      const el = document.createElement('div');
      let cls = 'frame-item';
      if (f.active) cls += ' active';
      else if (f.owned) cls += ' owned';
      el.className = cls;

      let frameBg = f.color === 'rainbow'
        ? 'conic-gradient(from 0deg,#ff0000,#ffff00,#00ff00,#00ffff,#0000ff,#ff00ff,#ff0000)'
        : f.color;

      let priceHtml = '';
      if (f.owned){
        priceHtml = '<div class="frame-price owned">✓ Куплена</div>';
      } else if (f.can_afford){
        priceHtml = '<div class="frame-price">💰 ' + f.price + '</div>';
      } else {
        const need = f.price - data.coins;
        priceHtml = '<div class="frame-price no-money">💰 ' + f.price + ' · не хватает ' + need + '</div>';
      }

      el.innerHTML =
        '<div class="frame-preview" style="background:' + frameBg + ';">' +
          '<div class="frame-preview-inner">🎓</div>' +
        '</div>' +
        '<div class="frame-info">' +
          '<div class="frame-name">' + f.emoji + ' ' + escapeHtml(f.name) + '</div>' +
          priceHtml +
        '</div>' +
        '<div class="item-actions"></div>';

      const actions = el.querySelector('.item-actions');
      const btn = document.createElement('button');

      if (f.active){
        btn.textContent = '✓ Активна';
        btn.className = 'item-btn equipped';
        btn.disabled = true;
      } else if (f.owned){
        btn.textContent = 'Надеть';
        btn.className = 'item-btn primary';
        btn.onclick = function(){ equipFrame(f.key); };
      } else if (!f.can_afford){
        btn.textContent = 'Не хватает';
        btn.className = 'item-btn cant-afford';
        btn.disabled = true;
      } else {
        btn.textContent = 'Купить';
        btn.className = 'item-btn';
        btn.onclick = function(){ buyFrame(f.key); };
      }

      actions.appendChild(btn);
      box.appendChild(el);
    });

    if (data.active_frame){
      const offBtn = document.createElement('button');
      offBtn.className = 'remove-frame-btn';
      offBtn.type = 'button';
      offBtn.textContent = '❌ Снять рамку';
      offBtn.onclick = function(){ equipFrame(''); };
      box.appendChild(offBtn);
    }
  }catch(e){
    box.innerHTML = '<div style="text-align:center;padding:40px;opacity:0.5;">Ошибка загрузки</div>';
  }
}

async function buyFrame(key){
  try{
    const r = await fetch('/api/frames/buy', {
      method:'POST',
      headers: {'Content-Type':'application/json', 'Authorization':'Bearer ' + token},
      body: JSON.stringify({key: key})
    });
    const data = await r.json();
    if (!r.ok){ showToast(data.detail || 'Ошибка', true); return; }
    try{ localStorage.setItem('mgsu_active_frame', key); }catch(e){}
    showToast('Рамка куплена!');
    loadFrames();
    loadShop();
  }catch(e){ showToast('Ошибка', true); }
}

async function equipFrame(key){
  try{
    const r = await fetch('/api/frames/equip', {
      method:'POST',
      headers: {'Content-Type':'application/json', 'Authorization':'Bearer ' + token},
      body: JSON.stringify({key: key})
    });
    const data = await r.json();
    if (!r.ok){ showToast(data.detail || 'Ошибка', true); return; }
    try{
      if (key) localStorage.setItem('mgsu_active_frame', key);
      else localStorage.removeItem('mgsu_active_frame');
    }catch(e){}
    showToast(key ? 'Рамка надета' : 'Рамка снята');
    loadFrames();
  }catch(e){ showToast('Ошибка', true); }
}

loadShop();
</script>

</body></html>
