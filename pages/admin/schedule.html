<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Расписание · Админка МГСУ</title>
<link rel="stylesheet" href="/static/admin.css">
<style>
.page-header{margin-bottom:28px;}
.page-title{font-size:28px;font-weight:800;color:#fff;margin:0 0 6px;}
.page-sub{font-size:14px;color:rgba(255,255,255,0.55);}

.schedule-block{padding:24px;background:rgba(255,255,255,0.045);border:1px solid rgba(255,255,255,0.10);border-radius:14px;display:flex;flex-direction:column;gap:18px;}
.schedule-status{display:flex;align-items:center;gap:12px;padding:14px 18px;border-radius:10px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);}
.schedule-status .dot{width:12px;height:12px;border-radius:50%;box-shadow:0 0 10px currentColor;}
.schedule-status.open .dot{background:#4ADE80;color:#4ADE80;}
.schedule-status.closed .dot{background:#FF4D5E;color:#FF4D5E;}
.schedule-status strong{font-size:14px;font-weight:800;color:#fff;}
.schedule-status span{font-size:13px;color:rgba(255,255,255,0.6);margin-left:auto;}
.schedule-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.schedule-input-group label{display:block;font-size:11px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:rgba(255,255,255,0.5);margin-bottom:8px;}
.schedule-input-group input{width:100%;padding:12px 14px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);border-radius:10px;color:#fff;font-family:inherit;font-size:15px;outline:none;box-sizing:border-box;}
.schedule-input-group input:focus{border-color:rgba(255,255,255,0.4);}
.override-row{display:flex;gap:10px;flex-wrap:wrap;}
.override-btn{flex:1;min-width:140px;padding:12px 18px;border-radius:10px;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.8);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;transition:all .15s;}
.override-btn:hover{background:rgba(255,255,255,0.10);color:#fff;}
.override-btn.active{background:#fff;color:#0F3C73;border-color:#fff;}
.override-btn.active.open-active{background:#4ADE80;color:#0a1f0f;border-color:#4ADE80;}
.override-btn.active.closed-active{background:#FF4D5E;color:#fff;border-color:#FF4D5E;}
.save-schedule-btn{padding:14px;border-radius:10px;border:0;background:#fff;color:#0F3C73;font-family:inherit;font-size:14px;font-weight:800;cursor:pointer;transition:transform .1s;}
.save-schedule-btn:hover{transform:translateY(-1px);}
</style>
</head><body class="admin-page">

<div class="admin-shell">
  <aside class="admin-sidebar" id="adminMenuContainer"></aside>
  <main class="admin-main">

    <div class="page-header">
      <h1 class="page-title">Расписание</h1>
      <div class="page-sub">Когда игры доступны, когда нет</div>
    </div>

    <div class="schedule-block">
      <div class="schedule-status" id="scheduleStatus">
        <div class="dot"></div>
        <strong id="scheduleStatusText">—</strong>
        <span id="scheduleCurrentTime">—</span>
      </div>

      <div class="schedule-row">
        <div class="schedule-input-group">
          <label>Открытие — час</label>
          <input type="number" id="openHour" min="0" max="23" value="8">
        </div>
        <div class="schedule-input-group">
          <label>Открытие — минуты</label>
          <input type="number" id="openMinute" min="0" max="59" value="30">
        </div>
        <div class="schedule-input-group">
          <label>Закрытие — час</label>
          <input type="number" id="closeHour" min="0" max="23" value="17">
        </div>
        <div class="schedule-input-group">
          <label>Закрытие — минуты</label>
          <input type="number" id="closeMinute" min="0" max="59" value="20">
        </div>
      </div>

      <div>
        <label style="display:block;font-size:11px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:rgba(255,255,255,0.5);margin-bottom:8px;">Режим принудительно</label>
        <div class="override-row">
          <button class="override-btn" data-override="auto">По расписанию</button>
          <button class="override-btn" data-override="open">Всегда открыто</button>
          <button class="override-btn" data-override="close">Всегда закрыто</button>
        </div>
      </div>

      <button class="save-schedule-btn" id="saveScheduleBtn">Сохранить расписание</button>
    </div>

  </main>
</div>

<script src="/static/admin-menu.js"></script>
<script>
const token = adminRequireToken();
renderAdminMenu('schedule');

let currentOverride = null;

async function loadSchedule(){
  try{
    const res = await adminApi('/admin/api/schedule');
    const s = res.schedule;
    document.getElementById('openHour').value = s.open_hour;
    document.getElementById('openMinute').value = s.open_minute;
    document.getElementById('closeHour').value = s.close_hour;
    document.getElementById('closeMinute').value = s.close_minute;
    currentOverride = s.force_override;
    renderOverrideButtons();
    renderScheduleStatus(res);
  }catch(e){}
}

function renderScheduleStatus(res){
  const el = document.getElementById('scheduleStatus');
  const txt = document.getElementById('scheduleStatusText');
  const cur = document.getElementById('scheduleCurrentTime');
  const s = res.schedule;
  if (res.is_open_now){
    el.classList.add('open'); el.classList.remove('closed');
    txt.textContent = 'Игры доступны';
  } else {
    el.classList.add('closed'); el.classList.remove('open');
    txt.textContent = 'Технический перерыв';
  }
  let mode = '';
  if (s.force_override === true) mode = ' · принудительно открыто';
  else if (s.force_override === false) mode = ' · принудительно закрыто';
  else mode = ' · по расписанию';
  cur.textContent = 'Сейчас: ' + new Date().toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'}) + mode;
}

function renderOverrideButtons(){
  document.querySelectorAll('.override-btn').forEach(b => {
    b.classList.remove('active', 'open-active', 'closed-active');
    const v = b.dataset.override;
    if (v === 'auto' && currentOverride === null) b.classList.add('active');
    else if (v === 'open' && currentOverride === true) b.classList.add('active', 'open-active');
    else if (v === 'close' && currentOverride === false) b.classList.add('active', 'closed-active');
  });
}

document.querySelectorAll('.override-btn').forEach(b => {
  b.addEventListener('click', async () => {
    const v = b.dataset.override;
    const val = v === 'auto' ? null : (v === 'open');
    try{
      const res = await adminApi('/admin/api/schedule', {
        method:'POST', body: JSON.stringify({force_override: val})
      });
      currentOverride = res.schedule.force_override;
      renderOverrideButtons();
      renderScheduleStatus(res);
    }catch(e){}
  });
});

document.getElementById('saveScheduleBtn').addEventListener('click', async () => {
  const body = {
    open_hour: parseInt(document.getElementById('openHour').value) || 0,
    open_minute: parseInt(document.getElementById('openMinute').value) || 0,
    close_hour: parseInt(document.getElementById('closeHour').value) || 0,
    close_minute: parseInt(document.getElementById('closeMinute').value) || 0,
  };
  try{
    const res = await adminApi('/admin/api/schedule', {method:'POST', body: JSON.stringify(body)});
    renderScheduleStatus(res);
    alert('Расписание сохранено');
  }catch(e){
    alert('Ошибка: ' + e.message);
  }
});

loadSchedule();
</script>

</body></html>
