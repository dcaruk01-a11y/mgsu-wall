<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Тетрис · Игры МГСУ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/static/site-header.css">
<style>
html,body{height:100%;}
body.tetris-page{
  height:100vh;
  height:100dvh;
  max-height:100dvh;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  user-select:none;
  -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}

.status-banner{
  position:fixed;top:0;left:0;right:0;z-index:99;
  background:#AC1422;color:#fff;padding:12px 20px;
  text-align:center;font-size:13px;font-weight:600;display:none;
}
.status-banner.show{display:block;}
.status-banner small{display:block;font-size:11px;font-weight:400;opacity:0.9;margin-top:2px;}

.tetris-stage{
  flex:1 1 auto;
  display:flex;
  flex-direction:column;
  min-height:0;
  padding:10px max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
  gap:8px;
}

.hud{
  flex:0 0 auto;
  display:flex;
  gap:8px;
  justify-content:center;
}
.hud-box{
  flex:1;
  max-width:130px;
  padding:6px 10px;
  border-radius:10px;
  background:rgba(128,128,128,0.12);
  border:1px solid rgba(128,128,128,0.22);
  text-align:center;
}
.hud-label{
  font-size:9px;font-weight:800;
  letter-spacing:0.1em;text-transform:uppercase;
  opacity:0.6;margin-bottom:2px;
}
.hud-value{
  font-size:18px;font-weight:800;
  font-variant-numeric:tabular-nums;
  color:inherit;line-height:1;
}
.hud-box.side{
  background:rgba(255,180,80,0.18);
  border-color:rgba(255,180,80,0.5);
  animation:sideBlink .8s ease-in-out infinite alternate;
}
@keyframes sideBlink{
  from{opacity:0.9;}
  to{opacity:1;box-shadow:0 0 12px rgba(255,180,80,0.5);}
}

.canvas-wrap{
  flex:1 1 auto;
  min-height:0;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}
canvas{
  display:block;
  background:#0a0f1e;
  border-radius:10px;
  border:1px solid rgba(128,128,128,0.25);
  box-shadow:0 12px 32px rgba(0,0,0,0.35);
  max-width:100%;
  max-height:100%;
}

.controls{
  flex:0 0 auto;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
  max-width:480px;
  width:100%;
  margin:0 auto;
}
.ctrl-btn{
  padding:14px 6px;
  border-radius:12px;
  border:1px solid rgba(128,128,128,0.25);
  background:rgba(128,128,128,0.12);
  color:inherit;
  font-family:inherit;
  font-size:22px;
  font-weight:700;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:transform .08s, background .15s;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
.ctrl-btn:active{transform:scale(0.94);background:rgba(128,128,128,0.28);}
.ctrl-btn.primary{
  background:rgba(111,168,255,0.20);
  border-color:rgba(111,168,255,0.45);
  font-size:14px;
  font-weight:800;
}

.overlay{
  position:absolute;inset:0;
  background:rgba(5,14,31,0.94);
  backdrop-filter:blur(10px);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:14px;padding:20px;text-align:center;
  z-index:20;transition:opacity .3s;
  border-radius:10px;
}
.overlay.hide{opacity:0;pointer-events:none;}
.overlay-emoji{font-size:56px;margin-bottom:2px;}
.overlay h2{font-size:22px;font-weight:800;color:#fff;letter-spacing:-0.02em;}
.overlay p{font-size:13px;color:rgba(255,255,255,0.7);max-width:320px;line-height:1.5;}
.overlay p b{color:#FFB347;}
.btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:12px 26px;border-radius:999px;
  background:#fff;color:#0F3C73;
  font-family:inherit;font-size:14px;font-weight:700;
  border:0;cursor:pointer;
  box-shadow:0 12px 30px rgba(0,0,0,0.3);
  transition:transform .1s;
}
.btn:active{transform:scale(0.97);}
.btn-ghost{background:rgba(255,255,255,0.08);color:#fff;border:1px solid rgba(255,255,255,0.2);box-shadow:none;}
.finish-score{font-size:48px;font-weight:900;letter-spacing:-0.04em;font-variant-numeric:tabular-nums;color:#fff;}
.finish-label{font-size:10px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:rgba(255,255,255,0.5);margin-bottom:6px;}
.finish-rank{font-size:20px;font-weight:800;color:#fff;}
.finish-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}

#progressBlock{
  display:none;width:100%;max-width:380px;
  padding:12px 16px;border-radius:12px;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.12);
  font-size:13px;text-align:left;line-height:1.5;
  color:#fff;
}
#progressBlock a{color:#4ADE80;text-decoration:none;font-weight:700;}

@media(max-width:520px){
  .hud-value{font-size:15px;}
  .hud-box{padding:5px 6px;max-width:100px;}
  .hud-label{font-size:8px;}
  .ctrl-btn{font-size:20px;padding:12px 4px;border-radius:10px;}
  .ctrl-btn.primary{font-size:12px;}
  .overlay-emoji{font-size:44px;}
  .overlay h2{font-size:19px;}
  .finish-score{font-size:40px;}
  .finish-rank{font-size:17px;}
}
@media(max-height:640px){
  .tetris-stage{padding:6px;gap:6px;}
  .hud-value{font-size:14px;}
  .hud-box{padding:4px 8px;}
  .ctrl-btn{padding:10px 4px;font-size:18px;}
  .ctrl-btn.primary{font-size:11px;}
}
</style>
</head><body class="tetris-page">

<div class="status-banner" id="statusBanner">
  🔒 Технический перерыв
  <small id="statusBannerSub">Игры доступны только в учебное время</small>
</div>

<div id="siteHeader"></div>

<div class="tetris-stage">

  <div class="hud">
    <div class="hud-box">
      <div class="hud-label">Линии</div>
      <div class="hud-value" id="hudLines">0</div>
    </div>
    <div class="hud-box">
      <div class="hud-label">Очки</div>
      <div class="hud-value" id="hudScore">0</div>
    </div>
    <div class="hud-box" id="levelBox">
      <div class="hud-label">Уровень</div>
      <div class="hud-value" id="hudLevel">1</div>
    </div>
  </div>

  <div class="canvas-wrap" id="canvasWrap">
    <canvas id="c"></canvas>

    <div class="overlay" id="startOv">
      <div class="overlay-emoji">🏗️</div>
      <h2>Тетрис · Здания</h2>
      <p>Складывай дома и башни МГСУ. Полные линии сгорают. Иногда фигуры летят <b>сбоку</b> — лови момент!</p>
      <button class="btn" id="startBtn">Начать стройку →</button>

      <div class="overlay-emoji" id="finishEmoji">🏗️</div>

      <div class="finish-rank" id="finishRank">Прораб</div>

      <div class="finish-actions">

  <div class="controls">
    <button class="ctrl-btn" id="btnLeft" aria-label="Влево">←</button>
    <button class="ctrl-btn" id="btnRotate" aria-label="Повернуть">↻</button>
    <button class="ctrl-btn" id="btnRight" aria-label="Вправо">→</button>
    <button class="ctrl-btn primary" id="btnDrop" aria-label="Ускорить">ВНИЗ</button>
  </div>

</div>

<script src="/static/site-header.js"></script>
<script>
renderSiteHeader('games');

/* ═══════════════════════════════════════════════════════════
   КОНСТАНТЫ
   ═══════════════════════════════════════════════════════════ */
const COLS = 10;
const ROWS = 20;
const EMPTY = 0;

const BASE_DROP_MS = 800;
const DROP_FACTOR = 0.85;
const MIN_DROP_MS = 60;

const SIDE_CHANCE = 0.18;
const SIDE_START_AFTER = 4;
const SIDE_MOVE_MIN_MS = 90;
const SIDE_MOVE_BASE_MS = 240;
const SIDE_MOVE_STEP = 10;

const SHAPES = {
  I: { matrix: [[1,1,1,1]], color: '#6FA8FF', type: 'tower' },
  O: { matrix: [[1,1],[1,1]], color: '#FFD700', type: 'house' },
  T: { matrix: [[0,1,0],[1,1,1]], color: '#B794F6', type: 'house' },
  S: { matrix: [[0,1,1],[1,1,0]], color: '#4ADE80', type: 'house' },
  Z: { matrix: [[1,1,0],[0,1,1]], color: '#FF4D5E', type: 'house' },
  J: { matrix: [[1,0,0],[1,1,1]], color: '#00C7BE', type: 'house' },
  L: { matrix: [[0,0,1],[1,1,1]], color: '#FF9500', type: 'house' },
};

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let CELL = 24;
let CW = 0, CH = 0;

let board = [];
let current = null;
let nextShape = null;
let lines = 0;
let score = 0;
let level = 1;
let dropInterval = BASE_DROP_MS;
let dropTimer = 0;
let sideMoveTimer = 0;
let sideMoveInterval = SIDE_MOVE_BASE_MS;
let running = false;
let started = false;
let gameOver = false;
let lastFrame = 0;
let piecesSpawned = 0;

/* ═══════════════════════════════════════════════════════════
   РАСПИСАНИЕ
   ═══════════════════════════════════════════════════════════ */
let scheduleOpen = true;
async function checkScheduleStatus(){
  try{
    const r = await fetch('/status');
    const s = await r.json();
    scheduleOpen = !!s.open;
    const banner = document.getElementById('statusBanner');
    const sub = document.getElementById('statusBannerSub');
    if (!scheduleOpen){
      sub.textContent = 'Игры доступны только в учебное время: с ' + s.opens_at + ' до ' + s.closes_at;
      banner.classList.add('show');
    } else {
      banner.classList.remove('show');
    }
  }catch(e){}
}
checkScheduleStatus();
setInterval(checkScheduleStatus, 60000);

/* ═══════════════════════════════════════════════════════════
   ЗВУК
   ═══════════════════════════════════════════════════════════ */
let audioCtx = null;

function initAudio(){
  if (audioCtx) return;
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) audioCtx = new AC();
  }catch(e){}
}

function beep(freq, duration, type, volume, slideTo){
  if (!audioCtx) return;
  try{
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'square';
    osc.frequency.setValueAtTime(freq, t);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t + duration);
    gain.gain.setValueAtTime(volume || 0.08, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + duration + 0.02);
  }catch(e){}
}

const SFX = {
  rotate:    () => beep(500, 0.05, 'square', 0.05, 750),
  move:      () => beep(300, 0.03, 'square', 0.03),
  lock:      () => beep(180, 0.08, 'triangle', 0.07, 120),
  drop:      () => beep(260, 0.15, 'sawtooth', 0.09, 80),
  line1:     () => { beep(700, 0.08, 'square', 0.09); setTimeout(() => beep(950, 0.12, 'square', 0.09), 70); },
  line2:     () => { beep(700, 0.08, 'square', 0.09); setTimeout(() => beep(950, 0.08, 'square', 0.09), 70); setTimeout(() => beep(1200, 0.12, 'square', 0.09), 140); },
  line4:     () => { [660, 880, 1100, 1500].forEach((f, i) => setTimeout(() => beep(f, 0.12, 'square', 0.10), i * 80)); },
  levelup:   () => { beep(500, 0.1, 'triangle', 0.09, 900); setTimeout(() => beep(900, 0.15, 'triangle', 0.09, 1300), 100); },
  gameover:  () => { [500, 400, 300, 200, 100].forEach((f, i) => setTimeout(() => beep(f, 0.2, 'triangle', 0.10), i * 130)); },
  side:      () => beep(700, 0.08, 'triangle', 0.05, 1000),
};

/* ═══════════════════════════════════════════════════════════
   РАЗМЕР
   ═══════════════════════════════════════════════════════════ */
function resize(){
  const wrap = document.getElementById('canvasWrap');
  if (!wrap) return;
  const rect = wrap.getBoundingClientRect();
  const availW = rect.width - 4;
  const availH = rect.height - 4;
  const cellW = Math.floor(availW / COLS);
  const cellH = Math.floor(availH / ROWS);
  CELL = Math.max(11, Math.min(cellW, cellH, 36));
  CW = COLS * CELL;
  CH = ROWS * CELL;
  canvas.width = CW;
  canvas.height = CH;
  canvas.style.width = CW + 'px';
  canvas.style.height = CH + 'px';
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));

/* ═══════════════════════════════════════════════════════════
   ЛОГИКА
   ═══════════════════════════════════════════════════════════ */
function createBoard(){
  board = [];
  for (let r = 0; r < ROWS; r++){
    board.push(new Array(COLS).fill(EMPTY));
  }
}

function randomShapeKey(){
  const keys = Object.keys(SHAPES);
  return keys[Math.floor(Math.random() * keys.length)];
}

function makePiece(key, fromSide, sideDir){
  const s = SHAPES[key];
  const matrix = s.matrix.map(row => row.slice());

  let x, y, dir = 0;

  if (fromSide){
    dir = sideDir || (Math.random() < 0.5 ? 1 : -1);
    if (dir > 0){
      x = -matrix[0].length;
    } else {
      x = COLS;
    }
    y = 2 + Math.floor(Math.random() * Math.floor(ROWS * 0.45));
  } else {
    x = Math.floor((COLS - matrix[0].length) / 2);
    y = 0;
  }

  return {
    key, matrix,
    color: s.color,
    type: s.type,
    x, y,
    sideDir: dir,
    fromSide: !!fromSide,
  };
}

function rotateMatrix(m){
  const rows = m.length, cols = m[0].length;
  const out = [];
  for (let c = 0; c < cols; c++){
    const newRow = [];
    for (let r = rows - 1; r >= 0; r--){
      newRow.push(m[r][c]);
    }
    out.push(newRow);
  }
  return out;
}

// Обычная коллизия (для фигур сверху)
function collides(piece, offX, offY, matrix){
  const m = matrix || piece.matrix;
  for (let r = 0; r < m.length; r++){
    for (let c = 0; c < m[r].length; c++){
      if (!m[r][c]) continue;
      const x = piece.x + c + (offX || 0);
      const y = piece.y + r + (offY || 0);
      if (x < 0 || x >= COLS || y >= ROWS) return true;
      if (y >= 0 && board[y][x] !== EMPTY) return true;
    }
  }
  return false;
}

/* ── Коллизия для боковой фигуры ──
   Проверяет только клетки на поле. Игнорирует клетки за пределами
   (те, что ещё не вошли или уже вышли). */
function sideCollides(piece, offX){
  const m = piece.matrix;
  const off = offX || 0;
  for (let r = 0; r < m.length; r++){
    for (let c = 0; c < m[r].length; c++){
      if (!m[r][c]) continue;
      const x = piece.x + c + off;
      const y = piece.y + r;
      if (y < 0 || y >= ROWS) return true;
      if (x >= 0 && x < COLS && board[y][x] !== EMPTY) return true;
    }
  }
  return false;
}

/* Проверка: боковая фигура полностью прошла поле? */
function sideFullyPassed(piece){
  const m = piece.matrix;
  const dir = piece.sideDir;
  for (let r = 0; r < m.length; r++){
    for (let c = 0; c < m[r].length; c++){
      if (!m[r][c]) continue;
      const x = piece.x + c;
      if (dir > 0 && x < COLS) return false;
      if (dir < 0 && x >= 0) return false;
    }
  }
  return true;
}

/* Проверка: может ли боковая фигура ВООБЩЕ попасть на поле?
   Возвращаем true, если хотя бы при одной позиции x нет коллизии. */
function canSidePieceEnter(piece){
  const m = piece.matrix;
  const dir = piece.sideDir;
  const startX = piece.x;
  // Пробуем все возможные позиции
  for (let step = 0; step < COLS + m[0].length + 2; step++){
    const testX = startX + dir * step;
    let ok = true;
    for (let r = 0; r < m.length; r++){
      for (let c = 0; c < m[r].length; c++){
        if (!m[r][c]) continue;
        const x = testX + c;
        const y = piece.y + r;
        if (x >= 0 && x < COLS && y >= 0 && y < ROWS){
          if (board[y][x] !== EMPTY){ ok = false; break; }
        }
      }
      if (!ok) break;
    }
    if (ok) return true;
  }
  return false;
}

function lockPiece(){
  let lockedAny = false;
  for (let r = 0; r < current.matrix.length; r++){
    for (let c = 0; c < current.matrix[r].length; c++){
      if (current.matrix[r][c]){
        const x = current.x + c;
        const y = current.y + r;
        if (y >= 0 && y < ROWS && x >= 0 && x < COLS){
          board[y][x] = current.color;
          lockedAny = true;
        }
      }
    }
  }
  if (lockedAny) SFX.lock();
  clearLines();
  spawnPiece();
}

function clearLines(){
  let cleared = 0;
  for (let r = ROWS - 1; r >= 0; r--){
    if (board[r].every(cell => cell !== EMPTY)){
      board.splice(r, 1);
      board.unshift(new Array(COLS).fill(EMPTY));
      cleared++;
      r++;
    }
  }
  if (cleared > 0){
    lines += cleared;
    const points = [0, 100, 300, 500, 800][cleared] || 800;
    score += points * level;

    if (cleared === 4) SFX.line4();
    else if (cleared === 2) SFX.line2();
    else SFX.line1();

    const newLevel = Math.floor(lines / 5) + 1;
    if (newLevel > level){
      level = newLevel;
      dropInterval = Math.max(MIN_DROP_MS, BASE_DROP_MS * Math.pow(DROP_FACTOR, level - 1));
      sideMoveInterval = Math.max(SIDE_MOVE_MIN_MS, SIDE_MOVE_BASE_MS - (level - 1) * SIDE_MOVE_STEP);
      SFX.levelup();
    }
    updateHud();
  }
}

function updateHud(){
  document.getElementById('hudLines').textContent = lines;
  document.getElementById('hudScore').textContent = score;
  document.getElementById('hudLevel').textContent = level;

  const levelBox = document.getElementById('levelBox');
  if (current && current.fromSide){
    levelBox.classList.add('side');
  } else {
    levelBox.classList.remove('side');
  }
}

/* ═══════════════════════════════════════════════════════════
   ★ ИСПРАВЛЕННЫЙ spawnPiece ★
   Больше НЕ вызываем endGame() для боковых фигур.
   Если боковая не может войти — спавним обычную сверху.
   ═══════════════════════════════════════════════════════════ */
function spawnPiece(){
  const key = nextShape || randomShapeKey();
  nextShape = randomShapeKey();
  piecesSpawned++;

  let fromSide = false;
  let sideDir = 0;

  if (piecesSpawned >= SIDE_START_AFTER && Math.random() < SIDE_CHANCE){
    sideDir = Math.random() < 0.5 ? 1 : -1;
    // Пробная фигура — проверим, сможет ли она войти
    const testPiece = makePiece(key, true, sideDir);
    if (canSidePieceEnter(testPiece)){
      fromSide = true;
    }
  }

  current = makePiece(key, fromSide, sideDir);

  // ★ ГЛАВНЫЙ ФИКС: проверяем коллизию ТОЛЬКО для обычных фигур
  if (!fromSide){
    if (collides(current, 0, 0)){
      endGame();
      return;
    }
  } else {
    SFX.side();
  }

  updateHud();
  draw();
}

/* ── Управление ── */
function move(dir){
  if (!running || !current) return;
  if (current.fromSide) return;
  if (!collides(current, dir, 0)){
    current.x += dir;
    draw();
    SFX.move();
  }
}

function rotate(){
  if (!running || !current) return;
  const rotated = rotateMatrix(current.matrix);
  if (!collides(current, 0, 0, rotated)){
    current.matrix = rotated;
    draw();
    SFX.rotate();
    return;
  }
  if (!collides(current, -1, 0, rotated)){
    current.matrix = rotated;
    current.x -= 1;
    draw();
    SFX.rotate();
  } else if (!collides(current, 1, 0, rotated)){
    current.matrix = rotated;
    current.x += 1;
    draw();
    SFX.rotate();
  }
}

function drop(){
  if (!running || !current) return;
  if (current.fromSide) return;
  if (!collides(current, 0, 1)){
    current.y += 1;
  } else {
    lockPiece();
  }
  draw();
}

function hardDrop(){
  if (!running || !current) return;

  if (current.fromSide){
    SFX.drop();
    let safety = COLS + 2;
    while (safety-- > 0){
      if (sideCollides(current, current.sideDir)) break;
      current.x += current.sideDir;
      score += 2;
    }
    if (sideFullyPassed(current)){
      current = null;
      spawnPiece();
    } else {
      lockPiece();
    }
  } else {
    SFX.drop();
    while (!collides(current, 0, 1)){
      current.y += 1;
      score += 2;
    }
    lockPiece();
  }
  updateHud();
  draw();
}

/* ═══════════════════════════════════════════════════════════
   РИСОВАНИЕ
   ═══════════════════════════════════════════════════════════ */
function drawBuilding(x, y, color){
  const px = x * CELL;
  const py = y * CELL;
  ctx.fillStyle = color;
  ctx.fillRect(px + 1, py + 1, CELL - 2, CELL - 2);
  ctx.strokeStyle = 'rgba(0,0,0,0.35)';
  ctx.lineWidth = 1;
  ctx.strokeRect(px + 1.5, py + 1.5, CELL - 3, CELL - 3);
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.fillRect(px + 3, py + 2, CELL - 6, Math.max(2, CELL * 0.12));
  if (CELL >= 18){
    const winSize = Math.max(3, CELL * 0.18);
    const gap = Math.max(2, CELL * 0.10);
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    for (let wy = 0; wy < 2; wy++){
      for (let wx = 0; wx < 2; wx++){
        const wxp = px + gap + 2 + wx * (winSize + gap);
        const wyp = py + gap + CELL * 0.22 + wy * (winSize + gap);
        if (wxp + winSize < px + CELL - 2 && wyp + winSize < py + CELL - 2){
          ctx.fillRect(wxp, wyp, winSize, winSize);
        }
      }
    }
  }
}

function drawGrid(){
  ctx.fillStyle = '#0a0f1e';
  ctx.fillRect(0, 0, CW, CH);
  ctx.strokeStyle = 'rgba(128,128,128,0.06)';
  ctx.lineWidth = 1;
  for (let c = 0; c <= COLS; c++){
    ctx.beginPath();
    ctx.moveTo(c * CELL, 0);
    ctx.lineTo(c * CELL, CH);
    ctx.stroke();
  }
  for (let r = 0; r <= ROWS; r++){
    ctx.beginPath();
    ctx.moveTo(0, r * CELL);
    ctx.lineTo(CW, r * CELL);
    ctx.stroke();
  }
}

function draw(){
  drawGrid();

  for (let r = 0; r < ROWS; r++){
    for (let c = 0; c < COLS; c++){
      if (board[r][c] !== EMPTY){
        drawBuilding(c, r, board[r][c]);
      }
    }
  }

  if (current && running){
    // Ghost — только для обычных
    if (!current.fromSide){
      let ghostY = 0;
      while (!collides(current, 0, ghostY + 1)) ghostY++;
      ctx.globalAlpha = 0.18;
      for (let r = 0; r < current.matrix.length; r++){
        for (let c = 0; c < current.matrix[r].length; c++){
          if (current.matrix[r][c]){
            const x = (current.x + c) * CELL;
            const y = (current.y + r + ghostY) * CELL;
            ctx.fillStyle = current.color;
            ctx.fillRect(x + 1, y + 1, CELL - 2, CELL - 2);
          }
        }
      }
      ctx.globalAlpha = 1;
    }

    // Фигура (рисуем только клетки внутри поля)
    for (let r = 0; r < current.matrix.length; r++){
      for (let c = 0; c < current.matrix[r].length; c++){
        if (current.matrix[r][c]){
          const x = current.x + c;
          if (x >= 0 && x < COLS){
            drawBuilding(x, current.y + r, current.color);
          }
        }
      }
    }

    // Стрелка-подсказка для боковой
    if (current.fromSide){
      ctx.save();
      ctx.globalAlpha = 0.7;
      ctx.fillStyle = '#FFB347';
      ctx.font = 'bold ' + Math.max(20, CELL * 1.4) + 'px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const arrow = current.sideDir > 0 ? '▶' : '◀';
      const arrowX = current.sideDir > 0 ? CW - CELL * 1.3 : CELL * 1.3;
      const arrowY = CH / 2;
      ctx.fillText(arrow, arrowX, arrowY);
      ctx.restore();
    }
  }
}

/* ═══════════════════════════════════════════════════════════
   ЦИКЛ
   ═══════════════════════════════════════════════════════════ */
function loop(now){
  requestAnimationFrame(loop);
  if (!running) return;
  const dt = now - lastFrame;
  lastFrame = now;

  if (current && current.fromSide){
    sideMoveTimer += dt;
    if (sideMoveTimer > sideMoveInterval){
      sideMoveTimer = 0;

      // ★ Если фигура полностью прошла поле — удаляем
      if (sideFullyPassed(current)){
        current = null;
        spawnPiece();
        return;
      }

      // ★ Проверяем следующий шаг
      if (sideCollides(current, current.sideDir)){
        // Упёрлась — фиксируем
        lockPiece();
      } else {
        current.x += current.sideDir;
        draw();
      }
    }
  } else {
    dropTimer += dt;
    if (dropTimer > dropInterval){
      dropTimer = 0;
      drop();
    }
  }
}

/* ═══════════════════════════════════════════════════════════
   СТАРТ / КОНЕЦ
   ═══════════════════════════════════════════════════════════ */
function startGame(){
  if (!scheduleOpen){ checkScheduleStatus(); return; }

  initAudio();
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});

  createBoard();
  lines = 0;
  score = 0;
  level = 1;
  dropInterval = BASE_DROP_MS;
  dropTimer = 0;
  sideMoveTimer = 0;
  sideMoveInterval = SIDE_MOVE_BASE_MS;
  piecesSpawned = 0;
  running = true;
  started = true;
  gameOver = false;
  nextShape = randomShapeKey();
  spawnPiece();
  updateHud();
  resize();
  document.getElementById('startOv').classList.add('hide');
  document.getElementById('finishOv').classList.add('hide');
  document.getElementById('progressBlock').style.display = 'none';
  lastFrame = performance.now();
  draw();
}

function rankFor(s){
  if (s < 500) return {name:'Подмастерье', emoji:'🧱'};
  if (s < 1500) return {name:'Каменщик', emoji:'🧱'};
  if (s < 3000) return {name:'Прораб', emoji:'👷'};
  if (s < 6000) return {name:'Инженер', emoji:'🏗️'};
  if (s < 12000) return {name:'Архитектор', emoji:'📐'};
  return {name:'Зодчий МГСУ', emoji:'👑'};
}

async function endGame(){
  running = false;
  gameOver = true;
  const r = rankFor(score);
  document.getElementById('finishEmoji').textContent = r.emoji;
  document.getElementById('finishScore').textContent = score;
  document.getElementById('finishRank').textContent = r.name;
  document.getElementById('finishOv').classList.remove('hide');
  SFX.gameover();
  draw();

  const token = localStorage.getItem('mgsu_token') || '';
  const block = document.getElementById('progressBlock');
  if (block){ block.style.display = 'block'; block.textContent = 'Отправляю результат…'; }
  try{
    const headers = {'Content-Type':'application/json'};
    if (token) headers['Authorization'] = 'Bearer ' + token;
    const res = await fetch('/api/game/finish', {
      method:'POST', headers,
      body: JSON.stringify({game: 'tetris', raw_score: score})
    });
    const data = await res.json();
    renderProgress(data);
  }catch(e){ if (block) block.style.display = 'none'; }
}

function renderProgress(data){
  const block = document.getElementById('progressBlock');
  if (!block) return;
  if (!data.logged_in){
    block.innerHTML = '💡 Хочешь монеты и топ? <a href="/auth">Создай аккаунт</a>';
    return;
  }
  let html = '<div>🎯 Очков: <b>+' + data.points + '</b></div>';
  if (data.daily_plays && data.daily_multiplier !== undefined && data.daily_multiplier < 1){
    html += '<div style="color:#FFB347;">📉 ' + data.daily_plays + '-я партия — награда ×' + data.daily_multiplier + '</div>';
  }
  if (data.progress){
    html += '<div>💰 Монет: <b>' + data.progress.coins + '</b></div>';
    html += '<div>🔥 Серия: <b>' + data.progress.streak + '</b> дней';
    if (data.progress.streak_changed) html += ' <span style="color:#4ADE80;">+1</span>';
    html += '</div>';
  }
  if (data.tasks_completed && data.tasks_completed.length){
    data.tasks_completed.forEach(t => { html += '<div style="color:#4ADE80;">✓ ' + t.text + ' (+' + t.reward + ')</div>'; });
  }
  html += '<div style="margin-top:8px;"><a href="/profile">Открыть профиль →</a></div>';
  block.innerHTML = html;
}

/* ═══════════════════════════════════════════════════════════
   УПРАВЛЕНИЕ
   ═══════════════════════════════════════════════════════════ */
document.getElementById('btnLeft').onclick = () => move(-1);
document.getElementById('btnRight').onclick = () => move(1);
document.getElementById('btnRotate').onclick = () => rotate();
document.getElementById('btnDrop').onclick = () => hardDrop();

document.addEventListener('keydown', function(e){
  if (!running) return;
  if (e.code === 'ArrowLeft'){ e.preventDefault(); move(-1); }
  else if (e.code === 'ArrowRight'){ e.preventDefault(); move(1); }
  else if (e.code === 'ArrowUp'){ e.preventDefault(); rotate(); }
  else if (e.code === 'ArrowDown'){ e.preventDefault(); drop(); }
  else if (e.code === 'Space'){ e.preventDefault(); hardDrop(); }
});

let touchX = 0, touchY = 0, touchTime = 0;
canvas.addEventListener('touchstart', function(e){
  if (!running) return;
  const t = e.touches[0];
  touchX = t.clientX; touchY = t.clientY;
  touchTime = Date.now();
}, {passive: true});
canvas.addEventListener('touchend', function(e){
  if (!running) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - touchX;
  const dy = t.clientY - touchY;
  const dt = Date.now() - touchTime;

  if (dt < 200 && Math.abs(dx) < 20 && Math.abs(dy) < 20){
    rotate();
    return;
  }
  if (Math.abs(dx) > 30 && Math.abs(dx) > Math.abs(dy)){
    move(dx > 0 ? 1 : -1);
  } else if (dy > 40 && Math.abs(dx) < 40){
    hardDrop();
  }
}, {passive: true});

document.getElementById('startBtn').onclick = startGame;
document.getElementById('againBtn').onclick = startGame;
document.getElementById('shareBtn').onclick = async () => {
  const text = `Собрал ${lines} линий и набрал ${score} очков в «Тетрисе МГСУ»! А ты?\nhttps://mgsu-wall.onrender.com/games/tetris`;
  try{
    if (navigator.share) await navigator.share({text});
    else await navigator.clipboard.writeText(text);
  }catch(e){}
};

window.addEventListener('load', () => setTimeout(resize, 100));
setTimeout(resize, 200);
resize();
createBoard();
draw();
requestAnimationFrame(loop);
window.addEventListener('resize', () => { resize(); draw(); });
</script>
