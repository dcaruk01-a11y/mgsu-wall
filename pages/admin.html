<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Админка · Игры МГСУ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="/static/style.css">
<style>
body{background:#0a0f1e;color:#fff;}
.admin-wrap{max-width:1100px;margin:0 auto;padding:32px 24px;}
.login-card{
  max-width:420px;margin:80px auto;padding:40px 32px;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.14);
  border-radius:16px;
  backdrop-filter:blur(14px);
}
.login-card h1{font-size:24px;margin-bottom:8px;color:#fff;}
.login-card p{font-size:14px;color:rgba(255,255,255,0.6);margin-bottom:28px;}
.admin-input{
  width:100%;padding:14px 18px;border-radius:10px;
  border:1px solid rgba(255,255,255,0.18);
  background:rgba(255,255,255,0.06);
  color:#fff;font-family:inherit;font-size:15px;outline:none;
}
.admin-input:focus{border-color:rgba(255,255,255,0.5);}
  .pw-wrap{position:relative;}
.pw-wrap .admin-input{padding-right:52px;}
.pw-toggle{
  position:absolute;top:50%;right:14px;transform:translateY(-50%);
  width:32px;height:32px;border:0;background:transparent;
  color:rgba(255,255,255,0.55);cursor:pointer;border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  transition:color .15s,background .15s;
}
.pw-toggle:hover{color:#fff;background:rgba(255,255,255,0.08);}
.pw-toggle svg{width:18px;height:18px;}
.admin-btn{
  width:100%;padding:14px;margin-top:14px;
  border-radius:10px;border:0;background:#fff;color:#0F3C73;
  font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;
  transition:transform .1s;
}
.admin-btn:hover{transform:translateY(-1px);}
.admin-err{
  color:#FF4D5E;font-size:13px;margin-top:12px;min-height:18px;
}
.hide{display:none !important;}

.admin-header{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:32px;
}
.admin-title{font-size:26px;font-weight:800;color:#fff;}
.admin-sub{font-size:13px;color:rgba(255,255,255,0.5);margin-top:4px;}

.grid-stats{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
  gap:14px;margin-bottom:32px;
}
.stat-card{
  padding:20px;border-radius:12px;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.10);
}
.stat-label{font-size:11px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:rgba(255,255,255,0.5);margin-bottom:10px;}
.stat-value{font-size:28px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums;}
.stat-sub{font-size:12px;color:rgba(255,255,255,0.4);margin-top:4px;}

.section-admin{margin-bottom:32px;}
.section-admin h2{font-size:18px;font-weight:700;color:#fff;margin-bottom:16px;}

.game-row{
  display:flex;align-items:center;gap:16px;
  padding:14px 18px;border-radius:10px;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.08);
  margin-bottom:8px;
}
.game-row .name{flex:1;font-size:15px;font-weight:600;}
.switch{
  position:relative;width:52px;height:30px;
  background:rgba(255,255,255,0.15);border-radius:999px;
  cursor:pointer;transition:background .15s;
}
.switch::after{
  content:'';position:absolute;top:3px;left:3px;
  width:24px;height:24px;border-radius:50%;
  background:#fff;transition:transform .2s;
}
.switch.on{background:#4ADE80;}
.switch.on::after{transform:translateX(22px);}

.link-row{
  display:flex;justify-content:space-between;padding:12px 16px;
  border-bottom:1px solid rgba(255,255,255,0.06);
  font-size:14px;
}
.link-row:last-child{border-bottom:none;}
.link-row a{color:#6FA8FF;text-decoration:none;}
.link-row a:hover{text-decoration:underline;}

.card-block{
  padding:20px;border-radius:12px;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.10);
}

.theme-row{display:flex;gap:10px;margin-top:8px;}
.theme-btn{
  padding:10px 18px;border-radius:999px;
  border:1px solid rgba(255,255,255,0.2);
  background:rgba(255,255,255,0.06);
  color:#fff;font-family:inherit;font-size:13px;font-weight:600;
  cursor:pointer;transition:all .15s;
}
.theme-btn.active{background:#fff;color:#0F3C73;border-color:#fff;}
.theme-btn.disabled{opacity:0.4;cursor:not-allowed;}

.logout-btn{
  padding:10px 20px;border-radius:999px;
  border:1px solid rgba(255,255,255,0.2);
  background:transparent;color:#fff;font-family:inherit;
  font-size:13px;font-weight:600;cursor:pointer;
}
.logout-btn:hover{background:rgba(255,255,255,0.1);}
</style>
</head><body>

<div id="loginView" class="admin-wrap">
  <div class="login-card">
    <h1>Админка Игр МГСУ</h1>
    <p>Доступ только для разработчика проекта.</p>
    <div class="pw-wrap">
  <input type="password" id="pwInput" class="admin-input" placeholder="Пароль" autocomplete="current-password">
  <button type="button" class="pw-toggle" id="pwToggle" aria-label="Показать пароль">
    <svg id="eyeOpen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
      <circle cx="12" cy="12" r="3"></circle>
    </svg>
    <svg id="eyeClosed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
      <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
      <line x1="1" y1="1" x2="23" y2="23"></line>
    </svg>
  </button>
</div>
    <button class="admin-btn" id="loginBtn">Войти</button>
    <div class="admin-err" id="loginErr"></div>
  </div>
</div>

<div id="dashView" class="admin-wrap hide">
  <div class="admin-header">
    <div>
      <div class="admin-title">Дашборд</div>
      <div class="admin-sub" id="uptimeLabel">—</div>
    </div>
    <button class="logout-btn" id="logoutBtn">Выйти</button>
  </div>

  <div class="grid-stats" id="statsGrid"></div>

  <div class="section-admin">
    <h2>Игры</h2>
    <div class="card-block" id="gamesBox">Загрузка…</div>
  </div>

  <div class="section-admin">
    <h2>Тема оформления</h2>
    <div class="card-block">
      <div class="theme-row" id="themeRow">
        <button class="theme-btn active" data-theme="classic">Классика (синий / белый)</button>
        <button class="theme-btn disabled" data-theme="cyberpunk" disabled>Киберпанк (скоро)</button>
      </div>
    </div>
  </div>

  <div class="section-admin">
    <h2>Топ кликера сегодня</h2>
    <div class="card-block" id="clickerTopBox">Загрузка…</div>
  </div>

  <div class="section-admin">
    <h2>Все ссылки</h2>
    <div class="card-block" style="padding:0;" id="linksBox"></div>
  </div>
</div>

<script>
const LS_KEY = 'mgsu_admin_token';
let token = localStorage.getItem(LS_KEY) || '';
let refreshTimer = null;

const loginView = document.getElementById('loginView');
const dashView = document.getElementById('dashView');
const pwInput = document.getElementById('pwInput');
const loginBtn = document.getElementById('loginBtn');
const loginErr = document.getElementById('loginErr');
const logoutBtn = document.getElementById('logoutBtn');
const pwToggle = document.getElementById('pwToggle');
const eyeOpen = document.getElementById('eyeOpen');
const eyeClosed = document.getElementById('eyeClosed');

/* глазик */
if (pwToggle && eyeOpen && eyeClosed){
  pwToggle.addEventListener('click', (e) => {
    e.preventDefault();
    const isPw = pwInput.type === 'password';
    pwInput.type = isPw ? 'text' : 'password';
    eyeOpen.style.display = isPw ? 'none' : 'block';
    eyeClosed.style.display = isPw ? 'block' : 'none';
    pwInput.focus();
  });
}

function showDash(){
  loginView.classList.add('hide');
  dashView.classList.remove('hide');
  refreshAll();
  if (refreshTimer) clearInterval(refreshTimer);
  refreshTimer = setInterval(refreshAll, 5000);
}
function showLogin(){
  dashView.classList.add('hide');
  loginView.classList.remove('hide');
  if (refreshTimer) clearInterval(refreshTimer);
}

async function api(path, opts = {}){
  const headers = Object.assign({'Content-Type':'application/json'}, opts.headers || {});
  if (token) headers['Authorization'] = 'Bearer ' + token;
  const res = await fetch(path, Object.assign({}, opts, {headers}));
  if (res.status === 401){
    localStorage.removeItem(LS_KEY);
    token = '';
    showLogin();
    throw new Error('unauthorized');
  }
  return res.json();
}

async function doLogin(){
  const pw = pwInput.value;
  loginErr.textContent = '';
  if (!pw){
    loginErr.textContent = 'Введите пароль';
    return;
  }
  loginErr.textContent = 'Проверяю...';
  try{
    const res = await fetch('/admin/api/login', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({password: pw})
    });
    const data = await res.json();
    if (data.ok){
      token = data.token;
      localStorage.setItem(LS_KEY, token);
      showDash();
    } else {
      loginErr.textContent = 'Неверный пароль. В Render значение должно быть ровно: mgsu-admin-2026-mgsu';
      pwInput.value = '';
      pwInput.focus();
    }
  }catch(e){
    loginErr.textContent = 'Ошибка соединения: ' + e.message;
  }
}

loginBtn.addEventListener('click', doLogin);
pwInput.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

logoutBtn.addEventListener('click', async () => {
  try{ await api('/admin/api/logout', {method:'POST'}); }catch(e){}
  localStorage.removeItem(LS_KEY);
  token = '';
  showLogin();
});

function fmtUptime(sec){
  if (!sec && sec !== 0) return '—';
  const d = Math.floor(sec / 86400);
  const h = Math.floor((sec % 86400) / 3600);
  const m = Math.floor((sec % 3600) / 60);
  if (d > 0) return d + 'д ' + h + 'ч';
  if (h > 0) return h + 'ч ' + m + 'м';
  return m + 'м';
}

async function refreshAll(){
  try{
    const s = await api('/admin/api/stats');
    renderStats(s);
    renderClickerTop(s.clicker_top || []);
    const g = await api('/admin/api/games');
    renderGames(g.games);
    renderTheme(g.theme);
    renderLinks();
  }catch(e){}
}

function renderStats(s){
  document.getElementById('uptimeLabel').textContent = 'Сервер работает: ' + fmtUptime(s.uptime_sec);
  const grid = document.getElementById('statsGrid');
  const memPct = s.memory_mb ? Math.round(s.memory_mb / 512 * 100) : null;
  const cards = [
    {label:'Онлайн', value: s.online, sub:'WebSocket-подключений'},
    {label:'Заходов сегодня', value: s.visits_today, sub:'страница /games'},
    {label:'Уникальных', value: s.uniques_today, sub:'по UID в браузере'},
    {label:'Память', value: s.memory_mb !== null ? s.memory_mb + ' МБ' : '—', sub: memPct !== null ? memPct + '% от 512 МБ' : ''},
    {label:'CPU', value: s.cpu_pct !== null ? s.cpu_pct + '%' : '—', sub:'загрузка'},
    {label:'Игр сыграно', value: Object.values(s.games_played).reduce((a,b)=>a+b,0), sub:'за сегодня'},
  ];
  grid.innerHTML = '';
  cards.forEach(c => {
    const el = document.createElement('div');
    el.className = 'stat-card';
    el.innerHTML = '<div class="stat-label">' + c.label + '</div>'
                 + '<div class="stat-value">' + c.value + '</div>'
                 + '<div class="stat-sub">' + c.sub + '</div>';
    grid.appendChild(el);
  });
  const perGame = Object.entries(s.games_played).filter(([k,v]) => v > 0).map(([k,v]) => k + ': ' + v).join(' · ');
  if (perGame){
    const el = document.createElement('div');
    el.className = 'stat-card';
    el.style.gridColumn = '1 / -1';
    el.innerHTML = '<div class="stat-label">По играм</div><div style="font-size:14px;color:#fff;margin-top:4px;">' + perGame + '</div>';
    grid.appendChild(el);
  }
}

function renderClickerTop(top){
  const box = document.getElementById('clickerTopBox');
  if (!top.length){
    box.innerHTML = '<div style="color:rgba(255,255,255,0.4);font-size:14px;">Пока никого</div>';
    return;
  }
  box.innerHTML = '';
  top.forEach((e, i) => {
    const row = document.createElement('div');
    row.className = 'link-row';
    row.innerHTML = '<span>#' + (i+1) + ' <b>' + escapeHtml(e.nick) + '</b></span>'
                  + '<span>' + e.score + ' — ' + escapeHtml(e.rank) + '</span>';
    box.appendChild(row);
  });
}

function renderGames(games){
  const box = document.getElementById('gamesBox');
  box.innerHTML = '';
  games.forEach(g => {
    const row = document.createElement('div');
    row.className = 'game-row';
    row.innerHTML = '<span class="name">' + escapeHtml(g.title) + ' <span style="color:rgba(255,255,255,0.4);font-size:12px;">(' + g.key + ')</span></span>';
    const sw = document.createElement('div');
    sw.className = 'switch' + (g.enabled ? ' on' : '');
    sw.onclick = async () => {
      const newVal = !sw.classList.contains('on');
      sw.classList.toggle('on', newVal);
      try{
        await api('/admin/api/games', {method:'POST', body: JSON.stringify({key: g.key, enabled: newVal})});
      }catch(e){}
    };
    row.appendChild(sw);
    box.appendChild(row);
  });
}

function renderTheme(theme){
  document.querySelectorAll('.theme-btn').forEach(b => {
    if (b.dataset.theme === theme) b.classList.add('active');
    else b.classList.remove('active');
  });
}

document.querySelectorAll('.theme-btn').forEach(b => {
  b.addEventListener('click', async () => {
    if (b.classList.contains('disabled')) return;
    const theme = b.dataset.theme;
    try{
      await api('/admin/api/theme', {method:'POST', body: JSON.stringify({theme})});
      renderTheme(theme);
    }catch(e){}
  });
});

function renderLinks(){
  const host = location.origin;
  const links = [
    {label:'Главная (Игры)', url: host + '/games'},
    {label:'Стена (рисовалка)', url: host + '/'},
    {label:'Киоск', url: host + '/kiosk'},
    {label:'Кликер', url: host + '/clicker'},
    {label:'О проекте', url: host + '/privacy'},
    {label:'Статус (API)', url: host + '/status'},
    {label:'Снимок вручную', url: host + '/snapshot'},
    {label:'Проверка пароля', url: host + '/admin/api/check'},
    {label:'GitHub', url: 'https://github.com/dcaruk01-a11y/mgsu-wall'},
    {label:'Render', url: 'https://dashboard.render.com/web/srv-dani0ajtqb8s73c05vug'},
    {label:'Telegram-канал', url: 'https://t.me/mgsu_wall_archive'},
    {label:'Feedback-бот', url: 'https://t.me/mgsu_feedback_bot'},
  ];
  const box = document.getElementById('linksBox');
  box.innerHTML = '';
  links.forEach(l => {
    const row = document.createElement('div');
    row.className = 'link-row';
    row.innerHTML = '<span>' + l.label + '</span><a href="' + l.url + '" target="_blank" rel="noopener">открыть →</a>';
    box.appendChild(row);
  });
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

if (token) showDash(); else showLogin();
</script>

</body></html>
